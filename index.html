 verme.","s":[{"h":"İsnad İncelemesinin Mertebeleri","b":[{"k":"p","x":"Birtakım hadisler vardır ki bunların senedlerini araştırmaya ihtiyacımız yoktur. Çünkü ilelü’l-hadîs gibi hadis ilminin ince meselelerinde usta olan büyük hadis âlimleri büyük bir dikkat ve ustalıkla işi çözmüş ve bu senedlerin ve metinlerin hükmünü belirtmişlerdir. İşte bu sebeple bizim tekrar araştırmamıza gerek yoktur."},{"k":"p","x":"İşte hadis âlimlerinin araştırdığı bu hadisler şunlardır:"},{"k":"steps","x":["**Buhârî ve Müslim’de bulunan hadisler**","**Sıhhati iltizam eden kitaplar**","**Muteber ulemanın sıhhatine hükmettiği hadisler**","**Hadis ulemasının hüküm verip mertebesini belirttiği hadisler**"]}]},{"h":"Buhârî ve Müslim’de Bulunan Hadisler","b":[{"k":"p","x":"Buhârî ve Müslim bir hadisi kitaplarına alırken zayıf ve metruk râvileri ihtiva etmeyen, sağlam bir senede sahip olan ve ayrıca gizli illetlerden salim olan sahih hadisleri tahric etmeyi amaçlamışlardır. Dolayısıyla bir hadise sıhhat derecesini vermek için hadisin Buhârî ve Müslim’de geçmesi yeterlidir. Senedinin araştırılmasına ihtiyaç yoktur. Çünkü zaten bir hadisi araştırmaktan maksadımız hadisin sahih olup olmadığını bilmektir, Sahîhayn ise zaten sahih hadisleri ihtiva etmektedir."},{"k":"dikkat","x":"Günümüzde birtakım bilimsel-araştırmacı gibi sıfatlarla ortaya çıkan ve Sahîhayn’da bazı zayıf hadisler olduğunu iddia eden kimselerin fitnelerine aldanılmamalıdır. Bu kimseler bu iddialarını ya hadis usulü kaideleri çerçevesinde yaptıklarını iddia ettikleri birtakım ilmî araştırmalarla veya bazı hadislerin akla -onların akıllarına- muhalif olduğundan hareketle veya kendilerince bazı müspet (tıp gibi) ilimlerin ortaya koyduğu tabiat kanunlarına muhalif olduğu gerekçeleriyle desteklemek istemektedir."},{"k":"p","x":"Bunu yapan kimseler iki gruptur. Bunlar ya hadis ilmine aşina olup bu yeterliliklerini ispat edip büyük âlimler olduklarını izhar etmek isteyen kimselerdir ki, bu ilimleriyle hadis imamlarını tahkik etme ve hatalarını ortaya koyma yeterliliğine sahip olduklarını düşünürler."},{"k":"p","x":"Bir diğer grup ise İslam düşmanları tarafından özel olarak kiralanmış, yetiştirilmiştir. Çoğu ise hadis ilmini bilmez. Onlar söylediklerini haram kazanmak için söylerler. Ve zahiri rahmet, içi ise azab dolu, kinle dolu, hileli başlıkları olan makale ve kitaplar yazarlar. Ve bu işlerini de sünnete hizmet ve onu şaibelerden kurtarmak maksadıyla yaptıklarını iddia ederler. Bu kitapların başlıklarını da"},{"k":"ar","a":"أَضْوَاءٌ عَلَى السُّنَّةِ الْمُحَمَّدِيَّةِ","x":""},{"k":"ar","a":"دِفَاعٌ عَنِ الْحَدِيثِ","x":""},{"k":"ar","a":"الْأَضْوَاءُ الْقُرْآنِيَّةُ فِي اكْتِسَاحِ الْأَحَادِيثِ الْإِسْرَائِيلِيَّةِ وَتَطْهِيرِ الْبُخَارِيِّ مِنْهَا","x":""},{"k":"p","x":"gibi isimler şeklinde koyarlar. Oysa bunlar hakikatte katmerli karanlıktır."},{"k":"h","x":"Ulemanın Sahîhayn hakkındaki sözleri"},{"k":"p","x":"Sahîhayn’da bulunan hadislerin sıhhatine dair ulemanın söylediği şu sözleri dinlememiz gerekir."},{"k":"p","x":"**Nevevî** Müslim şerhinin mukaddimesinde der ki: İçindeki hadislerin sahih olması konusunda Sahîhayn diğer kitaplardan ayrılır. Sahîhayn’da bulunan hadislerde araştırma yapılmaya ihtiyaç yoktur. Mutlak manada amel edilir. Ama diğer kitaplardaki hadislere gelince, bunlarda araştırma yapılmadan ve sıhhat şartlarını haiz olmadan amel edilmez."},{"k":"p","x":"**İbnü’s-Salâh** Ulûmü’l-hadîs adlı eserinde der ki: Buhârî ve Müslim’in ferd kaldığı hadisin sıhhatinde katiyyet vardır."},{"k":"not","x":"İbnü’s-Salâh Sahîhayn’daki hadislerin sahih olduğuyla yetinmez, bilakis hiçbir şüpheye yer kalmayacak şekilde katiyyet ifade ettiğini söyler."}]},{"h":"Sıhhati İltizam Eden Kitaplar","b":[{"k":"h","x":"Müstahreclerdeki ziyadeler ve tetimmeler"},{"k":"ar","a":"الزِّيَادَاتُ وَالتَّتِمَّاتُ الَّتِي فِي الْمُسْتَخْرَجَاتِ عَلَى الصَّحِيحَيْنِ","x":""},{"k":"p","x":"Müstahreclerin müellifleri eserlerinde Sahîhayn’a yaptıkları istihraçlarını da sahih senedlerle yapmışlardır."},{"k":"h","x":"İbn Huzeyme’nin Sahîh’i"},{"k":"p","x":"Bir hadise sahih hükmünü vermek için İbn Huzeyme’nin Sahîh’inde bulunmasıyla iktifa edilir. Çünkü müellif kitabında sadece sahih hadisleri almayı murad etmiştir."},{"k":"h","x":"İbn Hibbân’ın Sahîh’i"},{"k":"p","x":"Denilir ki; Sahîhayn ve İbn Huzeyme’den sonra en sahih eser İbn Hibbân’ınkidir. Fakat İbn Hibbân mütesâhildir."},{"k":"h","x":"İbnü’s-Seken’in Sahîh’i"},{"k":"p","x":"Kitapta senedler hazfedilmiştir. Müellif ahkâm noktasında lazım olan ve kendisince sahih olan tüm hadisleri bablar halinde almıştır."},{"k":"h","x":"Hâkim’in Müstedrek’i"},{"k":"p","x":"Hâkim bu eserinde Sahîhayn’da bulunan hadisler üzerine ziyadeler yapmış ve sahih bulduğu bu hadisleri toplamıştır. Sahîhayn’da olmayıp ama Şeyhayn’ın şartlarına uyan hadisleri almıştır. Sahîhayn’da bulunmayıp kendisi nezdinde sahih olan hadisleri de almıştır. Hâkim sıhhat hükmü vermede mütesâhildir."},{"k":"p","x":"Zehebî Hâkim’in Müstedrek’i üzerine çalışmıştır. Hâkim eserinde bazı hadislerin sahih olduğunu ifade etmiş ama bazıları hakkında hüküm vermemiştir. Zehebî bu hadislere sahih, hasen, zayıf, münker, hatta mevzu gibi hükümler vermiştir. Zehebî’nin de sükût ettiği bazı hadisler vardır ki bu hadisler de sizler gibi muhaddislere kalmıştır."},{"k":"tbl","r":[["Kitap","Hüküm"],["**Müstahreclerdeki ziyadeler**","Sahih senedlerle yapılmıştır"],["**İbn Huzeyme’nin Sahîh’i**","İçinde bulunması sahih hükmü için yeterli"],["**İbn Hibbân’ın Sahîh’i**","Sahîhayn ve İbn Huzeyme’den sonra en sahih; ama İbn Hibbân mütesâhil"],["**İbnü’s-Seken’in Sahîh’i**","Senedler hazfedilmiş; ahkâmla ilgili sahih hadisler, bablar halinde"],["**Hâkim’in Müstedrek’i**","Hâkim mütesâhil; Zehebî’nin hükümlerine bakılır"]]}]},{"h":"Muteber Ulemanın ve Hadis İmamlarının Hükümleri","b":[{"k":"h","x":"Muteber ulemanın sıhhatine hükmettiği hadisler"},{"k":"p","x":"Bunlar da Ebû Dâvûd, Tirmizî ve Dârekutnî gibi müelliflerin meşhur ve muteber kitaplarıdır. Bu kitaplara gelince;"},{"k":"li","x":"Müellif hadisin sahih olduğuna hükmetmişse sıkıntı yok, alınır."},{"k":"li","x":"Eğer hükmetmemişse araştırma yapılmadan hadisin sıhhatine hüküm verilmez, çünkü müellifleri sadece sahih hadisleri yazmayı murad etmemişlerdir."},{"k":"li","x":"Müelliflerinin kendisinin sahihtir demediği, fakat hadis ulemasının sahihtir deyip sahih bir senedle naklettiği hadislere gelince, bu hadise sahihtir demek için bu yeterlidir."},{"k":"h","x":"Hadis ulemasının hüküm verip mertebesini belirttiği hadisler"},{"k":"p","x":"Bazı hadisler de vardır ki sonradan gelen muhaddisler senedlerinde çalışmış, sahih, hasen, zayıf gibi mertebelerini söylemişlerdir. Bu hadisler hakkında mütesâhil olmayan mutemed hadis imamlarından bir hüküm sâdır olmuşsa biz bununla iktifa eder, yeniden araştırmaya ihtiyaç duymayız. Mesela Tirmizî’nin hasendir ya da zayıftır dediği hadisler gibi."},{"k":"h","x":"Senedi hakkında hüküm verilmeyen hadislerde araştırmaya olan ihtiyaç"},{"k":"p","x":"Geçmiş ulemanın üzerinde çalışıp hakkında hüküm vermediği hadisler vardır ki bunlar konusunda çalışmamız gerekmektedir. Böyle hadisler çoktur. Hadisle uğraşan -ihlaslı- âlimlerin üzerine düşen, bu hadisler hakkında kolları sıvayıp, önceki ulemanın tasnif ettiği ve sıhhatini araştırmaya ömürlerinin yetmediği kitapları ele alıp, senedlerini araştırıp hükmünü ortaya koymaktır. Bu ise İslam’ın ikinci kaynağı olan sünnete büyük bir hizmet olacaktır."}]},{"h":"Senedleri Araştırma Yöntemi","b":[{"k":"p","x":"Hadis âlimleri sıhhat şartlarını şu şekilde ortaya koymuştur:"},{"k":"li","x":"Adâletü’r-râvî"},{"k":"li","x":"Zabtü’r-râvî"},{"k":"li","x":"İttisâlü’s-sened"},{"k":"li","x":"Ademü’ş-şüzûz"},{"k":"li","x":"Ademü’l-illet"},{"k":"tbl","r":[["Sıhhat şartı","Anlamı"],["**Adâletü’r-râvî**","Râvinin adaleti"],["**Zabtü’r-râvî**","Râvinin zabtı"],["**İttisâlü’s-sened**","Senedin muttasıl olması"],["**Ademü’ş-şüzûz**","Şâz olmaması"],["**Ademü’l-illet**","İlletli olmaması"]]},{"k":"p","x":"Hadisin sıhhatine dair yapacağımız araştırmada yapacağımız ilk şey, seneddeki râvilerin adalet ve zabtı hakkında cerh ve ta’dil âlimlerinin söylediklerine başvurmaktır."},{"k":"h","x":"Râvilerin hayatlarını öğrenme metodu"},{"k":"p","x":"Daha önce zikrettiğimiz üzere ricâl hakkında telif edilmiş eserler vardır. Hadis âlimleri râviler hakkında birçok eserler telif etmiştir. Ve bu eserleri de bablara ayırmışlardır. Bazıları zayıf râvileri, bazıları sadece sika râvileri kaleme almışlardır."},{"k":"p","x":"Bir hadisin senedindeki râviyi araştıracak olan kimsenin bu râvi hakkında -hangi şehirden olduğu, Kütüb-i Sitte ricâlinden olup olmadığı, hangi tabakadan olduğu gibi- birtakım bilgilere sahip olması işini kolaylaştıracak, râvi hakkında hangi kitaba müracaat edeceğini önceden bilecektir. Eğer elinde hiçbir bilgi yoksa da bu sefer râvi isimlerinin hece harflerine göre tanzim edildiği ricâl kitaplarına müracaat edecektir."}]},{"h":"Örnek Bir İsnad Araştırması","b":[{"k":"ar","a":"قَالَ النَّسَائِيُّ: أَخْبَرَنَا إِسْمَاعِيلُ بْنُ مَسْعُودٍ قَالَ: حَدَّثَنَا خَالِدُ بْنُ الْحَارِثِ قَالَ: حَدَّثَنَا حُسَيْنٌ الْمُعَلِّمُ عَنْ عَمْرِو بْنِ شُعَيْبٍ أَنَّ أَبَاهُ حَدَّثَهُ عَنْ عَبْدِ اللَّهِ بْنِ عَمْرٍو قَالَ: لَمَّا فَتَحَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مَكَّةَ قَامَ خَطِيبًا فَقَالَ فِي خُطْبَتِهِ: لَا يَجُوزُ لِامْرَأَةٍ عَطِيَّةٌ إِلَّا بِإِذْنِ زَوْجِهَا","x":""},{"k":"p","x":"Bu isnadda 6 şahıs var:"},{"k":"steps","x":["İsmail b. Mes’ûd","Hâlid b. Hâris","Hüseyin el-Muallim","Amr b. Şuayb","Şuayb (Amr’ın babası)","Abdullah b. Amr (İbnü’l-Âs)"]},{"k":"p","x":"Bu râviler hakkında ayrıca araştırma yapmadan önce bilmemiz gerekir ki, bu râvilerin hepsi Kütüb-i Sitte râvilerindendir. Kütüb-i Sitte râvilerini araştıran müstakil ricâl kitapları vardır. Öyleyse başka kitaplara başvurmaya gerek yoktur. Kütüb-i Sitte ricâlini ihtiva eden eserler şunlardır:"},{"k":"li","x":"Tehzîbü’t-Tehzîb - İbn Hacer"},{"k":"li","x":"Takrîbü’t-Tehzîb - İbn Hacer"},{"k":"li","x":"el-Kâşif - Zehebî"},{"k":"li","x":"Hulâsatü Tezhîbi Tehzîbi’l-Kemâl - Hazrecî"},{"k":"p","x":"Bu kitaplar hece harflerine göre tertib edilmiştir."},{"k":"p","x":"Biz Takrîbü’t-Tehzîb’i esas alıp birinci râviden başlayarak tüm râvileri bulalım."},{"k":"h","x":"Râvilerin adalet ve zabtını araştırma"},{"k":"p","x":"Râvilerin ricâl kitaplarındaki yerlerini bulduktan sonra ikinci merhaleye geçelim. Bu merhale râvilerin adalet ve zabtını araştırmadır. Dolayısıyla cerh ve ta’dil âlimlerinin haklarında ne dediklerini esas alıyoruz. Geçen örneği esas alıp ilk râviden başlayalım:"},{"k":"tbl","r":[["Râvi","Takrîb","el-Kâşif","Hulâsa"],["**İsmail b. Mes’ûd**","Sikadır demiş","Sikadır demiş","Sadûktur demiş"],["**Hâlid b. Hâris**","Sikadır demiş","Kattân: “Süfyân’dan ve ondan daha hayırlısını görmedim” demiş","—"]]},{"k":"p","x":"Bu şekilde sırayla tüm râvilerin adalet ve zabtını araştırırız ve ricâlin hallerini öğreniriz."}]},{"h":"Hadise Hüküm Verme","b":[{"k":"h","x":"Râvinin zabtı ve adaleti"},{"k":"p","x":"Râvinin zabtı ve adaleti, cerh ve ta’dil âlimlerinin râviler hakkındaki görüşlerini, hadislerinin red ya da kabul yönündeki beyanlarıyla tespit edilir. Misal olarak Hâlid b. Hâris hakkında Takrîb’de “sika-sebt”, el-Kâşif’te Yahya b. Kattân’ın “ondan daha hayırlısını görmedim”, Hulâsa’da Nesâî’nin “sika-sebt” demesi gibi. Daha sonra âlimlerin râviler hakkında verdikleri hükümden yola çıkarak genel bir kanaate varmak; yani sika ise sika, sadûk ise sadûk olması gibi."},{"k":"h","x":"İsnâd-ı muttasıl"},{"k":"p","x":"Râvilerin zabt ve adaleti hakkındaki beyanlarından sonra hadisin sıhhat şartı gelir. Râvilerin hoca-talebe ilişkilerini inceleyip senedin ittisalini, aralarında kopukluk olup olmadığını tespit etmek hadisin sıhhati açısından önemlidir."},{"k":"h","x":"Hadisteki şazlık, illet ve tespitin zorluğu"},{"k":"p","x":"Bu ancak hadis ilminde geniş ve derin bilgiye sahip olanların anlayıp kavrayabileceği bir durumdur. Hadisin illetini ortaya çıkarmak bütün turukların bir araya getirilmesi ve rivayetler arasındaki ihtilafa bakmakla olur. Bu konuda **Hatîb el-Bağdâdî** hadisin illetini şöyle açıklamıştır:"},{"k":"n","n":1,"x":"Hadisin bütün yollarını bir araya getirmek."},{"k":"n","n":2,"x":"Râvilerin ihtilaflarına bakmak."},{"k":"n","n":3,"x":"Râvilerin hıfz konumlarına itibar etmek."},{"k":"n","n":4,"x":"Râvilerin zabt ve itkan konumlarını bilmek."},{"k":"h","x":"Hadise hüküm vermek"},{"k":"p","x":"Bundan maksat da hadis hakkında sahih, hasen, zayıf ve mevzu derecelerini beyan etmekle olur."},{"k":"h","x":"Araştırmacının isnad hakkında hüküm vermekle yetinmesi"},{"k":"p","x":"(Sahîhu’l-isnâd – hasenü’l-isnâd – zayıfü’l-isnâd)"},{"k":"p","x":"Bir hadisin metni hakkında olumlu veya olumsuz hüküm vermek zor iştir. O yüzden araştırmacı hadis hakkında hüküm verirken senedini baz alarak ya sahîhu’l-isnâd ya hasenü’l-isnâd ya da zayıfü’l-isnâd olarak hüküm verir."},{"k":"h","x":"İsnad araştırmasında inceleme yolları"},{"k":"steps","x":["Biyografi kitaplarından râvilerin hayat hikâyeleri hakkında bilgi edinmek.","Senedin ittisal ve kopukluğu hakkında inceleme yapmak; bu da doğum-ölüm tarihlerini bilme, yaşadığı şehri, seyahat ettiği yerleri bilmek, hadiste irsal olup olmadığını tespit etmek.","Adalet ve zabt yönünden ele almak.","Şaz ve illet olup olmadığını ilel kitaplarına baktıktan sonra hüküm vermek.","Hadise hüküm verirken araştırmacının sahîhu’l-isnâd, hasenü’l-isnâd, zayıfü’l-isnâd gibi ifadelerle yetinmesi."]}]}],"ht":[{"s":0,"x":"Senedi yeniden araştırılmayan hadisler 4 grup: Sahîhayn’dekiler · sıhhati iltizam eden kitaplardakiler · muteber ulemanın sahih dediği hadisler · mutemed imamların mertebesini belirttiği hadisler."},{"s":1,"x":"Sahîhayn’deki hadisin senedi araştırılmaz; sıhhat için orada geçmesi yeterlidir. Nevevî: Sahîhayn’deki hadislerle mutlak amel edilir. İbnü’s-Salâh: Sahîhayn’in sıhhatinde katiyyet vardır."},{"s":1,"x":"Sahîhayn’da zayıf hadis iddia edenler iki grup: yeterliliğini ispat etmek isteyen hadis aşinaları ve İslam düşmanlarınca kiralanmış, çoğu hadis bilmeyenler."},{"s":2,"x":"Sıhhati iltizam eden kitaplar: müstahreclerdeki ziyadeler, İbn Huzeyme (bulunması yeterli), İbn Hibbân (mütesâhil), İbnü’s-Seken (senedsiz), Hâkim’in Müstedrek’i (mütesâhil; Zehebî’nin sükût ettikleri muhaddislere kalmıştır)."},{"s":3,"x":"Ebû Dâvûd, Tirmizî, Dârekutnî gibi muteber kitaplarda: müellif sahih demişse alınır; dememişse araştırılır; hadis uleması sahih bir senedle sahih demişse yeterlidir."},{"s":3,"x":"Mütesâhil olmayan mutemed bir imamın hükmüyle (ör. Tirmizî’nin hasen/zayıf demesi) iktifa edilir. Hüküm verilmemiş hadisler çoktur; bunları araştırmak sünnete büyük hizmettir."},{"s":4,"x":"Sıhhatin 5 şartı: adâletü’r-râvî, zabtü’r-râvî, ittisâlü’s-sened, ademü’ş-şüzûz, ademü’l-illet. İlk iş râvilerin adalet ve zabtı hakkında cerh-ta’dil âlimlerine başvurmaktır."},{"s":4,"x":"Râvinin şehri, Kütüb-i Sitte ricâlinden olup olmadığı, tabakası biliniyorsa hangi kitaba bakılacağı bellidir; bilinmiyorsa hece harflerine göre tanzim edilmiş ricâl kitaplarına bakılır."},{"s":5,"x":"Örnek isnad (Nesâî): 6 râvinin hepsi Kütüb-i Sitte râvisidir; Tehzîbü’t-Tehzîb, Takrîb, el-Kâşif ve Hulâsa yeterlidir. Takrîb esas alınır."},{"s":5,"x":"İsmail b. Mes’ûd: Takrîb ve Kâşif “sika”, Hulâsa “sadûk”. Hâlid b. Hâris: Takrîb “sika”."},{"s":6,"x":"Hatîb el-Bağdâdî’ye göre illeti ortaya çıkarmak: bütün yolları toplamak, râvilerin ihtilaflarına bakmak, hıfz ve zabt-itkan konumlarını bilmek."},{"s":6,"x":"Metin hakkında hüküm zor olduğu için araştırmacı “sahîhu’l-isnâd / hasenü’l-isnâd / zayıfü’l-isnâd” demekle yetinir."},{"s":6,"x":"İsnad araştırmasının 5 yolu: biyografi · ittisal (doğum-ölüm, şehir, seyahat, irsal) · adalet-zabt · ilel kitaplarıyla şaz ve illet · isnada hükümle yetinme."}],"oz":null}];

<script>
/* ---------- yardımcılar ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = s => String(s).toLocaleLowerCase('tr').normalize('NFD').replace(/[̀-ͯ]/g, '')
  .replace(/[’'ʿʾ‘`"]/g, '').replace(/ı/g, 'i').replace(/[^a-z0-9؀-ۿ ]/g, ' ').replace(/\s+/g, ' ').trim();
const strip = h => String(h).replace(/<[^>]+>/g, ' ').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/\s+/g, ' ').trim();
const plain = s => String(s).replace(/\*\*/g, '').replace(/[«»]/g, '').replace(/\[\[|\]\]/g, '');
// Metin biçimi: **kalın**, «Arapça»
function fmt(s) {
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/«([^»]+)»/g, (m, a) => /[؀-ۿ]/.test(a) ? `<span class="ar" dir="rtl" lang="ar">${a}</span>` : `«${a}»`)
    .replace(/\[\[(.+?)\]\]/g, '<span class="ek" title="Ek · onay bekliyor">$1</span>');
}

/* ---------- kalıcı durum (tarayıcıda, ön ek: th_) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem('th_' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('th_' + k, JSON.stringify(v)); } catch (e) {} }
};
let stats = store.get('stats', {});   // anahtar -> {ok, bad}
let boxes = store.get('boxes', {});   // tanım id -> kutu 1..5
let oral  = store.get('oral', {});    // bölüm anahtarı -> 1/0
let uStat = store.get('units', {});   // ünite -> en iyi mini test (0-5)
function record(key, ok) { const s = stats[key] || {ok: 0, bad: 0}; ok ? s.ok++ : s.bad++; stats[key] = s; store.set('stats', stats); ozet(true); }
/* ---------- Giray Akademi özeti (alt çubuk · Karnem) ---------- */
const YAD = {home: 'Ana sayfa', study: 'Üniteler', quiz: 'Test', match: 'Eser–müellif eşleştirme', flash: 'Kavram kartları', oralView: 'Konu tekrarı', review: 'Hızlı tekrar', exam: 'Geçmiş sınav soruları', browse: 'Sözlük', progress: 'İlerlemem'};
function yer() {
  const v = curView, a = curArg;
  if (v === 'unitView') return {ad: (a + 1) + '. ünite', url: '/tahric/#unitView-' + a};
  if (v === 'quiz' && a && a.unit !== undefined && a.unit !== null) return {ad: (a.unit + 1) + '. ünite testi', url: '/tahric/#unitView-' + a.unit};
  if (v === 'quiz' || v === 'home') return {ad: YAD[v], url: '/tahric/'};
  return {ad: YAD[v] || 'Ana sayfa', url: '/tahric/#' + v};
}
function ozet(aktif) {
  if (typeof gaOzet !== 'function') return;
  const tot = Object.values(stats).reduce((a, s) => ({ok: a.ok + s.ok, bad: a.bad + s.bad}), {ok: 0, bad: 0});
  const n = UNITELER.filter((u, i) => (uStat[i] || 0) >= GECME).length;
  gaOzet({bitti: n / UNITELER.length, etiket: n + '/' + UNITELER.length + ' ünite', d: tot.ok, y: tot.bad, kart: Object.values(boxes).filter(b => b >= 4).length, yer: yer(), aktif: !!aktif});

const ESER = ESER_T;
// Aynı adla birden çok müellife bağlanan eserler (el-Burhân, Mebâhis, Tefsir Usûlü…) ve bir müellifin birden çok eseri tek sorudan fazla üretilmez

// Havuz öğesi: {key, u, make()}
const maskTerm = (x, t) => {
  let out = x;
  t.replace(/\(.*?\)/g, '').split(/[\s\-–]+/).filter(w => w.length > 3 && !/^(kur'an|kuran|ayet|âyet)$/i.test(w)).forEach(w => {
    out = out.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), '…');

function pickDistinct(cands, n, keyFn, exclude) {

}

    const dis = pickDistinct(cands, 3, fk, [d]);

  const dis = pickDistinct(cands, 3, x => norm(x.x).slice(0, 60), [d]);

  return {key: 'd:' + d.id, u: d.u, s: d.s, soru: `<small>Hangisi bu kavramın tanımıdır?</small><em>${fmt(d.t)}</em>`, dogru: kisalt(d), sec: shuffle([kisalt(d), ...dis.map(kisalt)]), aciklama: `<b>${fmt(d.t)}:</b> ${fmt(d.x)}`};
}
function qEser(r) {
  const not = r.not ? ` <span style="color:var(--muted)">(${fmt(r.not)})</span>` : '';

    const dis = pickDistinct(cands, 3, x => norm(x.m), [r]);
    return {key: 'e:' + r.id, u: r.u, s: r.s, soru: `<em>${fmt(r.e)}</em> kimin eseridir?`, dogru: r.m, sec: shuffle([r.m, ...dis.map(x => x.m)]), aciklama: `<b>${fmt(r.e)}</b> → ${fmt(r.m)}${not}`};
  }
  // müellifi göster, eseri sor (o müellifin başka eserleri çeldirici olmaz)
  const ayni = new Set(ESER.filter(x => norm(x.m) === norm(r.m)).map(x => norm(x.e)));
  const cands = nearFirst(ESER_Q.filter(x => !ayni.has(norm(x.e))), r.u);
  const dis = pickDistinct(cands, 3, x => norm(x.e), [r]);
  return {key: 'e:' + r.id, u: r.u, s: r.s, soru: `<small>Aşağıdakilerden hangisi bu müellifin eseridir?</small><em>${fmt(r.m)}</em>`, dogru: r.e, sec: shuffle([r.e, ...dis.map(x => x.e)]), aciklama: `<b>${fmt(r.e)}</b> → ${fmt(r.m)}${not}`};
}
function qEl(i) {

function weightedPick(list, n) {

  const out = [], used = new Set();

  }

    <div class="cardhead"><span class="tag">Ünite ${q.u + 1} · ${esc(UNITELER[q.u].t)}</span>${bldButton(q.key, 'Test · Ünite ' + (q.u + 1) + ' · ' + UNITELER[q.u].t, strip(q.soru) + ' | Doğru cevap: ' + plain(q.dogru))}</div>
    <div class="q${q.long ? ' long' : ''}">${q.soru}</div>
    <div class="opts">${q.sec.map((s, i) => `<button class="opt" data-i="${i}" onclick="answer(this)"><span class="k">${'ABCD'[i]}</span><span>${fmt(s)}</span></button>`).join('')}</div>
    <div class="explain" id="exp"></div>
    <div class="actions"><button class="btn" id="next" disabled onclick="nextQ()">${Q.i + 1 < Q.list.length ? 'Sonraki →' : 'Sonucu gör'}</button></div>
  </div>`;
}
function answer(el) {
  const q = Q.list[Q.i], secilen = q.sec[+el.dataset.i], ok = secilen === q.dogru;
  document.querySelectorAll('.opt').forEach(b => { b.disabled = true; if (q.sec[+b.dataset.i] === q.dogru) b.classList.add('ok'); });
  if (!ok) el.classList.add('bad');
  ok ? Q.dogru++ : Q.yanlis.push(q);
  record(q.key, ok);
  const yer = q.s !== undefined ? `<span class="src">Ünite ${q.u + 1} · ${esc(UNITELER[q.u].s[q.s].h)}</span>` : `<span class="src">Ünite ${q.u + 1} · ${esc(UNITELER[q.u].t)}</span>`;
  $('#exp').innerHTML = `<b>${ok ? 'Doğru.' : 'Yanlış.'}</b> ${q.aciklama}${yer}`;
  $('#exp').classList.add('show');

}
function nextQ() { Q.i++; Q.i < Q.list.length ? renderQ() : quizEnd(); }
function wrongList() {
  const satir = q => q.key[0] === 'q'
    ? `<div class="row"><div class="n" style="color:var(--muted)">${q.soru}</div><div class="n"><b>Doğru cevap:</b> ${fmt(q.dogru)}</div><div class="w">${q.aciklama}</div></div>`
    : `<div class="row"><div class="n">${q.aciklama}</div></div>`;
  return Q.yanlis.length ? `<div class="section-title" style="text-align:left">Yanlış yaptıkların</div><div class="list" style="text-align:left">${Q.yanlis.map(satir).join('')}</div>` : '';
}
function quizEnd() {
  alt(false);
  const n = Q.list.length, p = Math.round(100 * Q.dogru / n);
  if (Q.unit !== undefined && Q.unit !== null) {
    const i = Q.unit, gecti = Q.dogru >= GECME;
    uStat[i] = Math.max(uStat[i] || 0, Q.dogru); store.set('units', uStat);
    const sonraki = i + 1 < UNITELER.length ? i + 1 : null;
    $('#app').innerHTML = `
    <div class="card result" style="margin-top:24px">
      <div class="big">${Q.dogru}/${n}</div>
      <p class="lead">${gecti ? '✓ Üniteyi tamamladın.' : `Geçmek için en az ${GECME} doğru gerekiyor. Üniteyi bir kez daha okuyup tekrar dene.`}</p>
      ${wrongList()}
      <div class="actions" style="justify-content:center">
        <button class="btn sec" onclick="go('study')">Ünite listesi</button>
        <button class="btn sec" onclick="go('unitView',${i})">Üniteye dön</button>
        ${gecti && sonraki !== null ? `<button class="btn" onclick="go('unitView',${sonraki})">Sonraki ünite →</button>` : `<button class="btn" onclick="quiz({unit:${i}})">Tekrar dene</button>`}
      </div>
    </div>`;
    return;
  }
  const keys = Q.yanlis.map(q => q.key);
  $('#app').innerHTML = `
  <div class="card result" style="margin-top:24px">
    <div class="big">${Q.dogru}/${n}</div>
    <p class="lead">%${p} başarı · ${p >= 80 ? 'Çok iyi gidiyorsun.' : p >= 50 ? 'Fena değil, yanlışları tekrar et.' : 'Bu konulara biraz daha çalışmak gerekiyor.'}</p>
    ${wrongList()}
    <div class="actions" style="justify-content:center">
      ${keys.length ? `<button class="btn sec" onclick='quiz({keys:${JSON.stringify(keys)}})'>Yanlışları tekrar et</button>` : ''}

}

/* ---------- eşleştirme ---------- */
let M = null;
function match() {
  const list = [], mu = new Set();
  for (const r of shuffle(ESER_Q)) { const k = norm(r.m); if (!mu.has(k)) { mu.add(k); list.push(r); } if (list.length === 5) break; }
  M = {list, left: shuffle(list), right: shuffle(list), sel: null, done: new Set(), hata: 0, t0: Date.now()};
  renderM();
}
function renderM() {
  $('#app').innerHTML = `
  <div class="bar"><div class="progress"><i style="width:${100 * M.done.size / M.list.length}%"></i></div><span class="count">${M.done.size} / ${M.list.length} · ${M.hata} hata</span></div>
  <p class="lead" style="margin-bottom:12px">Soldan bir eser seç, sonra sağdan müellifine dokun.</p>
  <div class="match">
    <div class="col"><h4>Eser</h4>${M.left.map(r => `<button class="tile ${M.done.has(r.id) ? 'done' : M.sel === r.id ? 'sel' : ''}" ${M.done.has(r.id) ? 'disabled' : ''} onclick="mSel(${r.id})">${fmt(r.e)}</button>`).join('')}</div>
    <div class="col"><h4>Müellif</h4>${M.right.map(r => `<button class="tile ${M.done.has(r.id) ? 'done' : ''}" id="mr-${r.id}" ${M.done.has(r.id) ? 'disabled' : ''} onclick="mPick(${r.id})">${fmt(r.m)}</button>`).join('')}</div>
  </div>`;
}
function mSel(id) { M.sel = id; renderM(); }
function mPick(id) {
  if (M.sel === null) return;
  if (M.sel === id) { M.done.add(id); record('e:' + id, true); M.sel = null; renderM(); if (M.done.size === M.list.length) mEnd(); }
  else { M.hata++; record('e:' + M.sel, false); const el = $('#mr-' + id); el.classList.add('wrong'); setTimeout(() => { el.classList.remove('wrong'); $('#app .bar .count').textContent = `${M.done.size} / ${M.list.length} · ${M.hata} hata`; }, 320); }
}
function mEnd() {
  const sn = Math.round((Date.now() - M.t0) / 1000);
  $('#app').innerHTML = `<div class="card result" style="margin-top:24px"><div class="big">✓</div><p class="lead">${sn} saniyede, ${M.hata} hatayla bitirdin.</p>
  <div class="list" style="text-align:left;margin-top:18px">${M.list.map(r => `<div class="row"><div class="e">${fmt(r.e)}</div><div class="n">${fmt(r.m)} · <span style="color:var(--muted)">Ünite ${r.u + 1}</span></div></div>`).join('')}</div>
  <div class="actions" style="justify-content:center"><button class="btn" onclick="match()">Yeni tur</button></div></div>`;
}

}
function unitSelect(cur, fn) {

}
function renderF() {

function fAns(ok) {
  const d = F.list[F.i];

}

/* ---------- ilerleme ---------- */
function progress() {
  const satir = UNITELER.map((u, i) => {
    let ok = 0, bad = 0; unitItems(i).forEach(x => { const s = stats[x.key]; if (s) { ok += s.ok; bad += s.bad; } });
    const p = ok + bad ? Math.round(100 * ok / (ok + bad)) : null;
    return `<div class="meter"><span title="${esc(u.t)}">${i + 1}. ${esc(u.t)}</span><div class="progress"><i style="width:${p ?? 0}%;background:${p === null ? 'transparent' : p >= 70 ? 'var(--green-2)' : p >= 45 ? 'var(--gold)' : 'var(--red)'}"></i></div><span class="count">${p === null ? '—' : '%' + p}</span></div>`;
  }).join('');
  const byKey = {}; HAVUZ.forEach(x => byKey[x.key] = x);
  const zayif = Object.entries(stats).filter(([k, s]) => s.bad > 0 && byKey[k]).sort((a, b) => (b[1].bad - b[1].ok * .5) - (a[1].bad - a[1].ok * .5)).slice(0, 12).map(([k]) => k);
  const etiket = k => { const [t, id] = k.split(':');
    if (t === 'd') return `<b>${fmt(TANIM[id].t)}</b>: ${fmt(TANIM[id].x)}`;
    if (t === 'e') return `<b>${fmt(ESER_Q[id].e)}</b> → ${fmt(ESER_Q[id].m)}`;
    return `${fmt(SORULAR[id].q)} <b>${fmt(SORULAR[id].a[0])}</b>`; };
  const oralN = Object.keys(oral).length, oralOk = Object.values(oral).filter(v => v === 1).length;
  $('#app').innerHTML = `
  <h2 style="margin-top:22px">İlerlemem</h2>
  <div class="card" style="margin-top:14px">${satir}
    <p class="lead" style="font-size:.88rem;margin-top:12px">Çalış bölümü: ${uDone()} / ${UNITELER.length} ünite tamamlandı.<br>Konu tekrarı: ${oralN} bölüm çalışıldı, ${oralOk} tanesini bildin.</p></div>
  <div class="section-title">En çok karıştırdıkların</div>
  ${zayif.length ? `<div class="list">${zayif.map(k => `<div class="row"><div class="n">${etiket(k)}</div></div>`).join('')}</div>
    <div class="actions"><button class="btn" onclick='quiz({keys:${JSON.stringify(zayif)}})'>Bunlarla test çöz</button></div>` : '<p class="empty">Henüz yanlış yok. Biraz test çözünce burada görünecek.</p>'}
  <div class="actions" style="margin-top:30px"><button class="btn sec" onclick="sifirla()">İlerlemeyi sıfırla</button></div>`;
}
function sifirla() {
  if (!confirm('Bütün ilerleme kaydın silinsin mi?')) return;
  stats = {}; boxes = {}; oral = {}; uStat = {};
  store.set('stats', stats); store.set('boxes', boxes); store.set('oral', oral); store.set('units', uStat); progress();
}

/* ---------- genel arama ---------- */
let SIDX = null;
function bTxt(b) {
  if (b.k === 'tbl') return b.r.map(r => r.filter(Boolean).map(plain).join(' – ')).join(' · ');
  if (b.k === 'steps') return b.x.map(plain).join(' · ');
  if (b.k === 'ar') return plain(b.x || '');
  if (b.k === 'sc') return plain(b.q + ' ' + b.x);
  return plain((b.t ? b.t + ': ' : '') + b.x);
}
function buildIndex() {
  SIDX = [];
  UNITELER.forEach((u, ui) => u.s.forEach((s, si) => {
    SIDX.push({u: ui, s: si, kind: 'b', t: s.h, x: s.b.map(bTxt).join(' · ')});
  }));
  UNITELER.forEach((u, ui) => u.oz && u.oz.s.forEach((s, si) => {
    SIDX.push({u: ui, s: si, kind: 'o', t: s.h, x: s.b.map(bTxt).join(' · ')});
  }));
}
function openSearch() {
  if (!SIDX) buildIndex();
  $('#sov').classList.add('open');
  try { history.pushState(Object.assign({}, history.state, {search: true}), ''); } catch (e) {}
  $('#sq').value = ''; doGlobalSearch(); setTimeout(() => $('#sq').focus(), 30);
}
function closeSearch(viaPop) {
  $('#sov').classList.remove('open');
  if (!viaPop && history.state && history.state.search) { try { history.back(); } catch (e) {} }
}
function markText(text, t) {
  const n = norm(text); const i = n.indexOf(t);
  if (!t || i < 0) return esc(text.slice(0, 160)) + (text.length > 160 ? '…' : '');
  // norm uzunluğu yaklaşık korunduğundan konuma yakın bir pencere al
  const a = Math.max(0, i - 60), b = Math.min(text.length, i + t.length + 100);
  return (a ? '…' : '') + esc(text.slice(a, b)) + (b < text.length ? '…' : '');
}
function doGlobalSearch() {
  const t = norm($('#sq').value || '');
  if (t.length < 2) { $('#sres').innerHTML = '<p class="empty">En az iki harf yaz.</p>'; return; }
  const kav = TANIM.filter(d => norm(d.t).includes(t)).slice(0, 12);
  const bol = SIDX.filter(r => norm(r.t + ' ' + r.x).includes(t)).slice(0, 30);
  $('#sres').innerHTML = (kav.length ? `<div class="sgrp">Kavramlar</div>${kav.map(d => `<button class="sitem" onclick="hit(${d.u},${d.s})"><div class="w">Ünite ${d.u + 1}</div><div class="t">${fmt(d.t)}</div><div class="x">${esc(plain(d.x).slice(0, 140))}</div></button>`).join('')}` : '')
    + (bol.length ? `<div class="sgrp">Konu anlatımları</div>${bol.map(r => `<button class="sitem" onclick="hit(${r.u},${r.s},'${r.kind}')"><div class="w">Ünite ${r.u + 1} · ${esc(UNITELER[r.u].t)}${r.kind === 'o' ? ' · <b>Özet</b>' : ''}</div><div class="t">${esc(r.t)}</div><div class="x">${markText(r.x, t)}</div></button>`).join('')}` : '')
    || '<p class="empty">Sonuç yok.</p>';
}
function hit(u, s, kind) { $('#sov').classList.remove('open'); const oz = kind === 'o'; MOD = oz ? 'ozet' : 'kitap'; store.set('mod', MOD); pendingFocus = {id: `${oz ? 'os' : 'ls'}-${u}-${s}`}; if (history.state && history.state.search) { try { history.replaceState({view: curView, arg: curArg, d: (history.state.d || 0)}, ''); } catch (e) {} } go('unitView', u); }
function focusHit(f) { jump(f.id); }

/* ---------- başlat ---------- */
const ilkHash = (location.hash || '').slice(1);
try { history.replaceState({view: 'home', arg: null, d: 0}, '', location.pathname + location.search); } catch (e) {}
render('home');
// Alt çubuktaki "Devam et" / "Dersler" bağlantısıyla gelindiyse kaldığı yere aç (ör. #unitView-7)
(function () {
  const h = ilkHash; if (!h) return;
  const m = h.match(/^(\w+?)(?:-(\d+))?$/); if (!m) return;
  const v = m[1], a = m[2] === undefined ? undefined : +m[2];
  if (!['study', 'unitView', 'match', 'flash', 'oralView', 'review', 'exam', 'browse', 'progress'].includes(v)) return;
  if (v === 'unitView' && !(a >= 0 && a < UNITELER.length)) return;
  if (v === 'unitView') { go('study'); go('unitView', a); } else go(v);
})();
</script>
