<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f7f3ea; --card:#fffdf8; --ink:#1f2a24; --muted:#6b7068; --line:#e3dccb;
  --green:#1f5a45; --green-2:#2f7a5f; --green-soft:#e4efe8; --gold:#b08a3e; --gold-soft:#f4ead3;
  --red:#a8432f; --red-soft:#f6e1db; --radius:14px; --shadow:0 1px 2px rgba(40,30,10,.06),0 6px 20px rgba(40,30,10,.06);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --ar:Amiri,"Traditional Arabic","Scheherazade New","Noto Naskh Arabic",serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body{padding-bottom:34px}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 64px}
header.top{position:sticky;top:0;z-index:5;background:rgba(247,243,234,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
.brand{white-space:nowrap;display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:1.15rem;font-weight:700;color:var(--green);background:none;border:0;padding:0}
.crumb{display:flex;align-items:center;gap:6px;min-width:0;flex:1 1 auto}
.crumb .brand{min-width:0}.crumb .bt{overflow:hidden;text-overflow:ellipsis}
.ga{display:grid;text-decoration:none;border-radius:8px}
.ga .mark,.brand .pmark{width:30px;height:30px;border-radius:8px;background:var(--green);color:#f4c430;display:grid;place-items:center;flex:none}
.ga:hover .mark{background:var(--green-2)}
.csep{color:var(--line);font-size:1.3rem;line-height:1;margin:0 1px}
.brand .pmark{background:var(--gold-soft);color:var(--green);border:1px solid #e6d6ae}
.spacer{flex:1}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.88rem;color:var(--muted)}
.ghost:hover{border-color:var(--green-2);color:var(--green)}
.iconbtn{padding:6px 10px;display:inline-grid;place-items:center}
h1,h2,h3{font-family:var(--serif);line-height:1.25;margin:0}
h1{font-size:1.7rem;color:var(--green)}
h2{font-size:1.3rem}
.lead{color:var(--muted);margin:6px 0 0}
.hero{padding:28px 0 8px}
.hero .arn{font-family:var(--ar);font-size:1.5rem;color:var(--gold);margin-top:2px;text-align:left}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 6px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:110px}
.stat b{display:block;font-family:var(--serif);font-size:1.35rem;color:var(--green)}
.stat span{font-size:.8rem;color:var(--muted)}
.section-title{margin:26px 0 10px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.mode{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.mode:hover{transform:translateY(-2px);border-color:var(--green-2)}
.mode .ico{font-size:1.4rem;width:40px;height:40px;border-radius:10px;background:var(--green-soft);display:grid;place-items:center;margin-bottom:10px}
.mode h3{font-size:1.08rem;margin-bottom:4px}
.mode p{margin:0;color:var(--muted);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.bar{display:flex;align-items:center;gap:10px;margin:18px 0 12px}
.progress{flex:1;height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--green-2);transition:width .3s}
.count{font-size:.85rem;color:var(--muted);white-space:nowrap}
.tag{display:inline-block;font-size:.75rem;background:var(--gold-soft);color:#7a5c1e;border-radius:999px;padding:2px 10px;margin-bottom:10px}
.q{font-family:var(--serif);font-size:1.25rem;margin:4px 0 18px}
.q.long{font-family:var(--sans);font-size:1.02rem;line-height:1.6;background:var(--paper);border-radius:12px;padding:12px 14px}
.q em{font-style:normal;color:var(--green);font-weight:700}
.q small{display:block;font-family:var(--sans);font-size:.85rem;color:var(--muted);margin-bottom:6px}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:1rem;display:flex;gap:10px;align-items:flex-start}
.opt .k{flex:none;width:24px;height:24px;border-radius:6px;background:var(--paper);display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--muted)}
.opt:hover:not([disabled]){border-color:var(--green-2)}
.opt.ok{border-color:var(--green-2);background:var(--green-soft)}
.opt.bad{border-color:var(--red);background:var(--red-soft)}
.opt[disabled]{cursor:default}
.explain{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--paper);font-size:.93rem;display:none}
.explain.show{display:block}
.explain b{color:var(--green)}
.explain .src{display:block;color:var(--muted);font-size:.82rem;margin-top:6px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:11px 18px;background:var(--green);color:#fff;font-weight:600}
.btn:hover{background:var(--green-2)}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.red{background:var(--red)}
.btn:disabled{opacity:.4;cursor:default}
.result{text-align:center;padding:30px 20px}
.big{font-family:var(--serif);font-size:3rem;color:var(--green);line-height:1}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.col{display:grid;gap:8px;align-content:start}
.col h4{margin:0 0 2px;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tile{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.93rem;min-height:52px;transition:all .15s}
.tile.sel{border-color:var(--gold);background:var(--gold-soft)}
.tile.done{border-color:var(--green-soft);background:var(--green-soft);color:var(--green);opacity:.75}
.tile.wrong{animation:shake .3s;border-color:var(--red);background:var(--red-soft)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.flash{perspective:1200px;min-height:280px;cursor:pointer;margin-top:4px}
.flash-in{position:relative;min-height:280px;transition:transform .45s;transform-style:preserve-3d}
.flash.flip .flash-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;border-radius:var(--radius);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);overflow:auto}
.face.back{transform:rotateY(180deg);background:#fbf7ec}
.face .t{font-family:var(--serif);font-size:1.5rem;color:var(--green)}
.face .s{color:var(--ink);font-size:.98rem;margin-top:10px;max-width:560px;line-height:1.6}
.face .hint{position:absolute;bottom:12px;font-size:.78rem;color:var(--muted)}
.answer{display:none;margin-top:6px;border-top:1px dashed var(--line);padding-top:14px}
.answer.show{display:block}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:1rem}
.search:focus{outline:none;border-color:var(--green-2)}
.list{margin-top:12px;display:grid;gap:8px}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;width:100%;display:block}
button.row:hover{border-color:var(--green-2)}
.row .e{font-family:var(--serif);font-weight:700;font-size:1.05rem;color:var(--green)}
.row .n{font-size:.93rem;margin-top:3px;line-height:1.55}
.row .w{font-size:.76rem;color:var(--muted);margin-top:4px}
.empty{color:var(--muted);text-align:center;padding:30px}
.meter{display:grid;grid-template-columns:minmax(120px,240px) 1fr 54px;gap:10px;align-items:center;margin:8px 0;font-size:.9rem}
.meter span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meter .progress{height:10px}
.select{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:.9rem;max-width:100%}
.rowctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.kaynak{margin:28px auto 8px;padding-top:12px;border-top:1px solid var(--line);color:var(--muted);font-size:.78rem;text-align:center}
.foot{margin-top:40px;color:var(--muted);font-size:.8rem;text-align:center}
.sig{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;padding:5px 12px calc(5px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);font-family:var(--sans);font-size:.7rem;letter-spacing:.02em;color:var(--muted)}
.sig b{color:var(--green);font-weight:600}
.sig i{font-style:normal;opacity:.5}
.study-cta{display:flex;gap:14px;align-items:center;background:var(--green);color:#fff;border:0;border-radius:var(--radius);padding:18px;text-align:left;width:100%;box-shadow:var(--shadow);margin-bottom:12px}
.study-cta:hover{background:var(--green-2)}
.study-cta .ico{font-size:1.5rem;width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center;flex:none}
.study-cta h3{font-size:1.15rem;margin-bottom:2px;color:#fff}
.study-cta p{margin:0;opacity:.85;font-size:.9rem}
.ulist{display:grid;gap:8px}
.unit{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.unit:hover{border-color:var(--green-2)}
.unit .st{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;color:var(--muted);font-weight:700}
.unit.done .st{background:var(--green-2);border-color:var(--green-2);color:#fff}
.unit.next .st{border-color:var(--gold);color:var(--gold)}
.unit .ut{flex:1}.unit .ut b{display:block;font-weight:600}.unit .ut small{color:var(--muted)}
.intro{font-size:1.02rem;margin:10px 0 14px}
.tipbox{background:var(--gold-soft);border-left:4px solid var(--gold);border-radius:10px;padding:12px 14px;margin:10px 0;font-size:.95rem}
.tipbox b.lb{color:#7a5c1e;display:block;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
details.oq{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:8px}
details.oq summary{cursor:pointer;font-weight:600}
.sticky-go{position:sticky;bottom:40px;display:flex;justify-content:center;margin-top:20px}
.sticky-go .btn{box-shadow:0 6px 20px rgba(31,90,69,.3);padding:11px 20px;font-size:.95rem}
.backlink{background:none;border:0;color:var(--green);font-weight:600;padding:14px 0 0;font-size:.95rem}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.toc button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;font-size:.8rem;color:var(--muted)}
.toc button:hover{border-color:var(--green-2);color:var(--green)}
.lesson section.ls{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0;scroll-margin-top:70px}
.lesson h3{font-family:var(--serif);font-size:1.12rem;color:var(--ink);display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;line-height:1.35}
.lesson h3 .no{flex:none;width:26px;height:26px;border-radius:8px;background:var(--green-soft);color:var(--green);font-family:var(--sans);font-size:.8rem;font-weight:700;display:grid;place-items:center;margin-top:1px}
.lesson h4{font-family:var(--sans);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin:14px 0 6px}
.lesson p{margin:0 0 8px;font-size:.98rem;line-height:1.65}
.lesson p.li{padding-left:16px;position:relative}.lesson p.li:before{content:"•";position:absolute;left:3px;color:var(--gold);font-weight:700}
.lesson p.num{padding-left:24px;position:relative}.lesson p.num .nn{position:absolute;left:0;color:var(--green);font-weight:700}
.lesson b{color:var(--green)}
.def{display:grid;grid-template-columns:minmax(110px,30%) 1fr;gap:4px 14px;padding:10px 12px;border-radius:10px;background:var(--green-soft);margin:8px 0}
.def dt{font-family:var(--serif);font-weight:700;color:var(--green)}
.def dd{margin:0;line-height:1.6}
.ar{font-family:var(--ar);font-size:1.18em;line-height:1.9;direction:rtl;unicode-bidi:isolate;color:#5b3f86}
.ar.blk{display:block;text-align:right;margin:4px 0}
.ayet{display:block;font-family:var(--ar);font-size:1.3rem;line-height:2.1;direction:rtl;text-align:right;color:#5b3f86;margin:4px 0 2px}
.sov{position:fixed;inset:0;z-index:90;background:rgba(20,25,20,.35);display:none}
.sov.open{display:block}
.sbox{background:var(--paper);max-width:860px;margin:0 auto;height:100%;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.sbar{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--card);color:var(--muted)}
.sbar input{flex:1;border:0;background:transparent;font-size:1.05rem;padding:8px 2px;color:var(--ink);outline:none;min-width:0}
.sres{overflow:auto;padding:4px 14px 80px;flex:1}
.sgrp{margin:16px 0 6px;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sitem{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0}
.sitem:hover{border-color:var(--green-2)}
.sitem .t{font-weight:600}.sitem .w{font-size:.78rem;color:var(--green);font-weight:600;margin-bottom:2px}
.sitem .x{font-size:.88rem;color:var(--muted);margin-top:3px}
mark{background:#f6df9b;color:inherit;border-radius:3px;padding:0 1px}
.flash-target{animation:ft 2.2s ease}
@keyframes ft{0%,40%{box-shadow:0 0 0 3px var(--gold)}100%{box-shadow:none}}
.how{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;margin:8px 0 14px}
.how summary{cursor:pointer;font-weight:700;color:var(--green);font-family:var(--serif);font-size:1.05rem}
.how .steps{margin:10px 0 6px;padding-left:22px;display:grid;gap:8px;font-size:.94rem}
.how .steps li::marker{color:var(--gold);font-weight:700}
.hownote{margin:6px 0 2px;color:var(--muted);font-size:.86rem}
.exq{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0}
.exq .qq{font-family:var(--serif);font-size:1.05rem;font-weight:700;display:flex;gap:10px}
.exq .qq .no{flex:none;width:26px;height:26px;border-radius:8px;background:var(--gold-soft);color:#7a5c1e;font-family:var(--sans);font-size:.8rem;display:grid;place-items:center}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.links button{border:1px solid var(--line);background:var(--green-soft);color:var(--green);border-radius:999px;padding:4px 10px;font-size:.8rem;font-weight:600}
.oralbody{max-height:none}
.snote{font-size:.86rem;color:var(--muted);margin-top:8px;font-family:var(--sans)}
.lesson h3 .rep{margin-left:auto;flex:none;margin-top:2px}
.cardhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.exq .qq .rep{margin-left:auto;flex:none}
.hide{display:none!important}

/* ---------- Tahriç Usulü: öğretici görünüm ---------- */
.lesson h5{font-family:var(--sans);font-size:.92rem;color:var(--green);margin:12px 0 6px}
.box{border-radius:10px;padding:11px 14px;margin:10px 0;font-size:.95rem;line-height:1.6;border-left:4px solid}
.box b.lb{display:block;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;margin-bottom:3px}
.box.bn{background:var(--gold-soft);border-color:var(--gold)}.box.bn b.lb{color:#7a5c1e}
.box.bk{background:var(--red-soft);border-color:var(--red)}.box.bk b.lb{color:var(--red)}
.box.bo{background:#fff;border:1px dashed var(--green-2);border-left:4px solid var(--green-2)}.box.bo b.lb{color:var(--green-2)}
.box.bs{background:#eef1f6;border-color:#4a6283}.box.bs b.lb{color:#4a6283}
.box.bs .sq{font-weight:600;margin:0 0 6px!important}.box.bs .sa{margin:0!important}.box.bs .sa b{color:#4a6283}
.arb{background:#f8f5fb;border-radius:10px;padding:8px 14px;margin:8px 0}
.arb .ayet{margin:2px 0}
.arb .meal{display:block;font-size:.88rem;color:var(--muted);margin-top:2px;line-height:1.5}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:10px 0 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.tbl{border-collapse:collapse;width:100%;font-size:.9rem;line-height:1.5}
.tbl th,.tbl td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.tbl thead th{background:var(--green);color:#fff;font-weight:600;font-size:.82rem;letter-spacing:.02em;white-space:nowrap}
.tbl thead th b{color:#fff}
.tbl tbody th{font-weight:600;color:var(--green);background:#fbf8f1;min-width:110px}
.tbl tbody tr:last-child th,.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:nth-child(even) td{background:#fcfaf5}
.tbl .ar{font-size:1.05em;line-height:1.8}
.tbl td.arc .ar{display:block;text-align:right;font-size:1.2em;line-height:1.9}
.tbl.cmp thead th:first-child{background:var(--green-2)}
.stp{list-style:none;counter-reset:st;margin:10px 0;padding:0 0 0 4px}
.stp li{counter-increment:st;position:relative;padding:0 0 12px 36px;font-size:.95rem;line-height:1.6}
.stp li:before{content:counter(st);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--gold);color:#fff;font-size:.78rem;font-weight:700;display:grid;place-items:center}
.stp li:after{content:"";position:absolute;left:11px;top:26px;bottom:2px;border-left:2px solid var(--gold-soft)}
.stp li:last-child{padding-bottom:2px}.stp li:last-child:after{display:none}
details.ht{background:var(--green-soft);border:1px solid #cfe0d6;border-radius:var(--radius);margin:16px 0 10px;padding:0}

<script>
/* Kullanım: düğme → <button class="rep" data-k="benzersiz-anahtar" data-yer="Ünite 3 · Bölüm" data-bas="Kayıt başlığı">⚑ Bildir</button>
   Programda önceden tanımlanır: window.BLD_APP = 'Program adı'; window.BLD_PREFIX = 'kayıt ön eki';
   İsteğe bağlı: "Bildirimlerim" düğmesinin konacağı yer → window.BLD_SLOT = 'css seçici' */
(function () {
  const APP = window.BLD_APP || 'Program', MAIL = 'alpkiraymehmet@gmail.com';
  const KEY = (window.BLD_PREFIX || 'bld_') + 'reports';
  const TYPES = ['Bilgi yanlış', 'Eksik ya da karışık anlatım', 'Soru, şık veya cevap hatalı', 'Arapça metin bozuk', 'Yazım hatası', 'Diğer'];
  const E = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
  const getL = () => { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; } };
  const setL = l => { try { localStorage.setItem(KEY, JSON.stringify(l)); } catch (e) {} sync(); };
  const modal = document.getElementById('bldModal'), box = document.getElementById('bldBox');
  let lbtn = null;
  function slot() {
    if (lbtn || !window.BLD_SLOT) return;
    const s = document.querySelector(window.BLD_SLOT); if (!s) return;
    lbtn = document.createElement('button'); lbtn.type = 'button'; lbtn.className = 'bld-lbtn'; lbtn.title = 'Listeye eklediğin hata bildirimleri';
    lbtn.onclick = openList; s.appendChild(lbtn);
  }
  function sync() { slot(); if (lbtn) { const n = getL().length; lbtn.classList.toggle('has', n > 0); lbtn.innerHTML = `⚑<span class="bld-lg"> Bildirimlerim</span> (${n})`; } mark(); }
  function mark() { const l = getL(); document.querySelectorAll('.rep[data-k]').forEach(b => b.classList.toggle('on', l.some(x => x.k === b.dataset.k))); }
  const TR = {'ç': 'c', 'ğ': 'g', 'ı': 'i', 'ö': 'o', 'ş': 's', 'ü': 'u', 'â': 'a', 'î': 'i', 'û': 'u', 'Ç': 'C', 'Ğ': 'G', 'İ': 'I', 'Ö': 'O', 'Ş': 'S', 'Ü': 'U', 'Â': 'A', 'Î': 'I', 'Û': 'U'};
  const ascii = t => String(t).normalize('NFC').replace(/[çğıöşüâîûÇĞİÖŞÜÂÎÛ]/g, c => TR[c]).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\x20-\x7E\n]/g, '');
  const plain = t => String(t).replace(/[“”«»]/g, '"').replace(/[‘’ʿʾ]/g, "'").replace(/[·—–…]/g, '-').replace(/\s{2,}/g, ' ').trim();
  const body1 = r => `Program: ${APP}\nYer: ${r.yer}\nKayit: ${r.bas}\nKayit no: ${r.k}\nHata turu: ${r.type}\nNot: ${r.note || '-'}\nSayfa: ${r.url}`;
  const subj = r => `[${APP} Hata] ${r.k}`;
  const mailto = (su, bo) => `mailto:${MAIL}?subject=${encodeURIComponent(ascii(plain(su)))}&body=${encodeURIComponent(ascii(bo.split('\n').map(plain).join('\n'))).replace(/%0A/g, '%0D%0A')}`;
  const gmail = (su, bo) => `https://mail.google.com/mail/?view=cm&fs=1&to=${MAIL}&su=${encodeURIComponent(su)}&body=${encodeURIComponent(bo)}`;
  function copy(t, msg) {
    const done = () => { msg.textContent = `Kopyalandı. Yeni bir e-posta aç, alıcıya ${MAIL} yaz ve metni mesajın içine yapıştır.`; };
    const fb = () => { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { msg.textContent = 'Kopyalanamadı; metni elle seçip kopyalayabilirsin.'; } ta.remove(); };
    try { if (navigator.clipboard && window.isSecureContext !== false) navigator.clipboard.writeText(t).then(done, fb); else fb(); } catch (e) { fb(); }
  }
  let pushed = false;
  function open(html) {
    box.innerHTML = html;
    if (!modal.classList.contains('open')) { try { history.pushState(Object.assign({}, history.state, {bld: 1}), ''); pushed = true; } catch (e) { pushed = false; } }
    modal.classList.add('open'); const f = box.querySelector('textarea,input,button'); f && f.focus();
  }
  let closing = false;
  function close() { if (!modal.classList.contains('open')) return; modal.classList.remove('open'); if (pushed) { pushed = false; closing = true; try { history.back(); } catch (e) { closing = false; } } }
  // Telefonda geri hareketi önce pencereyi kapatsın, programın kendi gezinmesine geçmesin
  window.addEventListener('popstate', e => {
    if (closing) { closing = false; e.stopImmediatePropagation(); return; }
    if (modal.classList.contains('open') || pushed || (history.state && history.state.bld)) {
      const wasOpen = modal.classList.contains('open');
      modal.classList.remove('open'); pushed = false; e.stopImmediatePropagation();
      if (!wasOpen && history.state && history.state.bld) { try { history.back(); } catch (er) {} }
    }
  }, true);
  modal.addEventListener('click', e => { if (e.target === modal || e.target.closest('[data-x=close]')) close(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && modal.classList.contains('open')) close(); });
  function report(b) {
    const r = {k: b.dataset.k, yer: b.dataset.yer || '', bas: b.dataset.bas || '', url: location.href};
    open(`<h3 id="bldTitle">Hata bildir</h3><div class="bld-loc">${E(r.yer)}</div><div class="bld-q">${E(r.bas)}</div>
      ${TYPES.map((t, i) => `<label><input type="radio" name="bldt" value="${i}" ${i === 0 ? 'checked' : ''}> ${E(t)}</label>`).join('')}
      <textarea id="bldNote" placeholder="Not (isteğe bağlı): doğrusu ne olmalı, kaynağı nedir…"></textarea>
      <div class="bld-btns"><button class="pri" data-a="mail">E-posta ile gönder</button><a data-a="gmail" href="#" target="_blank" rel="noopener">Gmail'de aç</a><button data-a="copy">Metni kopyala</button><button data-a="add">Listeye ekle</button><button data-x="close">Kapat</button></div>
      <div class="bld-msg" id="bldMsg" aria-live="polite"></div>
      <div class="bld-hint">“E-posta ile gönder” bilgisayarındaki/telefonundaki e-posta uygulamasını açar. Açılmazsa “Gmail'de aç”ı ya da “Metni kopyala”yı kullan. Adres: ${MAIL}. Birden çok hata bulacaksan “Listeye ekle” deyip sonra üstteki “Bildirimlerim” ile hepsini tek e-postada gönderebilirsin.</div>`);
    const get = () => Object.assign({}, r, {type: TYPES[+box.querySelector('input[name=bldt]:checked').value], note: box.querySelector('#bldNote').value.trim()});
    const msg = box.querySelector('#bldMsg'), q = a => box.querySelector(`[data-a=${a}]`);
    q('mail').onclick = () => { const x = get(); try { navigator.clipboard && navigator.clipboard.writeText(body1(x)).catch(() => {}); } catch (e) {} location.href = mailto(subj(x), body1(x)); msg.textContent = 'E-posta uygulaman açılıyor… Metin ayrıca panoya kopyalandı: mesaj boş ya da bozuk görünürse içini silip yapıştırabilirsin.'; };
    q('gmail').onclick = function () { const x = get(); this.href = gmail(subj(x), body1(x)); };
    q('copy').onclick = () => copy(body1(get()), msg);
    q('add').onclick = () => { const l = getL(); l.push(get()); setL(l); msg.textContent = `Listeye eklendi (${l.length}). Üstteki “Bildirimlerim” ile topluca gönderebilirsin.`; };
  }
  function openList() {
    const l = getL(), su = `[${APP} Hata] Toplu bildirim (${l.length} hata)`, bo = l.map((r, i) => `--- ${i + 1} ---\n${body1(r)}`).join('\n\n');
    open(`<h3 id="bldTitle">Bildirimlerim (${l.length})</h3>
      ${l.length ? `<ul class="bld-list">${l.map((r, i) => `<li><div><b>${E(r.bas.slice(0, 90))}</b><br><small>${E(r.yer)} · ${E(r.type)}${r.note ? ' — ' + E(r.note) : ''}</small></div><button data-del="${i}" title="Listeden çıkar">✕</button></li>`).join('')}</ul>` : '<p>Liste boş.</p>'}
      <div class="bld-btns">${l.length ? `<button class="pri" data-a="mail">Hepsini e-postayla gönder</button><a data-a="gmail" href="#" target="_blank" rel="noopener">Gmail'de aç</a><button data-a="copy">Metni kopyala</button><button data-a="clear">Listeyi temizle</button>` : ''}<button data-x="close">Kapat</button></div>
      <div class="bld-msg" id="bldMsg" aria-live="polite"></div><div class="bld-hint">Gönderdikten sonra “Listeyi temizle” diyebilirsin. Liste yalnızca bu tarayıcıda saklanır.</div>`);
    const msg = box.querySelector('#bldMsg'), q = a => box.querySelector(`[data-a=${a}]`);
    box.querySelectorAll('[data-del]').forEach(x => x.onclick = () => { const L = getL(); L.splice(+x.dataset.del, 1); setL(L); openList(); });
    if (!l.length) return;
    q('mail').onclick = () => { const u = mailto(su, bo); if (u.length > 1900) msg.textContent = `Liste uzun; e-posta uygulaması metni kesebilir. Kesilirse “Gmail'de aç” veya “Metni kopyala”yı kullan.`; location.href = u; };
    q('gmail').href = gmail(su, bo);
    q('copy').onclick = () => copy(bo, msg);
    q('clear').onclick = () => { setL([]); openList(); };
  }
  document.addEventListener('click', e => { const b = e.target.closest('.rep[data-k]'); if (!b) return; e.preventDefault(); e.stopPropagation(); report(b); }, true);
  new MutationObserver(() => { if (!lbtn) slot(); mark(); }).observe(document.body, {childList: true, subtree: true});
  window.bldButton = (k, yer, bas, txt) => `<button type="button" class="rep" data-k="${E(k)}" data-yer="${E(yer)}" data-bas="${E(String(bas).slice(0, 400))}" title="Bu kayıttaki bir hatayı bildir">${txt || '⚑ Bildir'}</button>`;
  window.bldOpenList = openList;
  sync();
})();
</script>

      + (sr>1 ? '<div class="gab-streak">🔥 '+sr+' gündür aralıksız çalışıyorsunuz</div>' : (sr===1 ? '<div class="gab-streak">🔥 Bugün çalıştınız. Yarın da gelirseniz seri başlar.</div>' : ''))
      + '<div class="gab-k"><div class="gab-kr gab-kh"><span>Ders</span><span class="n">Bitti</span><span class="n">Doğru</span></div>'+rows+'</div>'
      + '<p class="gab-note">'+(var_?'Bir derse dokunursanız kaldığınız yere gidersiniz. ':'')+'İlerlemeniz yalnızca bu cihazda, bu tarayıcıda saklanır.</p>'
      + '<a class="gab-mail" href="mailto:'+MAIL+'?subject='+encodeURIComponent('[Giray Akademi] Öneri / soru')+'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>İletişim · öneri ve soru gönderin</a>';

<script>
const UNITELER = [{"t":"Tahrice Giriş","intro":"Tahricin sözlük ve ıstılah anlamı, masâdır-ı asliyye, tahrice duyulan ihtiyaç, tahricin faydaları ve tahric usûlünün tarihî seyri.","s":[{"h":"Tahricin Tanımı","b":[{"k":"d","t":"Tahric (lügat)","x":"Bir şeyi bulup çıkarmak anlamında kullanıldığı gibi, bir kısmı verimli, bir kısmı çorak arazi için de kullanılır."},{"k":"p","x":"“Tahric” kelimesi birkaç manada kullanılır:"},{"k":"li","x":"İstinbat (fıkıhçılar kullanır)"},{"k":"li","x":"Tedrib (alıştırma)"},{"k":"li","x":"Tevcih (tefsirde)"},{"k":"ar","a":"أَخْرَجَهُ الْبُخَارِيُّ","x":"İnsanlara çıkış yerini beyan etti anlamındadır. Bu da hadisin senedinin ricalini zikretmekle olur."},{"k":"ar","a":"خَرَّجَهُ الْبُخَارِيُّ","x":"Ahrecehu manasındadır. Hadisin çıkış yerini zikretti."},{"k":"h","x":"Hadisçilerce tahric"},{"k":"n","n":1,"x":"İhrac kelimesinin eş anlamlısıdır: bu da hadisin ricalini zikretmek manasında."},{"k":"n","n":2,"x":"Hadisi kitaplardan çıkarıp rivayet etmek manasında."},{"k":"n","n":3,"x":"Delalet: Hadisin masâdır-ı asliyyedeki yerini göstermek. Bu da müelliflerden kimin rivayet ettiğini zikretmekle olur. Bu mana muhaddisler arasında meşhur olmuştur."},{"k":"d","t":"Tahric (ıstılah)","x":"Hadisin isnadla nakilde bulunulan masâdır-ı asliyyedeki (ana kaynaklardaki) yerlerini belirtmektir. Sonra da ihtiyaç duyulduğunda hadisin derecesi beyan edilir."}]},{"h":"Masâdır-ı Asliyye","b":[{"k":"d","t":"Masâdır-ı asliyye","x":"«هِيَ الَّتِي تَرْوِي الْحَدِيثَ بِالْإِسْنَادِ» Hadisi isnadla rivayet eden kaynaklardır."},{"k":"h","x":"Masâdır-ı asliyyeden maksat"},{"k":"n","n":1,"x":"Müelliflerin şeyhlerinden Hz. Peygamber’e ulaşan senedleriyle telakki ettikleri hadisleri ihtiva eden kitaplar. Ör. Kütüb-i Sitte, Muvatta’…"},{"k":"n","n":2,"x":"Yukarıdaki kitaplara tabi olan hadis kitapları. Ör. Kendinden önceki kitapları bir araya getiren eserler (Humeydî’nin el-Cem’u beyne’s-Sahihayn’ı)."},{"k":"n","n":3,"x":"Hadis dışındaki ilim dallarına ait kitaplar. Ör. Tefsir, tarih, fıkıh kitapları… (kendi senediyle olmak şartıyla)"},{"k":"tbl","r":[["Masâdır-ı asliyye türü","Örnek"],["**1. Senedleriyle telakki edilen hadis kitapları**","Kütüb-i Sitte, Muvatta’"],["**2. Bunlara tabi olan hadis kitapları**","Humeydî’nin el-Cem’u beyne’s-Sahihayn’ı"],["**3. Hadis dışı ilimlerin kitapları**","Tefsir, tarih, fıkıh kitapları (kendi senediyle olmak şartıyla)"]]}]},{"h":"Önemi, Hangi Açıdan İhtiyaç Duyulduğu","b":[{"k":"p","x":"Tahric sayesinde hadis ilmiyle uğraşanlar hadislere imamların telif ettiği masâdır-ı asliyyedeki yerlerine ulaşır."},{"k":"p","x":"Tahrice duyulan ihtiyaç çok fazladır. Şöyle ki; araştırmacının, âlimlerden kimin rivayet ettiğini bilmeden bir hadisi şahid olarak kullanması veya rivayet etmesi caiz değildir. Bundan dolayı tahric, şer’î ilimlerle uğraşan veya herhangi bir araştırmacının ihtiyacıdır."},{"k":"dikkat","x":"Araştırmacının, âlimlerden kimin rivayet ettiğini bilmeden bir hadisi şahid olarak kullanması veya rivayet etmesi caiz değildir."}]},{"h":"Faydası","b":[{"k":"li","x":"Hadisin metinlerinin karşılaştırılması suretiyle hadis metninin naklinin ne derecede dakik yapıldığı veya aksi olduğu tespit edilir."},{"k":"li","x":"Hadisin değişik rivayetlerinin incelenmesiyle, hangi hadis türüne (haber-i ahad, mütevatir…) dâhil olduğu ortaya çıkar."},{"k":"li","x":"Tahric ile hadisin şahit ve tabilerinin var olup olmadığı, böylece hadisin şahit ve tabilerle güçlenerek sahih veya hasen derecesine yükselme durumu belli olur."},{"k":"li","x":"Hadisin tahrici yapılarak rivayetlerinin bir araya getirilmesi ve karşılaştırılmasıyla varsa illetler ortaya konur."},{"k":"li","x":"Şazz rivayetler yahut sika ravilerin naklettiği ve diğer rivayetlerde yer almayan ilave ifadeler (ziyadetü’s-sikat) belirlenir. Şazz diye bilinen rivayetin şazz olup olmadığı da tespit edilebilir."},{"k":"li","x":"Çelişki olduğunda birbirini kuvvetlendiren ve tercihe şayan rivayet ve isnadların belirlenmesi sağlanabilir."},{"k":"li","x":"Senedde bulunabilecek zikredilmemiş isimler tespit edilip, hadisin munkatı’ hadis türlerinden hangisine dahil olduğu belirlenebilir."},{"k":"li","x":"Hadisin zamanını ve zeminini belirlemek, aynı şekilde nasih ve mensuhunu belirlemek."},{"k":"li","x":"Zaman zaman anlaşılmayan kelimelerin açıklamasına rastlanabilir. Gibi…"}]},{"h":"Tahric Usûlünün Tarihî Seyri","b":[{"k":"p","x":"“İlk dönemlerde hadis ilimleriyle meşgul olan âlimler ve araştırmacılar, daha sonraları ‘Hadis Tahric Usûlü’ ismi verilecek ilmin temel kâide ve esaslarını ortaya koymaya ve çalışmalarını bunların üzerine bina etmeye ihtiyaç duymadılar. Çünkü onların temel hadis kaynakları üzerindeki vukûfiyetleri daha fazla, bunlara ulaşmaları ise daha sağlam yollarla olmaktaydı. Herhangi bir hadisle delil getirmek istediklerinde rivâyetin temel kaynaklardaki konumunu, hangi ciltte yer aldığını hemen hatırlayabilirler, en azından tam olarak yerini bilebilirlerdi. Bunun sebebi ise, bu eserlerin nasıl tertib ve te’lif edildiği bilgisine sahip olmalarıydı. Bundan dolayı kendilerine bu eserlerden istifâde etmek ve hadis tahricinde bunlara mürâcaat etmek kolay gelirdi."},{"k":"p","x":"Durum birkaç asır bu şekilde devam etti. Daha sonra gelen âlim ve araştırmacıların temel hadis kaynaklarına mürâcaatları azaldı. Kendilerine fıkıh, tefsir, târih gibi ilimlerle uğraşan musanniflerin eserlerinde delil olarak getirdikleri hadislerin kaynaklarına ulaşmak zor gelmeye başladı. İçlerinden bazı bilginler uyanıklık gösterdiler. Bu hususta gayret sarf etmeye başladılar. Hadis ilmi dışında tasnif edilmiş bazı kitaplardaki rivâyetleri tahric ederek işe koyuldular. Farklı varyantlarını zikrettiler. Bu rivâyetlerin tamamı veya bazıları hakkında konumlarına göre sahih, zayıf v.b. hükümler verdiler. Böylece tahric kitapları şeklinde bir isimlendirme ortaya çıkmış oldu. **Hatîb el-Bağdâdî**’nin (463/1071), içindeki hadisleri tahric ettiği kitaplar bunların ilklerindendir."},{"k":"h","x":"Hatîb el-Bağdâdî’nin ilk tahricleri"},{"k":"n","n":1,"x":"Şerif Ebü’l-Kâsım el-Hüseynî’nin eserine yazdığı tahric; Tahrîcü’l-fevâidi’l-müntehabeti’s-sıhâh ve’l-ğarâib."},{"k":"n","n":2,"x":"Ebü’l-Kâsım el-Mehravânî’nin eserine yazdığı tahric; Tahrîcü’l-fevâidi’l-müntehabeti’s-sıhâh ve’l-ğarâib. (Her iki eser el yazması halinde mevcuttur)."},{"k":"p","x":"Bu başlangıçtan sonra tahric kitapları birbiri ardına gelmeye başladı. Bu sahada onlarca eser kaleme alındı. İçindeki rivâyetlerin tahricini yaptıkları bu eserler sebebiyle hadis âlimleri büyük hizmetlere imza attılar. İlim sâliklerini Hz. Peygamber’in (s.a.v.) tertemiz sünnet-i seniyyesine kolay bir şekilde ulaştırma yolunda şükre ve övgüye lâyık çalışmalarda bulundular. Bu gayretleriyle hadis külliyâtının açıklanması noktasında büyük bir boşluğu doldurdular. Şayet onlar bu büyük sorumluluğu üstlenmeseler ve özverili çalışmalarda bulunmasalardı, bu sahada elbette büyük bir boşluk olacak ve biz bugün bu rivâyetlerin kaynağına ulaşmada çok fazla çaba sarf etmek zorunda kalacaktık."},{"k":"p","x":"Asrımıza geldiğimizde ise, araştırmacılar okudukları herhangi bir kitapta rastladıkları bir hadisi -bu kitap da bu hadisin kaynağına kısaca işaret etmişse- işaret edilen kaynaktaki bu hadisin metnine nasıl ulaşacaklarını bilemez hale gelmişlerdir. Çünkü bu kaynağın tertibini ve başlıklandırılmasını bilmemektedirler."},{"k":"steps","x":["**İlk dönemler:** Âlimler kaynaklara vâkıftı; tahric usûlüne ihtiyaç duymadılar.","**Sonraki asırlar:** Kaynaklara mürâcaat azaldı; fıkıh, tefsir, târih kitaplarındaki hadislerin kaynağına ulaşmak zorlaştı.","**Tahric kitapları:** Hatîb el-Bağdâdî (463) ile başladı, onlarca eser yazıldı.","**Asrımız:** Araştırmacı, kaynağın tertibini bilmediği için işaret edilen hadise ulaşamaz hale geldi."]}]}],"ht":[{"s":0,"x":"Tahric ıstılahta: hadisin isnadla nakledildiği masâdır-ı asliyyedeki yerini belirtmek, gerekirse derecesini beyan etmektir."},{"s":0,"x":"Hadisçilerce tahricin 3 anlamı: ihrac (ricalini zikretmek), kitaplardan çıkarıp rivayet etmek, delalet (aslî kaynaktaki yerini göstermek; meşhur olan mana budur)."},{"s":1,"x":"Masâdır-ı asliyye: hadisi isnadla rivayet eden kaynaklar. 3 türü: senedle telakki edilen kitaplar (Kütüb-i Sitte, Muvatta’), bunlara tabi kitaplar (el-Cem’u beyne’s-Sahihayn), kendi senediyle rivayet eden tefsir, tarih, fıkıh kitapları."},{"s":2,"x":"İhtiyaç: kimin rivayet ettiğini bilmeden bir hadisi şahid olarak kullanmak veya rivayet etmek caiz değildir."},{"s":3,"x":"Faydaları: nakil dakikliği, hadis türü (ahad/mütevatir), şahit ve tabilerle sahih/hasen derecesine yükselme, illetler, şazz ve ziyadetü’s-sikat, tercih, senedde zikredilmeyen isimler (munkatı’ türü), zaman-zemin ve nasih-mensuh, garib kelimelerin açıklaması."},{"s":4,"x":"İlk tahric kitapları Hatîb el-Bağdâdî’nin (463/1071): Hüseynî’nin ve Mehravânî’nin eserlerine yazdığı Tahrîcü’l-fevâidi’l-müntehabeti’s-sıhâh ve’l-ğarâib (ikisi de el yazması)."},{"s":4,"x":"Asrımızda araştırmacılar kaynakların tertibini bilmedikleri için işaret edilen hadise ulaşamaz hale geldiler."}],"oz":{"t":"Tahrice Giriş · Özet","intro":"Şunları içerir: tahricin tarifi; tahricin ehemmiyeti, faidesi ve ona olan ihtiyaç; tahricin tarihinden bir nebze; meşhur tahric kitapları, bazılarının tanıtımı, yazarlarından bir nebze.","s":[{"h":"Tahricin Tanımı","b":[{"k":"d","t":"Tahric (lügat)","x":"İki zıttın bir şeyde toplanmasına denir, ayrıca “istinbat” ve “tevcih” manalarına da gelir."},{"k":"p","x":"Hadisçilere göre tahric; ihrac («الإخراج») manasına kullanılır; insanlara hadisin mahracını ibraz etmektir, hadisin ve râvilerinin kitaplardan çıkarılmasına kullanılır, hadisin aslî kaynağına delalet için kullanılır."},{"k":"d","t":"Tahric (ıstılah)","x":"Hadisi senediyle çıkaran aslî kaynağına delalet ve sıhhat derecesini beyan etmektir."},{"k":"p","x":"Tanımdan şu iki şey anlaşılır:"},{"k":"n","n":1,"x":"Aslî kaynaklardaki yeri."},{"k":"n","n":2,"x":"Sıhhat derecesi."},{"k":"h","x":"Hadisin aslî kaynaklarından murat"},{"k":"n","n":1,"x":"Efendimize isnadla şeyhlerinden telakki yoluyla telif edilen eserler: “Kütüb-i Sitte, Muvatta’, Müsned-i Ahmed, Müstedrek-i Hâkim” gibi."},{"k":"n","n":2,"x":"Bu kitaplara tabi olarak, etrâf olarak, muhtasar olarak yazılan eserler: el-Humeydî’nin el-Cem’u beyne’s-Sahîhayn’ı, Mizzî’nin Tuhfetü’l-Eşrâf bi Ma’rifeti’l-Etrâf’ı, Münzirî’nin Tehzîbü Süneni Ebî Dâvûd’u."},{"k":"n","n":3,"x":"Diğer fenlerde yazılan eserler; hadis içeren tefsir, fıkıh, tarih gibi (musannifinin isnadıyla rivayet etmesi şartıyla)."}]},{"h":"Ehemmiyet, Fayda ve İhtiyaç Yönü","b":[{"k":"li","x":"Hadislerin aslî kaynaklarındaki yerine ulaşabilmek için, şer’î ilimlerle meşgul olan herkese bu ilmi bilmek vaciptir."},{"k":"li","x":"Hadisi, hadis imamlarının yazmış olduğu aslî kaynaklardaki yerine ulaştırması en büyük faidesidir."},{"k":"li","x":"Kendisine olan ihtiyaç, ilim talibine bir hadisin kitaplarda müsned olarak rivayetini bilmeden onunla istişhad etmesinin caiz olmamasından anlaşılır."}]},{"h":"Tahricin Tarihinden Bir Nebze","b":[{"k":"p","x":"Ulema ilk dönemlerde bugün anladığımız manada “usûlü’t-tahric” ile pek ilgilenmediler. Zira kendileri için geniş bir hadis kaynağı yelpazesi bulunmakta idi; bu birkaç asır böylece devam etti. Zamanla ulema için hadis kaynaklarına ulaşma işi zorlaştı. Böylece **Hatîb Bağdâdî h.463** ilk tahrici «تخريج الفوائد المنتخبة الصحاح والغرائب» kitabıyla, Ebü’l-Kâsım’ın kitabının tahricini yaptı. Sonra Hâzimî’nin tahrici takip etti ve böylece iş yayılmaya başladı ve günümüze kadar geldi. Lakin günümüzde ilimle uğraşanlar bir hadis okuduğunda bunun tahricini, yani aslî kaynaklardaki yerini bulamayacak hale gelince bu ilimde içerikli bir kitabın yazılma ihtiyacı doğdu ki bu kitap bu ihtiyacı karşılama adına yazıya geçti."}]}]}},{"t":"Meşhur Tahric Kitapları","intro":"Tefsir, fıkıh, âdâb-tasavvuf-dua ve lügat kitaplarına yazılan meşhur tahricler; Nasbu’r-Râye, ed-Dirâye, et-Telhîsu’l-Habîr ve el-Muğnî’nin tanıtımı.","s":[{"h":"En Meşhur Tahric Kitapları","b":[{"k":"h","x":"Tefsir kitaplarına yazılan tahricler"},{"k":"n","n":1,"x":"Zemahşerî’nin (ö.538/1143) Keşşâf’ındaki hadislere Zeylaî’nin (ö.762/1361) Tahrîcü ehâdîsi’l-Keşşâf, İbn Hacer’in (ö.852/1448) el-Kâfi’ş-şâf isimli tahricleri."},{"k":"n","n":2,"x":"Beyzâvî’nin (ö.685/1286) Tefsîr’indeki hadislere Münâvî’nin (ö.1031/1622) Tuhfetü’r-râvî ve el-Fethu’s-semâvî isimli tahricleri."},{"k":"h","x":"Fıkıh kitaplarına yazılan tahricler"},{"k":"n","n":1,"x":"Şîrâzî’nin (ö.476/1083) Mühezzeb’ine Hâzimî’nin (ö.584/1188) tahrici (Tahrîcü ehâdîsi’l-Mühezzeb)."},{"k":"n","n":2,"x":"İbnü’l-Hâcib’in (ö.646/1248) Muhtasar’ına İbnü’l-Mülakkin’in (804/1702) ve İmam Makdisî’nin (ö.744/1343) tahricleri (Tahrîcü ehâdîsi’l-muhtasari’l-kebîr)."},{"k":"n","n":3,"x":"Merğınânî’nin (ö.593/1197) Hidâye’sine Zeylaî’nin Nasbu’r-râye ve İbn Hacer’in ed-Dirâye isimli tahricleri."},{"k":"n","n":4,"x":"Râfiî’nin (ö.623/1226) eş-Şerhu’l-kebîr’ine İzz b. Cemâa’nın (ö.767/1366) tahrici. Ayrıca İbnü’l-Mülakkin’in el-Bedru’l-münîr ve İbn Hacer’in et-Telhîsu’l-habîr isimli tahricleri."},{"k":"n","n":5,"x":"Nevevî’nin (ö.676/1277) Minhâc’ı üzerine İbnü’l-Mülakkin’in Tuhfetü’l-muhtâc’ı."},{"k":"n","n":6,"x":"Ğazzâlî’nin (ö.505/1106) Vasît’i üzerine İbnü’l-Mülakkin’in Tezkiratü’l-ahyâr’ı."},{"k":"n","n":7,"x":"Mevsılî’nin (ö.683/1284) İhtiyar’ı üzerine İbn Kutluboğa’nın (ö.879/1474) et-Ta’rîf’i."},{"k":"n","n":8,"x":"Sehnûn’un (ö.240/854) Müdevvene’si üzerine ed-Derdîr’in (ö.1201/1786) tahrici."},{"k":"h","x":"Âdâb, tasavvuf ve dua kitaplarına yazılan tahricler"},{"k":"n","n":1,"x":"Ğazâlî’nin İhyâ’sına Irâkî’nin (ö.806/1403) el-Muğnî’si."},{"k":"n","n":2,"x":"Nevevî’nin el-Ezkâr’ına İbn Hacer’in Netâicü’l-efkâr’ı."},{"k":"n","n":3,"x":"Kâdî İyaz’ın (ö.544/1149) Şifâ’sına Süyûtî’nin Menâhilü’s-safâ’sı."},{"k":"h","x":"Lügat kitaplarına yazılan tahriclerden"},{"k":"n","n":1,"x":"Cevherî’nin (ö.393/1002-3) Sıhâh’ına Süyûtî’nin Felkü’l-ısbâh’ı."},{"k":"tbl","r":[["Asıl eser","Müellifi","Tahrici","Tahric eden"],["**Keşşâf** (tefsir)","Zemahşerî","Tahrîcü ehâdîsi’l-Keşşâf · el-Kâfi’ş-şâf","Zeylaî · İbn Hacer"],["**Tefsîr** (tefsir)","Beyzâvî","Tuhfetü’r-râvî · el-Fethu’s-semâvî","Münâvî"],["**Mühezzeb** (fıkıh)","Şîrâzî","Tahrîcü ehâdîsi’l-Mühezzeb","Hâzimî"],["**Muhtasar** (fıkıh)","İbnü’l-Hâcib","Tahrîcü ehâdîsi’l-muhtasari’l-kebîr","İbnü’l-Mülakkin · Makdisî"],["**Hidâye** (fıkıh)","Merğınânî","Nasbu’r-râye · ed-Dirâye","Zeylaî · İbn Hacer"],["**eş-Şerhu’l-kebîr** (fıkıh)","Râfiî","el-Bedru’l-münîr · et-Telhîsu’l-habîr","İzz b. Cemâa · İbnü’l-Mülakkin · İbn Hacer"],["**Minhâc** (fıkıh)","Nevevî","Tuhfetü’l-muhtâc","İbnü’l-Mülakkin"],["**Vasît** (fıkıh)","Ğazzâlî","Tezkiratü’l-ahyâr","İbnü’l-Mülakkin"],["**İhtiyar** (fıkıh)","Mevsılî","et-Ta’rîf","İbn Kutluboğa"],["**Müdevvene** (fıkıh)","Sehnûn","—","ed-Derdîr"],["**İhyâ** (âdâb-tasavvuf)","Ğazâlî","el-Muğnî","Irâkî"],["**el-Ezkâr** (dua)","Nevevî","Netâicü’l-efkâr","İbn Hacer"],["**Şifâ**","Kâdî İyaz","Menâhilü’s-safâ","Süyûtî"],["**Sıhâh** (lügat)","Cevherî","Felkü’l-ısbâh","Süyûtî"]]}]},{"h":"Nasbu’r-Râye li-Ehâdîsi’l-Hidâye","b":[{"k":"li","x":"Muhammed Abdullah Yusuf ez-Zeylaî (762/1360)."},{"k":"li","x":"Hanefî kitaplarından Ali b. Ebî Bekr el-Merğınânî’nin Hidâye’sinin tahricidir."},{"k":"li","x":"İbn Hacer el-Askalânî bu yöntemden istifade etmiştir."},{"k":"li","x":"Türünün en önemli örneklerinden olup eseri farklı kılan özelliklerinin başında Hanefî mezhebinin yanı sıra diğer üç mezhebin delillerini de ihtiva etmesi gelir. Zeylaî, el-Hidâye’deki bir hadisi kaydettikten sonra onu zikreden sahâbî râvileri ve rivayetleri kaynaklarıyla birlikte nakleder. Hanefî mezhebinin delil aldığı hadislerde bir zaaf varsa onu da belirtir. Merğınânî’nin verdiği hadisin metniyle hadis kaynaklarında yer alan metin arasında farklar varsa bu tür rivayetler için “garîb” veya “garîb cidden” tabirini kullanır. Konuyla ilgili merfû hadislerin ardından mevkuf ve maktû rivayetleri nakleder. Bu rivayetler hakkında kendisinden önce yapılan eleştirileri aktarır; kısmen kendi eleştirilerine de yer verir. Daha sonra diğer mezheplerin delillerini ayrıntılı biçimde kaydeder. Geçmiş âlimlerin sözlerini zaman zaman tenkit eder. Hocası İbnü’t-Türkmânî onun en çok eleştirdiği isimlerden biridir."},{"k":"dikkat","x":"Râvi tenkidinde gevşek davranması, yer yer çelişkilere düşmesi, kaynaklara atıflarında zühullerinin bulunması ve el-Hidâye’deki hadislerin tamamını tahriç etmemesi Zeylaî’nin eleştirilen yönleridir."},{"k":"li","x":"Kitabın hadislerinin tahrici fıkıh kitaplarının tertibine göre yapılmıştır. Kitâbü’t-Tahâre ile başlar…"},{"k":"li","x":"Hidâye’nin tertibinde olduğu için bu kitaba müracaat kolaydır."},{"k":"li","x":"Ahkâm hadislerinin tahricinde dev bir ansiklopedi kabul edilir."}]},{"h":"ed-Dirâye fî Müntehabi Tahrîci Ehâdîsi’l-Hidâye","b":[{"k":"p","x":"İbn Hacer el-Askalânî’nin eseridir."},{"k":"li","x":"Zeylaî’nin Nasbu’r-Râye’sinin telhisidir (sadeleştirme + bazı hususları beyan). Zeylaî Merğınânî’nin Hidâye’sindeki hadisleri tahric etmiş, Askalânî de bu eseri telhis etmiştir."},{"k":"li","x":"Tahricdeki tertibde kitabın aslına riayet etmiştir. Aynı bablara göre tertip etmiştir."},{"k":"p","x":"Bazı önemsiz gördüğü hususları zikretmemiştir. Zira eserinin mukaddimesinde; “bazı dostlar Zeylaî’nin tahricinin pek menfaatli olmadığı ve telhis edilmesi gerektiğini söyleyince, hemen onu telhise koyuldum ve önemsiz bazı hususları çıkararak bu eseri güzel bir şekilde telhis ettim.” sözleri ile bu husus dile getirir."},{"k":"li","x":"Tahric ilminde ibtidaî derecedeki talebe için kullanımı kolaydır."},{"k":"li","x":"Önemsiz konu içermez, özlü konulara değinir. Ancak hadis tahricinde asıl olan hadisin tüm tariklerine ulaşmak ve konuyu genişçe izah etmek olduğu için derin araştırmalar için pek yararlı görülmez."},{"k":"h","x":"Eserden tahric örneği"},{"k":"p","x":"Meni hakkında Peygamberimiz (sav) Âişe’ye (r.a.) şöyle buyurdu:"},{"k":"ar","a":"فَاغْسِلِيهِ إِنْ كَانَ رَطْبًا، وَافْرُكِيهِ إِنْ كَانَ يَابِسًا","x":"“Yaş ise yıka, kuru ise ov.”"},{"k":"p","x":"Askalânî bu sîga ile hadisi masâdır-ı asliyyede bulamadığını «لَمْ أَجِدْهُ بِهَذِهِ الصِّيغَةِ» sözü ile ifade ettikten sonra:"},{"k":"li","x":"Bezzâr ve Dârekutnî’nin eserlerinde şu tarikle geldiğini zikreder: Âişe’nin (r.a.) şöyle dediğini:"},{"k":"ar","a":"كُنْتُ أَفْرُكُ الْمَنِيَّ مِنْ ثَوْبِ رَسُولِ اللَّهِ إِذَا كَانَ يَابِسًا، وَأَغْسِلُهُ إِذَا كَانَ رَطْبًا","x":""},{"k":"li","x":"Müslim’de başka bir ibare ile:"},{"k":"ar","a":"لَقَدْ رَأَيْتُنِي وَإِنِّي لَأَحُكُّهُ مِنْ ثَوْبِ رَسُولِ اللَّهِ يَابِسًا بِظُفُرِي","x":""},{"k":"li","x":"Ebû Dâvûd’da, Ahmed b. Hanbel’de ve Sahîhayn’da geçtiği sîgaları zikreder."},{"k":"li","x":"Şâfiî ve Beyhakî’nin Atâ b. Abbas’tan gelen rivayetinin (tükürük ve sümkürme mesabesindedir.) sahih olduklarını zikreder."},{"k":"li","x":"Beyhakî’nin bu hadise sahih dediğini, Dârekutnî ve Taberî’nin Atâ ve Ebû Leylâ’dan gelen rivayetin merfû olduğunu ifade ederek hadisi tahric etmiştir."}]},{"h":"et-Telhîsu’l-Habîr fî Tahrîci Ehâdîsi Şerhi’l-Vecîzi’l-Kebîr","b":[{"k":"p","x":"İbn Hacer el-Askalânî’nin (852) eseridir."},{"k":"li","x":"İbn Hacer’in (852) bu eseri, İbnü’l-Mülakkin’in (804) “el-Bedru’l-Münîr fî Tahrîci’l-Ehâdîs ve’l-Âsâri’l-Vâkıati fi’ş-Şerhi’l-Kebîr” isimli eserinin telhisidir."},{"k":"not","x":"eş-Şerhu’l-Kebîr; Şâfiî fakihlerinden olan er-Râfiî’nin (623), İmam Ğazzâlî’nin (505) el-Vecîz’ini şerh ettiği bir eserdir."},{"k":"li","x":"Askalânî, bu Şerhu’l-Kebîr isimli eserin beş kişi tarafından şerh edildiğini zikreder."},{"k":"not","x":"Şerh edenler: İbnü’l-Mülakkin (804), İzzüddin b. Cemâa (767), Bedrüddin b. Cemâa (torun) (819), Abdurrahman b. Nakkaş (845), Zerkeşî (774), Süyûtî (911)."},{"k":"li","x":"İbnü’l-Mülakkin Şerhu’l-Kebîr’i, Bedru’l-Münîr ismi ile yedi cilt olarak şerh etti. Sonra Hulâsatü’l-Bedri’l-Münîr ismi ile dört ciltte telhis etti. Sonra onda mühim bahisleri ayıklayıp bir cüz olarak Müntekâ Hulâsati’l-Bedri’l-Münîr eserini telif etti."},{"k":"li","x":"İbn Hacer eserin mukaddimesinde hadis tahricini en geniş bir şekilde ele alan eserin Şerhu’l-Kebîr olduğunu, en kısa eserinin de Hulâsatü’l-Bedri’l-Münîr olduğunu ama onun da çokça tekrara yer verdiğini, Müntekâ’sının ise tahricden asıl olan maksatları içermediğini zikrederek bu eserleri eleştirmektedir. Ve yeni bir telhis yapılması gerekliliğini vurgulamaktadır."},{"k":"li","x":"Eserin mukaddimesinde; yukarıda zikredilen şerhleri (beş kişinin şerhi) incelediğini ve her bir eserde farklı faydalı bilgiler mülahaza ettiğini, kiminin çok uzun kiminin çok kısa ve noksan olduğunu, kendi eserinin ise vâfi ve kâfi olmasını temenni ile bu işe giriştiğini zikreder."},{"k":"li","x":"Eserde takip edilen yöntem ed-Dirâye’de takip edilen tertibe göredir."},{"k":"steps","x":["**el-Vecîz:** Ğazzâlî (505)","**eş-Şerhu’l-Kebîr:** Râfiî’nin (623) şerhi","**el-Bedru’l-Münîr:** İbnü’l-Mülakkin’in (804) tahrici, 7 cilt","**Hulâsatü’l-Bedri’l-Münîr:** İbnü’l-Mülakkin’in telhisi, 4 cilt → **Müntekâ:** bir cüz","**et-Telhîsu’l-Habîr:** İbn Hacer’in (852) telhisi"]},{"k":"h","x":"Eserden tahric örneği"},{"k":"p","x":"Hz. Ali’nin (r.a.) hadisi: İbn Abbas Peygamberimize (sav) ihramdan çıkmazdan evvel sadakanın aciliyeti var mıdır diye sordu, Rasûlullah (sav) da ona ruhsat verdi."},{"k":"p","x":"Bu hadisi verdikten sonra masâdırda hangi eserde nerede geçtiğini verir, muhaddislerin hadis ile ilgili hükümlerini kısaca zikreder. (Bir önceki eserde olduğu gibi hadisleri ayrı ayrı yazmaz.)"}]},{"h":"el-Muğnî an Hamli’l-Esfâr fi’l-Esfâr","b":[{"k":"p","x":"Irâkî’nin el-Muğnî an Hamli’l-Esfâr fi’l-Esfâr fî Tahrîci mâ fi’l-İhyâ mine’l-Ahbâr’ı."},{"k":"li","x":"el-Hâfız Zeynüddin Abdurrahman b. Hüseyin el-Irâkî (806)."},{"k":"li","x":"İhyâü Ulûmi’d-Dîn’deki hadisleri tahric etmiştir."},{"k":"li","x":"Bu eser çok önem arz etmektedir. Çünkü İhyâ’da çokça zayıf ve uydurma rivayetlere yer verilmiştir."},{"k":"h","x":"Tahricdeki usûlü"},{"k":"steps","x":["Eğer hadis Sahîhayn’de varsa bunlarla iktifa eder.","Eğer yoksa diğer Kütüb-i Sitte eserlerine müracaat eder.","Bunlardan başkasına ihtiyaç olmadıkça müracaat etmez."]},{"k":"li","x":"Eğer Kütüb-i Sitte’de hadisi bulamazsa bazen “lâ asle lehû” der, bazen de “bulamadım” der."},{"k":"li","x":"Eğer tahrici yaptığı hadis başka bir konuda tekrar zikredilirse orada “bu hadis şu kısımda tahric edildi” demekle yetinir."},{"k":"li","x":"Tahric ederken; hadisin metninin bir kısmını, sahâbî ravisini ve muharricini zikrettikten sonra hadisin hükmünü beyan eder."},{"k":"li","x":"Gayet özlü bir eserdir."}]}],"ht":[{"s":0,"x":"Hidâye’nin (Merğınânî) iki tahrici: Zeylaî’nin Nasbu’r-râye’si ve İbn Hacer’in ed-Dirâye’si."},{"s":0,"x":"Keşşâf’ın (Zemahşerî) tahricleri: Zeylaî’nin Tahrîcü ehâdîsi’l-Keşşâf’ı ve İbn Hacer’in el-Kâfi’ş-şâf’ı."},{"s":0,"x":"İhyâ → Irâkî’nin el-Muğnî’si · el-Ezkâr → İbn Hacer’in Netâicü’l-efkâr’ı · Şifâ → Süyûtî’nin Menâhilü’s-safâ’sı · Sıhâh → Süyûtî’nin Felkü’l-ısbâh’ı."},{"s":0,"x":"İbnü’l-Mülakkin: Muhtasar’a tahric, el-Bedru’l-münîr (eş-Şerhu’l-kebîr), Tuhfetü’l-muhtâc (Minhâc), Tezkiratü’l-ahyâr (Vasît)."},{"s":1,"x":"Nasbu’r-Râye: Zeylaî (762), Hidâye’nin tahrici. Hanefî’nin yanında diğer üç mezhebin delillerini de verir; farklı metne “garîb / garîb cidden” der; ahkâm hadislerinde dev ansiklopedi."},{"s":1,"x":"Zeylaî’nin eleştirilen yönleri: râvi tenkidinde gevşeklik, çelişkiler, atıflarda zühul, Hidâye hadislerinin tamamını tahric etmemesi. En çok eleştirdiği isim hocası İbnü’t-Türkmânî."},{"s":2,"x":"ed-Dirâye: İbn Hacer, Nasbu’r-Râye’nin telhisi; Hidâye’nin bablarına göre. Mübtedi talebeye kolay, derin araştırmaya pek yararlı değil."},{"s":2,"x":"İbn Hacer bir sîgayı bulamayınca «لم أجده بهذه الصيغة» der."},{"s":3,"x":"et-Telhîsu’l-Habîr: İbn Hacer, İbnü’l-Mülakkin’in el-Bedru’l-Münîr’inin telhisi. Zincir: Vecîz (Ğazzâlî) → eş-Şerhu’l-Kebîr (Râfiî) → el-Bedru’l-Münîr (İbnü’l-Mülakkin) → et-Telhîsu’l-Habîr (İbn Hacer)."},{"s":3,"x":"Askalânî’ye göre Şerhu’l-Kebîr’i beş kişi şerh etmiştir; dipnotta sayılanlar: İbnü’l-Mülakkin, İzzüddin b. Cemâa, Bedrüddin b. Cemâa, İbnü’n-Nakkaş, Zerkeşî, Süyûtî."},{"s":4,"x":"el-Muğnî: Irâkî (806), İhyâ hadislerinin tahrici. Sıra: Sahîhayn → Kütüb-i Sitte → gerekirse diğerleri. Bulamazsa “lâ asle lehû” ya da “bulamadım” der."}],"oz":{"t":"Meşhur Tahric Kitapları · Özet","intro":"En meşhur tahric kitapları ve tanıtımları.","s":[{"h":"En Meşhur Tahric Kitapları","b":[{"k":"ar","a":"١- نَصْبُ الرَّايَةِ لِلزَّيْلَعِيِّ، لِأَحَادِيثِ الْهِدَايَةِ لِلْمَرْغِينَانِيِّ","x":""},{"k":"ar","a":"٢- تَخْرِيجُ أَحَادِيثِ الْكَشَّافِ لِلزَّمَخْشَرِيِّ، لِلزَّيْلَعِيِّ أَيْضًا","x":""},{"k":"ar","a":"٣- الْمُغْنِي عَنْ حَمْلِ الْأَسْفَارِ فِي الْأَسْفَارِ لِلْعِرَاقِيِّ، فِي تَخْرِيجِ مَا فِي الْإِحْيَاءِ مِنَ الْأَخْبَارِ","x":""},{"k":"ar","a":"٤- التَّلْخِيصُ الْحَبِيرُ لِابْنِ حَجَرٍ الْعَسْقَلَانِيِّ، فِي تَخْرِيجِ أَحَادِيثِ شَرْحِ الْوَجِيزِ الْكَبِيرِ لِلرَّافِعِيِّ","x":""},{"k":"ar","a":"٥- الدِّرَايَةُ لِابْنِ حَجَرٍ أَيْضًا، فِي تَخْرِيجِ أَحَادِيثِ الْهِدَايَةِ","x":""}]},{"h":"Nasbu’r-Râye li-Ehâdîsi’l-Hidâye","b":[{"k":"p","x":"Ulaştığımız en meşhur tahric kitaplarındandır, yazarı **Hanefî Zeylaî h.762**’dir. Hanefî fıkıh kitaplarından olan Merğınânî’nin h.593 Hidâye kitabındaki hadisleri tahric etmiştir. Bu kitap tahric kitapları arasında en iyi, en faydalı ve en kapsamlı olanıdır. İmamların isnaddaki ricâl için cerh-ta’dil sözlerini de içerir. Tahric alanında daha iyisi yazılamamış bir kitaptır. Ahkâm hadislerinin tahrici için geniş bir ansiklopedi gibidir. Diğer mezheplerin delil olarak aldığı bütün hadislerin de tahricini içerir. Yani Hanefî olmasının yanında, eğer Hanefîlerin aldığı hadis zayıf ya da garip, diğer mezheplerin aldığı hadis sahih ise bunu açıkça söylemekten geri durmaz."},{"k":"not","x":"Metodu: Hadisin tamamını zikreder, şahit ve mütâbileri getirir."},{"k":"p","x":"Bu kitabın ayrı bir özelliği de **“Ehâdîsü’l-Bâb”** deyip hadisi zikrettikten sonra **“Ehâdîsü’l-Husûm”** diyerek karşı görüşün hadislerini ve sıhhat derecesini zikreder."}]},{"h":"Tahrîcü Ehâdîsi’l-Keşşâf","b":[{"k":"p","x":"Zeylaî’nin diğer tahric kitabı."}]},{"h":"ed-Dirâye fî Ehâdîsi’l-Hidâye","b":[{"k":"p","x":"Bu kitab İbn Hacer Askalânî h.852’ye aittir. Kitabın en önemli özelliği Zeylaî’nin Nasbu’r-Râye’sinin özeti niteliğindedir. Belki mübtediler için kolaydır ve zaman kazandırır ama aslı varken çok da faidesinden bahsedilemez."}]},{"h":"et-Telhîsu’l-Habîr","b":[{"k":"p","x":"Bu kitap **İbn Hacer Askalânî**’ye aittir: **Gazzâlî**’nin “el-Vecîz” kitabını Râfiî “eş-Şerhu’l-Kebîr” ismiyle şerh etmiştir. Bu şerhi **Süyûtî** “Neşru’l-Abîr” isimli eseriyle ve **İbnü’l-Mülakkin** “el-Bedru’l-Münîr” isimli eseri ile tahric etmiştir. İbnü’l-Mülakkin’in “el-Bedru’l-Münîr” isimli tahric kitabını **İbn Hacer** “et-Telhîsu’l-Habîr” ismiyle özetlemiştir."},{"k":"steps","x":["**el-Vecîz:** Gazzâlî","**eş-Şerhu’l-Kebîr:** Râfiî","**Neşru’l-Abîr:** Süyûtî · **el-Bedru’l-Münîr:** İbnü’l-Mülakkin","**et-Telhîsu’l-Habîr:** İbn Hacer"]}]},{"h":"el-Muğnî an Hamli’l-Esfâr fi’l-Esfâr","b":[{"k":"p","x":"Bu kitap Hâfız Irâkî’ye aittir ve Gazzâlî’nin İhyâ adıyla bilinen meşhur eserinin hadislerinin tahricini yapmıştır. İhyâ’nın hadislerini Sahîhayn’da bulursa onu zikreder, eğer Sahîhayn’dan birinde bulamazsa Kütüb-i Sitte’den hangisinde bulursa onu zikreder, başka bir yerden ancak bir gayeye binaen rivayet eder, eğer Kütüb-i Sitte’de bulamazsa diğer sahih hadis kaynaklarından yerini gösterir."},{"k":"p","x":"Metodu: İhyâ’nın hadisinin bir kısmını, sonra sahâbîsini zikreder ve tahricini yapar. Sonra hadisin sahih, hasen, zayıf olduğunu beyan eder. Eğer hadisin hadis kitaplarında yeri yoksa “lâ asle leh” der, bazen “lâ a’rifuhû” der; yani ben bunu araştırmam neticesinde bulamadım/bilemedim der ve bunu diyecek kadar ince görüş sahibidir."}]}]}},{"t":"Birinci Yol: Sahâbî Râvi","intro":"Hadisi rivayet eden sahâbî biliniyorsa başvurulan yol: müsnedler, mu’cemler ve etrâf kitapları; Tuhfetü’l-Eşrâf ve Zehâiru’l-Mevârîs.","s":[{"h":"Tahric Yolları","b":[{"k":"p","x":"Hadis tahricinde takip edilmesi gereken metod: Tahric için beş ayrı metod vardır."},{"k":"n","n":1,"x":"Sahâbe râvisini bilme yolu ile tahric."},{"k":"n","n":2,"x":"Hadis metninin ilk kelimesinden yola çıkarak tahric."},{"k":"n","n":3,"x":"Kullanımı az olan bir kelimesinden araştırma yolu ile tahric."},{"k":"n","n":4,"x":"Hadisin konusundan hadisi bulma yolu ile tahric."},{"k":"n","n":5,"x":"Metin ve sened açısından hadisi göz önüne alarak tahric."},{"k":"tbl","r":[["Yol","Ne biliniyor?","Başvurulan eserler"],["**1. Yol**","Hadisi rivayet eden sahâbî","Müsnedler, mu’cemler, etrâf kitapları"],["**2. Yol**","Metnin ilk kelimesi","Halk dilinde meşhur hadis kitapları, alfabetik eserler, fihristler"],["**3. Yol**","Metinde az kullanılan bir kelime","el-Mu’cemü’l-müfehres (Concordance)"],["**4. Yol**","Hadisin konusu","Konularına göre tertib edilmiş eserler"],["**5. Yol**","Metin ve senedin hâli","Mevzûât, müselsel, mürsel, ilel kitapları vb."]]}]},{"h":"Birinci Yol: Sahâbe İsmine Göre Tertib Edilmiş Eserler","b":[{"k":"p","x":"Sahâbe (râvi) ismine göre tertib edilmiş eserlerden yararlanma:"},{"k":"li","x":"Hadisin hangi sahâbî veya sahâbîler tarafından rivayet edildiği biliniyorsa bu yönteme başvurulabilir."},{"k":"li","x":"3 türlü tasniften yardım alırız: **Müsnedler** (el-Mesânîd), **Mu’cemler** (el-Meâcim), **Etrâf kitapları**."}]},{"h":"Müsnedler (el-Mesânîd)","b":[{"k":"d","t":"Müsned","x":"Hadisleri sahâbe isimlerine göre derleyen kitaplardır."},{"k":"li","x":"Müsnedlerdeki sahâbe isimlerinin tertibinde hece harfleri, İslam’a giriş önceliği, kabilesi, beldesi gibi farklı kriterler göz önüne alınmıştır. Hece harflerine göre tertib edilmiş müsnedlerden istifâde etmek daha kolaydır."},{"k":"li","x":"Müsned tabiri sadece sahâbe ismi esas alınan kitaplar için değil, bazen harflere ve bablara göre tertib edilmiş kitaplar için de kullanılır. Ayrıca lügavî anlamda Hz. Peygamber’e (sav) isnad edilen sözlerin hepsine müsned denir."},{"k":"li","x":"Hadis imamlarının tasnif ettiği müsned kitaplarının sayısı çoktur. **Kettânî** (ö.1345/1926) er-Risâletü’l-müstatrafe adlı eserinde 82 müsned ismi zikrettikten sonra bunlardan başka pek çok müsnedin olduğunu söyler."},{"k":"h","x":"Müsnedlerden bazı örnekler"},{"k":"n","n":1,"x":"Ahmed b. Hanbel’in (ö.241/855) Müsned’i."},{"k":"n","n":2,"x":"Ebû Bekr Abdullah b. ez-Zübeyr el-Humeydî’nin (ö.219/834) Müsned’i."},{"k":"n","n":3,"x":"Ebû Dâvûd Süleyman b. Dâvûd et-Tayâlisî’nin (ö.204/819) Müsned’i."},{"k":"n","n":4,"x":"Esed b. Musa el-Emevî’nin (ö.212/827) Müsned’i."},{"k":"n","n":5,"x":"Müsedded b. Müserhed el-Esedî el-Basrî’nin (ö.228/843) Müsned’i."},{"k":"n","n":6,"x":"Nuaym b. Hammad’ın (ö.228/843) Müsned’i."},{"k":"n","n":7,"x":"Ubeydullah b. Musa el-Absî’nin (ö.213/828) Müsned’i."},{"k":"n","n":8,"x":"Ebû Hayseme Züheyr b. Harb’in (234/849) Müsned’i."},{"k":"n","n":9,"x":"Bezzâr’ın (ö.292/905) Müsned’i. (el-Bahru’z-zehhâr)"},{"k":"n","n":10,"x":"Ebû Ya’lâ’nın (ö.307/919) Müsned’i."},{"k":"n","n":11,"x":"Abd b. Humeyd’in (ö.249/863) Müsned’i."},{"k":"p","x":"Bu müsnedlerdeki sahâbe sıralaması genel itibarıyla şöyledir: Aşere-i Mübeşşere, Ehl-i Beyt, Ashab-ı Bedr, muhacir, ensar, kabilelerden gelen sahâbîler, nâdir sahâbîler, hanım sahâbîler."}]},{"h":"Humeydî’nin Müsned’i","b":[{"k":"p","x":"Humeydî’nin (219/834) Müsned’i:"},{"k":"li","x":"Ebû Bekr Abdullah b. ez-Zübeyr Îsa el-Humeydî el-Esedî Mekkeli ilk müsned musannifidir. Süfyan b. Uyeyne’nin uzun yıllar talebeliğini yapmış, İmam Buhârî’ye de hocalık etmiştir. Şâfiî’nin ders arkadaşıdır."},{"k":"li","x":"1300 hadis ihtiva etmektedir. 180 sahâbînin müsnedi yer almaktadır."},{"k":"li","x":"Sahâbe müsnedi olup, Hz. Ebubekir sonra diğer üç halifenin hadislerini tarihe göre sıralamıştır. Ancak Talha b. Ubeydullah’ın hadislerine ulaşamadığından kitabına almamıştır. Geri kalan diğer sahâbîlerde herhangi bir tertip gözetmemiştir. Görünen tertibi önce İslam’a giriş sırası, sonra Hz. Peygamber’in zevceleri, sonra hanım sahâbîler, sonra Ensar’dan olan erkek sahâbîler şeklindedir."},{"k":"h","x":"Tahric usûlünde kullanılacak ifâde"},{"k":"ar","a":"أَخْرَجَهُ الْحُمَيْدِيُّ فِي مُسْنَدِهِ (ج / ص) رَقْمُ الْحَدِيثِ: ... نَحْوَهُ / مِثْلَهُ / ... وَقَالَ الْمُحَقِّقُ حُسَيْن سَلِيم أَسَد: ...","x":""},{"k":"h","x":"Humeydî’nin Müsned’inde aradığımız hadise ulaşma şekilleri"},{"k":"n","n":1,"x":"Tahkik edenlerin kendi fihristlerinden."},{"k":"n","n":2,"x":"Mevsûatü etrâfi’l-hadîs’ten; hadisin başında geçen ilk kelimenin ilk harfine göre. (Rumuzu: «حميدي»)"},{"k":"n","n":3,"x":"Elfiye, Şâmile gibi çeşitli hadis CD’lerinden. (Elfiye’de hadis numaraları tutmaktadır)."}]},{"h":"Ahmed b. Hanbel’in Müsned’i","b":[{"k":"p","x":"Ahmed b. Hanbel’in (ö.241/855) Müsned’i:"},{"k":"li","x":"Hadisleri alfabetik olarak değil faziletlerine, kaldıkları yerlere ve kabilelerine vb. göre tertib etmiştir."},{"k":"li","x":"Bazen de bir hadis birkaç yerde geçer."},{"k":"li","x":"Toplam 904 sahâbî vardır."},{"k":"li","x":"Ahmed b. Hanbel’in Müsned’inin içinde oğlu Abdullah’ın ziyâdeleriyle birlikte 40.000 civârında rivâyet bulunduğu iddia edilmektedir. 10.000 kadarı mükerrerdir."},{"k":"li","x":"Tertibi: Hz. Ebubekir’den başlayarak Aşere-i Mübeşşere sahâbîler, sonra Abdurrahman b. Ebibekir, sonra Ehl-i beyt, en sonda da Şeddad b. el-Hâd ile bitirir."},{"k":"h","x":"Müsned’e yapılan bir çalışma: el-Fethu’r-Rabbânî"},{"k":"p","x":"Hasan el-Bennâ’nın babası **Ahmed Abdurrahman el-Bennâ es-Sââtî**’nin yazdığı el-Fethu’r-Rabbânî’dir. 24 cilttir. Hadisleri konularına göre tertib etmiştir. Bülûğu’l-emânî ismiyle eserini şerh ettikten sonra el-Fethu’r-Rabbânî bu şerhle birlikte basılmıştır. Şerhinde hadislerin tahricini de yapmıştır. Hadislerin kaynağını («خ», Buhârî gibi) rumuzlarla verir. Daha sonra hadisin hükmünü belirtir. Hadisler (içindeki tekrarlar çıkınca) 12.000 civârındadır. Şârihin kendi tekrarlarını da çıkarırsak 10.000 civârında hadis kalır."},{"k":"h","x":"Tahric usûlünde kullanılacak ifâde"},{"k":"ar","a":"أَخْرَجَهُ أَحْمَدُ فِي مُسْنَدِهِ (ج / ص) رَقْمُ الْحَدِيثِ: ... نَحْوَهُ / مِثْلَهُ / ... وَقَالَ الْمُحَقِّقُ شُعَيْب الْأَرْنَؤُوط / أَحْمَد مُحَمَّد شَاكِر: ...","x":""},{"k":"p","x":"Bu ve diğer kaynaklardaki tahric çalışmalarında dikkat edeceğimiz diğer bir nokta da şudur: Araştırdığımız hadisi başka bir sahâbî de rivâyet etmişse bu, hadisimizin şâhidinin olduğunu gösterir. Bunu da tahric çalışmalarımızda belirtmemiz gerekir:"},{"k":"ar","a":"أَخْرَجَهُ أَحْمَدُ فِي مُسْنَدِهِ (ج / ص) رَقْمُ الْحَدِيثِ: ... وَلَهُ شَاهِدٌ عَنْ ...","x":"(hangi sahâbeden ise o yazılacak)"},{"k":"not","x":"«نحوه / مثله» gibi ifâdeleri şâhitlerde kullanmıyoruz."},{"k":"h","x":"Ahmed b. Hanbel’in Müsned’inde aradığımız hadise ulaşma şekilleri"},{"k":"n","n":1,"x":"Concordance’den; en ğarib kelimeler tercih edilmeli."},{"k":"n","n":2,"x":"Tahkik edenlerin kendi fihristlerinden: a) Ahmed Muhammed Şâkir tahkikinin 19 ve 20. ciltleri. b) Şuayb Arnavut tahkikinin 46, 47, 48, 49, 50. ciltleri."},{"k":"p","x":"Hadisin şerhine bakmak isteyenler; el-Fethu’r-Rabbânî’ye bakabilir ve tek cilt halindeki hece harfi esaslı fihristinden yararlanabilirler."},{"k":"n","n":3,"x":"Miftâhu künûzi’s-sünne’den; konusuna göre."},{"k":"n","n":4,"x":"Mevsûatü etrâfi’l-hadîs’ten; hadisin başında geçen ilk kelimenin ilk harfine göre. (Rumuzu: «حم»)"},{"k":"n","n":5,"x":"Kütüb-i tis’a, Elfiye, Şâmile gibi çeşitli hadis CD’lerinden."}]},{"h":"Mu’cemler (el-Meâcim)","b":[{"k":"d","t":"Mu’cem","x":"Hadislerin sahâbeye veya hocalara (şuyûh) veyahut beldelere göre, çoğu kere alfabetik olarak sıralandığı eserlere mu’cem denir."},{"k":"li","x":"Mu’cemler sahâbe ismine göre derlenmişse, müsnedlerle aynı sisteme sahiptir."},{"k":"li","x":"Mu’cemin müsnedden farkı: Hadisleri müellifin hocalarına veya ravilerin beldelerine göre de toplamalarıdır."},{"k":"tbl","r":[["","Müsned","Mu’cem"],["**Tertib esası**","Sahâbe isimleri","Sahâbe, hocalar (şuyûh) veya beldeler"],["**Sıralama**","Hece harfleri, İslam’a giriş önceliği, kabile, belde gibi farklı kriterler","Çoğu kere alfabetik"]]},{"k":"h","x":"En meşhur mu’cemler"},{"k":"n","n":1,"x":"Taberânî’nin (ö.369/971) el-Mu’cemü’l-kebîr’i."},{"k":"n","n":2,"x":"Taberânî’nin el-Mu’cemü’l-evsat’ı."},{"k":"n","n":3,"x":"Taberânî’nin el-Mu’cemü’s-sağîr’i."},{"k":"n","n":4,"x":"İbn Lâl el-Hemedânî’nin (ö.398/1008) Mu’cemü’s-sahâbe’si."},{"k":"n","n":5,"x":"Ebû Ya’lâ Ahmed b. Ali el-Mevsılî’nin (ö.307/919) Mu’cemü’s-sahâbe’si."}]},{"h":"Taberânî’nin Üç Mu’cemi","b":[{"k":"h","x":"el-Mu’cemü’l-kebîr"},{"k":"li","x":"Ebü’l-Kâsım Süleyman b. Ahmed et-Taberânî."},{"k":"li","x":"60.000 hadis içerir."},{"k":"li","x":"İlk önce Aşere-i Mübeşşere’den gelen rivâyetleri daha sonra alfabetik olarak diğer sahâbîlerden gelen rivâyetleri kitabına alır."},{"k":"li","x":"Ebû Hüreyre’den gelen rivâyetler bu eserinde bulunmamaktadır. Çünkü onları bir başka eserinde müstakil olarak derlemiştir."},{"k":"li","x":"Mu’cem mutlak olarak kullanılınca Taberânî’nin el-Mu’cemü’l-kebîr’i akla gelir. Diğer mu’cemlerde ise isimleri belirtilir."},{"k":"h","x":"el-Mu’cemü’l-evsat"},{"k":"li","x":"Taberânî’nin, hocalarını alfabetik olarak sıralamasıyla meydana getirdiği eseridir. İçinde 30.000 rivâyet olduğu söylenir. 2.000’e yakın hocası vardır."},{"k":"h5","x":"el-Mu’cemü’l-evsat’ta aradığımız hadise ulaşma şekilleri"},{"k":"n","n":1,"x":"Kitabın kendi fihristinden."},{"k":"n","n":2,"x":"Mevsûatü etrâfi’l-hadîs’ten; hadisin başında geçen ilk kelimenin ilk harfine göre. (Rumuzu: «طس»)"},{"k":"n","n":3,"x":"Elfiye, Şâmile gibi çeşitli hadis CD’lerinden. (Elfiye’de hadis numaralarında dört beş hadis oynama vardır)."},{"k":"h","x":"el-Mu’cemü’s-sağîr"},{"k":"li","x":"Kitabını, hocalarının 1.000 tanesinden birer hadis derleyerek oluşturmuştur. Hocalarının isimlerini alfabetik olarak tertib etmiştir. Eserinin sonlarına doğru bazen bir hocadan iki veya daha fazla hadis naklettiği de görülmektedir."},{"k":"h5","x":"el-Mu’cemü’s-sağîr’de aradığımız hadise ulaşma şekilleri"},{"k":"li","x":"Kitabın kendi fihristinden."},{"k":"li","x":"Mevsûatü etrâfi’l-hadîs’ten; hadisin başında geçen ilk kelimenin ilk harfine göre. (Rumuzu: «طص»)"},{"k":"li","x":"Elfiye, Şâmile gibi çeşitli hadis CD’lerinden. (Elfiye’de hadis numaralarında kırk civarında oynama vardır.)"},{"k":"tbl","r":[["Taberânî’nin mu’cemi","Tertib","Hacim","Rumuz"],["**el-Mu’cemü’l-kebîr**","Önce Aşere-i Mübeşşere, sonra sahâbîler alfabetik; Ebû Hüreyre rivâyetleri yok","60.000 hadis","—"],["**el-Mu’cemü’l-evsat**","Hocaları alfabetik","30.000 rivâyet, 2.000’e yakın hoca","«طس»"],["**el-Mu’cemü’s-sağîr**","1.000 hocasından birer hadis, hocalar alfabetik","—","«طص»"]]}]},{"h":"Etrâf Kitapları","b":[{"k":"p","x":"Hadis edebiyâtında hadis bulmakta faydalandığımız anahtar kitaplar ve fihristler vardır. Bu konuda yazılan eserlerin başında etrâf kitapları gelir. Hadisin bir bölümünü ya da başını esas alarak asıl kaynaklarına göndermede bulunan bu etrâf kitapları daha çok Buhârî, Müslim ve Kütüb-i Sitte için kaleme alınmışlardır. Başka bir ifâde ile bu kitaplar hadisin anlam içeren (metnin başından, ortasından veya sonundan) bir bölümünü zikredip, tamamına yönlendirirler."},{"k":"dikkat","x":"Masâdır-ı ğayr-i asliyyeden olduğu için kaynak olarak gösterilmezler."},{"k":"p","x":"Etrâf kitapları, içlerinde bulunan hadislerin senedlerini özet mâhiyette bize verir. Özellikle; hadisin nerede birleştiğini, nerede ayrıldığını, nerede kopukluk olduğunu gösterir."},{"k":"p","x":"Bu kitaplardan, özel bir kitabın sened ve metinlerini kontrol etme şeklinde de yararlanabiliriz."},{"k":"p","x":"Etrâf kitabı musanniflerinden bazıları hadis metninin tamamını zikrederken, bazıları da sadece hadis metninin bir kısmını ve sahâbî ismini zikretmekle yetinmişlerdir."},{"k":"h","x":"Etrâf kitaplarının tertibleri"},{"k":"li","x":"Çoğunlukla müsned tarzındadır. Yani sahâbe sıralamasına göredir. Bir sahâbeyi esas alarak araştırma yapıyorsak etrâf kitaplarına bakabiliriz. Örneğin; araştırdığımız sahâbeden ne kadar hadis nakledilmiş olduğunu görebiliriz."},{"k":"li","x":"İlk dönem etrâf kitapları çoğunlukla sahâbe ismi esas alınarak, hece harfine göre tanzim edilmişlerdir. Daha sonraki dönemlerde hadis metninin ilk harfi esas alınarak ve sahâbe ismi verilmeden hazırlandığı görülmektedir."},{"k":"h","x":"Etrâf kitaplarından bazı örnekler"},{"k":"n","n":1,"x":"Dımeşkî’nin (ö.401/1011) Etrâfü’s-sahîhayn’ı."},{"k":"n","n":2,"x":"Vâsıtî’nin (ö.401/1011) Etrâfü’s-sahîhayn’ı. (Buhârî ve Müslim için)."},{"k":"n","n":3,"x":"İbn Asâkir’in (ö.571/1175) el-İşrâf alâ ma’rifeti’l-eşrâf’ı."},{"k":"n","n":4,"x":"Mizzî’nin (ö.741/1340) Tuhfetü’l-eşrâf bi ma’rifeti’l-etrâf’ı. (Kütüb-i Sitte için)."},{"k":"n","n":5,"x":"İbn Hacer el-Askalânî’nin (ö.852/1448) İthâfü’l-mehere bi etrâfi’l-aşere’si. Muvatta’, Şâfiî, A. b. Hanbel ve Dârimî’nin Müsned’leri, İbnü’l-Cârûd’un Müntekâ’sı, İbn Hibbân’ın Sahih’i, Hâkim’in Müstedrek’i, Ebû Avâne’nin Müstahrec’i, Tahâvî’nin Şerhu meâni’l-âsâr’ı, Dârekutnî’nin Sünen’ini içermektedir."},{"k":"n","n":6,"x":"Bûsırî’nin (ö.840/1436) Etrâfü’l-mesânîdi’l-aşere’si. Tayâlisî, Humeydî, Müsedded b. Müserhed, İbn Ebî Şeybe, İshâk b. Râhûye, İbn Ebî Ömer el-Adenî (ö.243/858), İbn Menî’ (ö.244/858), Abd b. Humeyd, İbn Ebî Üsâme (ö.282/895) ve Ebû Ya’lâ’dan oluşan 10 musannife ait Müsned’lerin etrâfıdır."},{"k":"n","n":7,"x":"en-Nablusî’nin (ö.1143/1730) Zehâiru’l-mevârîs fi’d-delâle alâ mevâzıi’l-hadîs’i. (Kütüb-i Sitte ve Muvatta’ için)."},{"k":"h","x":"Etrâf kitaplarının faydaları"},{"k":"n","n":1,"x":"Bir taraftan hadisin çeşitli senedlerini bir arada görürken, diğer taraftan hadisin ğarib, aziz, meşhur olup olmadığını öğrenebiliriz."},{"k":"n","n":2,"x":"Hadisin hangi aslî kaynaklarda geçtiğini ve hangi kitab ve bâb başlıkları altında incelendiğini bilebiliriz."},{"k":"n","n":3,"x":"Etrâf kitaplarından (esas aldıkları aslî kaynaklardaki) her sahâbînin yapmış olduğu rivâyet sayılarını bilebiliriz."},{"k":"not","x":"Etrâf kitapları hadisin tamamını vermez. Ayrıca hadisin manasını alır. Asıl metni işaret ettiği kaynaklardadır."}]},{"h":"Tuhfetü’l-Eşrâf bi Ma’rifeti’l-Etrâf","b":[{"k":"li","x":"Hâfız Cemâlüddin Ebü’l-Haccâc Yusuf b. Abdurrahman el-Mizzî (ö.742)."},{"k":"li","x":"Müsned ve mu’cemler gibi sahâbe isimlerine göre alfabetik olarak tertip edilmiştir."},{"k":"li","x":"Etrâf denmesinin sebebi: Belirli kitapların isnadlarını bir araya getirdiği içindir."},{"k":"li","x":"Mevzusu: Kütüb-i Sitte’ye ilaveten şu dört eserin hadisleri bir araya getirilmiştir:"},{"k":"n","n":1,"x":"Sahîh-i Müslim’in Mukaddime’si."},{"k":"n","n":2,"x":"Ebû Dâvûd’un Merâsil’i."},{"k":"n","n":3,"x":"Tirmizî’nin Câmi’inin sonundaki el-İlelü’s-Sağîr’i."},{"k":"n","n":4,"x":"Tirmizî’nin Şemâil’i."},{"k":"n","n":5,"x":"Nesâî’nin Amelü’l-Yevm ve’l-Leyle’si."},{"k":"h","x":"Rumuzları"},{"k":"tbl","r":[["Rumuz","Anlamı"],["«خ»","Buhârî"],["«خت»","Buhârî - ta’lîkan"],["«م»","Müslim"],["«د»","Ebû Dâvûd"],["«مد»","Ebû Dâvûd - Merâsil"],["«ت»","Tirmizî"],["«تم»","Tirmizî - Şemâil"],["«س»","Nesâî"],["«سي»","Nesâî - Amelü’l-Yevm ve’l-Leyle"],["«ق»","İbn Mâce"],["«ز»","Musannifin ziyadeleri"],["«ك»","Musannifin İbn Asâkir’e müstedreki"],["«ع»","6 hadis kitabının rivayetleri"]]},{"k":"h","x":"Tertibi"},{"k":"li","x":"Kitapta sahâbîler alfabetik dizildiğinden, önce ismi hemze harfiyle başlayan sahâbîlere yer verilir."},{"k":"li","x":"Çok hadisi bulunan sahâbîyi, kendisinden nakledenlere göre yeniden alt başlıklara ayırır."},{"k":"h","x":"Hadisi tekrar etmesi ve sebebi"},{"k":"li","x":"Kitabı müsned olduğundan bazen bazı hadisleri birden fazla sahâbî rivayet eder. Bu da hadisin tekrarını gerektirir. Haliyle hadis sayısı 12.302 iken 19.595’e çıkmaktadır. Toplam 905 sahâbînin müsned rivayetleri ile 400 sahâbînin mürsel hadisleri yer alır."},{"k":"h","x":"Hadisleri sevketme düzeni"},{"k":"li","x":"Buhârî’den başlar, sırasıyla Müslim, böylece İbn Mâce’ye kadar gider."},{"k":"h","x":"Tahric usûlünde kullanılacak ifâde"},{"k":"ar","a":"ذَكَرَهُ الْمِزِّيُّ فِي تُحْفَةِ الْأَشْرَافِ (ج / ص) رَقْمُ الْحَدِيثِ: ...","x":""},{"k":"p","x":"Aslî kaynağa ulaşıp hadisi bulduktan sonra şu ifâde kullanılır:"},{"k":"ar","a":"أَخْرَجَهُ (الْبُخَارِيُّ) فِي كِتَابِ: ... بَابِ: ... (نَحْوَهُ / مِثْلَهُ ...)","x":"Örnek"}]},{"h":"Zehâiru’l-Mevârîs fi’d-Delâle alâ Mevâzıi’l-Hadîs","b":[{"k":"p","x":"Abdülğanî en-Nablusî’nin (ö.1143/1730) Kütüb-i Sitte ve İmam Mâlik’in Muvatta’ının hadislerinin etrâfıdır. Kitapta bu eserlerin her biri rumuzlarla gösterilir. Kitap yedi ana bölümdür. Erkek sahâbîler, künyesiyle meşhur olan sahâbîler, mübhem isimli erkek sahâbîler, kadın sahâbîler, künyeleriyle bilinen kadın sahâbîler, mürsel hadisler. Her bölüm kendi içinde alfabetiktir. Her şahsın isminin altında onun yukarıda belirtilen 7 kitapta geçen hadislerinin isnadları verilir. Hadisler birden çok sahâbî tarafından nakledilmişse, tekrardan kaçınmak için bir sahâbînin adı altında zikretmekle yetinilir. Bu yüzden, hadis bulmada bazı zorluklarla karşılaşılabilir. Kitap 13302 hadis barındırır. Beyrut’ta 1 cilt olarak basılmıştır. Eserin üstünde baskı tarihi yoktur."},{"k":"h","x":"Tuhfetü’l-Eşrâf ile karşılaştırılması"},{"k":"p","x":"Şüphesiz her bir kitabı diğer kitaplardan ayıran kendisine has bir özelliği vardır. el-Mizzî’nin kitabı, hadisin isnadı, hadis hakkında hüküm vermek, farklı tarikleri ve ravileri bakımından daha üstündür. Bu şekilde birçok sahâbînin rivayet ettiği bir hadisi onların müsnedlerinde kolaylıkla bulabilme imkânına sahip olur ki bu çok güzel bir özelliktir. Fakat “Zehâiru’l-Mevârîs”te hadisi bazı sahâbe ravilerin müsnedlerinde bulamaz, dolayısıyla bu, kitap için bir eksikliktir."},{"k":"p","x":"“Zehâiru’l-Mevârîs” muhtasar olması bakımından ön plandadır. Sadece hadisin metnine vakıf olmak isteyenler ve kitabın içerdiği musannef sahiplerini öğrenmek, tahric etmek isteyenler içindir. Bu şekilde araştırmacı amacına en kısa ve en kolay yoldan ulaşmış olur."},{"k":"tbl","r":[["","Tuhfetü’l-Eşrâf (Mizzî)","Zehâiru’l-Mevârîs (Nablusî)"],["**Kapsam**","Kütüb-i Sitte + Müslim’in Mukaddime’si, Merâsil, el-İlelü’s-Sağîr, Şemâil, Amelü’l-Yevm ve’l-Leyle","Kütüb-i Sitte + Muvatta’"],["**Tekrar**","Hadisi her sahâbînin altında tekrarlar (12.302 → 19.595)","Tekrardan kaçınır, tek sahâbînin adı altında verir (13302 hadis)"],["**Üstün yanı**","İsnad, hüküm, farklı tarikler ve râviler; hadis her sahâbînin müsnedinde bulunur","Muhtasar; metne ve musannif sahiplerine kısa yoldan ulaştırır"],["**Eksiği**","—","Hadis bazı sahâbe râvilerin müsnedlerinde bulunamaz"]]}]}],"ht":[{"s":0,"x":"Tahricin 5 yolu: sahâbî râvi · ilk kelime · az kullanılan kelime · konu · metin ve sened hâli."},{"s":1,"x":"Birinci yol: sahâbî biliniyorsa müsnedler, mu’cemler ve etrâf kitaplarından yararlanılır."},{"s":2,"x":"Müsned: hadisleri sahâbe isimlerine göre derleyen kitap. Kettânî er-Risâletü’l-müstatrafe’de 82 müsned sayar."},{"s":2,"x":"Müsnedlerde genel sıralama: Aşere-i Mübeşşere, Ehl-i Beyt, Ashab-ı Bedr, muhacir, ensar, kabileler, nâdir sahâbîler, hanım sahâbîler."},{"s":3,"x":"Humeydî (219): Mekkeli ilk müsned musannifi; Süfyan b. Uyeyne’nin talebesi, Buhârî’nin hocası, Şâfiî’nin ders arkadaşı. 1300 hadis, 180 sahâbî. Talha b. Ubeydullah’ın hadislerine ulaşamamıştır."},{"s":4,"x":"Ahmed b. Hanbel’in Müsned’i: alfabetik değil; fazilet, belde, kabileye göre. 904 sahâbî, oğlu Abdullah’ın ziyâdeleriyle 40.000 civârı rivâyet (10.000’i mükerrer). Şeddad b. el-Hâd ile biter."},{"s":4,"x":"el-Fethu’r-Rabbânî: Ahmed Abdurrahman el-Bennâ es-Sââtî; Müsned’i konularına göre tertib, 24 cilt, şerhi Bülûğu’l-emânî."},{"s":4,"x":"Şâhit varsa «وله شاهد عن» yazılır; şâhitlerde «نحوه / مثله» kullanılmaz."},{"s":5,"x":"Mu’cem: hadisler sahâbeye, hocalara veya beldelere göre, çoğu kere alfabetik sıralanır. Müsnedden farkı hocalara ve beldelere göre de toplamasıdır."},{"s":6,"x":"Mutlak “Mu’cem” = Taberânî’nin el-Mu’cemü’l-kebîr’i (60.000 hadis; Ebû Hüreyre rivâyetleri yok)."},{"s":6,"x":"el-Mu’cemü’l-evsat: hocalarına göre, 30.000 rivâyet (rumuz «طس»). el-Mu’cemü’s-sağîr: 1.000 hocasından birer hadis (rumuz «طص»)."},{"s":7,"x":"Etrâf kitapları: hadisin bir bölümünü zikredip tamamına yönlendirir; masâdır-ı ğayr-i asliyyedendir, kaynak olarak gösterilmez. Senedlerin nerede birleşip ayrıldığını ve kopukluğu gösterir."},{"s":7,"x":"Etrâf örnekleri: Dımeşkî ve Vâsıtî (Etrâfü’s-sahîhayn), İbn Asâkir (el-İşrâf), Mizzî (Tuhfetü’l-eşrâf, Kütüb-i Sitte), İbn Hacer (İthâfü’l-mehere, 10 kitap), Bûsırî (Etrâfü’l-mesânîdi’l-aşere, 10 müsned), Nablusî (Zehâiru’l-mevârîs, Kütüb-i Sitte + Muvatta’)."},{"s":7,"x":"Etrâfın 3 faydası: senedleri bir arada görmek (ğarib, aziz, meşhur), aslî kaynaktaki kitab ve bâbı bilmek, her sahâbînin rivâyet sayısını bilmek."},{"s":8,"x":"Tuhfetü’l-Eşrâf: Mizzî (742); Kütüb-i Sitte + Müslim’in Mukaddime’si, Ebû Dâvûd’un Merâsil’i, Tirmizî’nin el-İlelü’s-Sağîr’i ve Şemâil’i, Nesâî’nin Amelü’l-Yevm ve’l-Leyle’si. Sahâbîler alfabetik."},{"s":8,"x":"Tuhfe’de 12.302 hadis tekrarlarla 19.595’e çıkar; 905 sahâbînin müsned, 400 sahâbînin mürsel rivayetleri."},{"s":8,"x":"Tuhfe rumuzları: «خ» Buhârî, «خت» ta’lîk, «م» Müslim, «د» Ebû Dâvûd, «مد» Merâsil, «ت» Tirmizî, «تم» Şemâil, «س» Nesâî, «سي» Amelü’l-Yevm, «ق» İbn Mâce, «ع» altı kitap."},{"s":9,"x":"Zehâiru’l-Mevârîs: Nablusî (1143), Kütüb-i Sitte + Muvatta’ etrâfı; 7 bölüm, her biri alfabetik; tekrar etmez, 13302 hadis, Beyrut’ta 1 cilt."},{"s":9,"x":"Tuhfe isnad, hüküm, tarik ve râviler bakımından üstün; Zehâir muhtasar olması bakımından ön planda."}],"oz":{"t":"Birinci Yol: Sahâbî Râvi · Özet","intro":"Birinci bâb: tahric yolları. Birinci fasıl: sahâbeden hadisin râvisini bilme yoluyla tahric; müsnedler, mu’cemler ve etrâf kitapları.","s":[{"h":"Tahric Yolları","b":[{"k":"p","x":"Birinci bâb. Tahric yolları; 5 yol vardır:"},{"k":"ar","a":"الطَّرِيقَةُ الْأُولَى: التَّخْرِيجُ عَنْ طَرِيقِ مَعْرِفَةِ رَاوِي الْحَدِيثِ مِنَ الصَّحَابَةِ.","x":"1. Yol: Sahâbeden hadisin râvisini bilme yoluyla tahric yapmak."},{"k":"ar","a":"الطَّرِيقَةُ الثَّانِيَةُ: التَّخْرِيجُ عَنْ طَرِيقِ مَعْ
