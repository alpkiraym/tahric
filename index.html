رِفَةِ أَوَّلِ لَفْظٍ مِنْ مَتْنِ الْحَدِيثِ.","x":"2. Yol: Hadisin metninden ilk lafzı bilme yoluyla tahric yapmak."},{"k":"ar","a":"الطَّرِيقَةُ الثَّالِثَةُ: التَّخْرِيجُ عَنْ طَرِيقِ مَعْرِفَةِ كَلِمَةٍ يَقِلُّ دَوَرَانُهَا عَلَى الْأَلْسِنَةِ مِنْ أَيِّ جُزْءٍ مِنْ مَتْنِ الْحَدِيثِ.","x":"3. Yol: Hadisin metninin herhangi bir yerinden, dillerde az dolaşan bir kelimeyi bilme yoluyla tahric yapmak."},{"k":"ar","a":"الطَّرِيقَةُ الرَّابِعَةُ: التَّخْرِيجُ عَنْ طَرِيقِ مَعْرِفَةِ مَوْضُوعِ الْحَدِيثِ.","x":"4. Yol: Hadisin konusunu bilme yoluyla tahric yapmak."},{"k":"ar","a":"الطَّرِيقَةُ الْخَامِسَةُ: التَّخْرِيجُ عَنْ طَرِيقِ النَّظَرِ فِي حَالِ الْحَدِيثِ مَتْنًا وَسَنَدًا.","x":"5. Yol: Hadisin senet veya metninin (şüphelenmeden dolayı) incelenmesi yoluyla tahric yapmak."}]},{"h":"Birinci Fasıl: Birinci Yol","b":[{"k":"ar","a":"الطَّرِيقَةُ الْأُولَى: التَّخْرِيجُ عَنْ طَرِيقِ مَعْرِفَةِ رَاوِي الْحَدِيثِ مِنَ الصَّحَابَةِ.","x":"Sahâbeden hadisin râvisini bilme yoluyla tahric yapmak."},{"k":"p","x":"Tahric yapılacak hadiste sahâbe ismi zikredilmiş ise bu yola başvurulur. Sahâbe ismi yoksa bu kısım tahric için uygun değildir. Eğer sahâbe ismi mezkûr ise ya da herhangi bir yolla sahâbîsine ulaşılmış ise biz üç kısım musannefâttan yararlanabiliriz:"},{"k":"n","n":1,"x":"Mesânîd"},{"k":"n","n":2,"x":"Meâcim"},{"k":"n","n":3,"x":"Kütübü’l-Etrâf"}]},{"h":"Müsnedler","b":[{"k":"d","t":"Müsned","x":"Müelliflerin sahâbe ismine göre yazmış olduğu eserlerdir."},{"k":"h","x":"En meşhur örnekleri"},{"k":"n","n":1,"x":"**Humeydî h.219’un Müsned’i:** 11 ciltten oluşur, 1300 hadis içerir. Sahâbe ismine göre yazılmıştır lakin alfabetik değildir; ilk önce Hz. Ebûbekir, sonra Hulefâ-i Râşidîn, sonra Aşere-i Mübeşşere (Talha b. Ubeydullah hariç), sonra Ümmehâtü’l-Mü’minîn, sonra geri kalan sahâbeler, sonra Ensar’ın ricâlini, sonra sahâbeye isnad edilenleri özel bir sıralama olmaksızın zikreder."},{"k":"n","n":2,"x":"**İmam Ahmed b. Hanbel’in Müsned’i:** Ahmed b. Hanbel h.241’e ait olan bu eser yaklaşık 40 bin hadis içerir, sahâbe ismine göre tertib edilmiştir ve hadislerin konusu itibara alınmamıştır, harf sırası yoktur; efdaliyyet, beldeler ve kabileleri esas alarak bir tertip yapmıştır. Burada da sıra önce Hz. Ebûbekir ve Hulefâ-i Râşidîn, sonra Aşere-i Mübeşşere, sonra Abdurrahman b. Ebîbekir, sonra sahâbeden üçünün üç hadisi, sonra Ehl-i Beyt’e isnad edilenler, sonuna kadar zikreder; son olarak da Şeddâd b. el-Hâd (r.a.) ile bitirir."},{"k":"dikkat","x":"Humeydî ile Ahmed b. Hanbel’in müsnedleri arasındaki fark: Humeydî daha derli topludur. Şöyle ki bir sahâbeyi zikretti mi altında bütün hadislerini zikreder, lakin İbn Hanbel farklı yerlerde aynı sahâbeden hadis rivayet eder."}]},{"h":"Mu’cemler ve Etrâf Kitapları","b":[{"k":"d","t":"el-Meâcim","x":"Müelliflerin sahâbe isimlerini alfabetik olarak yazdıkları eserdir."},{"k":"p","x":"Mu’cemlerin müsnedlerden farkı alfabetik olmalarıdır."},{"k":"p","x":"**Taberânî:** 1. el-Mu’cemü’l-Kebîr (mutlak olarak mu’cem denilince bu kitap anlaşılır), 2. el-Mu’cemü’l-Evsat, 3. el-Mu’cemü’s-Sağîr."},{"k":"d","t":"Kütübü’l-Etrâf","x":"Hadisin önemli bir parçası esas alınarak yazılan eserlerdir. Bu çok kere hadisin başı olur ama orta veya sonundan bir parça da olabilir."},{"k":"p","x":"Etrâf kitapları kaynak kitap değildir. Sahâbe ismine göre ve alfabetik olarak tertip edilmiştir."},{"k":"p","x":"Hadisin bilinen bir kısmı verilir, daha sonra bu hadisin geçtiği kitaplar zikredilir."},{"k":"ar","a":"عَنْ عَائِشَةَ: كُلُّكُمْ رَاعٍ... خ، م، د","x":"Mesela bu şekilde hadisin râvisini ve bir kısmını ve de hangi kitaplarda geçtiğini verir."},{"k":"p","x":"Sonra da «رواه البخاري: ... به» ve «رواه مسلم: ... نحوه» gibi lafızlarla hadisin rivayetini açıklar."},{"k":"li","x":"“Tuhfetü’l-Eşrâf” («تحفة الأشراف»): Mizzî, Kütüb-i Sitte’nin hadislerini esas alır."},{"k":"li","x":"“Zehâiru’l-Mevârîs” («ذخائر المواريث»): Abdülğanî Nâbulsî, Kütüb-i Sitte ve Muvatta’nın hadislerini esas alır."},{"k":"not","x":"(Kırmızı kalemle kenar notu) Vâsıtî ve Dımeşkî = «أطراف الصحيحين»."}]}]}},{"t":"İkinci Yol: Metnin İlk Lafzı","intro":"Hadis metninin ilk lafzı biliniyorsa başvurulan eserler: halk dilinde meşhur hadis kitapları, rivâyetleri alfabetik düzenlenmiş eserler (el-Câmiu’s-sağîr ve rumuzları) ve fihrist kitapları.","s":[{"h":"Halk Dilinde Meşhur Hadis Kitapları","b":[{"k":"p","x":"Hadis metninin ilk lafzı esas alınarak tertib edilmiş eserlerden yararlanma. Bu yolda başvurulan ilk grup, halk dilinde yaygın olarak kullanılan rivâyetlerin derlendiği eserlerdir (halk dilinde meşhur hadis kitapları)."},{"k":"p","x":"Genelde alfabetik tarzda hazırlanmış olup, insanların dilinde yaygın olan sözler hakkında bilgi veren eserlerdir."},{"k":"p","x":"İnsanların dilinde yaygın olan sözlerden kasıt; Hz. Peygamber’e nisbet ederek aralarında yaygınca naklettikleri sözlerdir. Bunların bir kısmı sahih, bir kısmı hasen olmakla birlikte pek çoğu zayıf, mevzu’ veya senedsiz olan rivâyetlerdir. Çoğunluğu mevzu’ olan bu tür rivâyetlerin yayılması, toplum tarafından benimsenmesi, bunların Hz. Peygamber’in sözü olduğu şeklinde yanlış bir inanca yol açar ki bu da insanların dinlerini ifsâd eder. Bundan dolayı, mütehassıs hadis âlimleri insanların dillerinde hadis olarak dolaşan sözler hakkında eserler te’lif ettiler. Bu eserlerde sahih hadisleri, zayıf ya da uydurma olanlarından ayırdılar. Bunları kimlerin rivâyet ettiğini açıkladılar. Şayet hadisin aslı, senedi varsa; eser sahiplerinin kitaplarından bu hadislerin tahricini yaptılar. Senedsiz, uydurma bir söz ise; insanlara bunlarla amel etmemeleri için ikâzda bulundular."},{"k":"dikkat","x":"Halk dilinde meşhur olan sözler denildiği zaman buradaki şöhret (meşhurluk), ıstılâhî anlamdaki ‘her tabakada en az üç veya daha fazla râvî tarafından rivâyet edilen, mütevâtir derecesine ulaşamayan hadis’ mânâsında değildir. Kasdedilen mânâ; lügavî mânâdaki şöhrettir. Yani, bu sözlerin insanların dillerinde yayılması ve bu sözlerin insanların birçoğunca bilinmesidir."},{"k":"p","x":"Bu sahada kaleme alınan eserlerin pek çoğu, metnin ilk kelimesine göre alfabetik olarak tertib edilmişlerdir."},{"k":"h","x":"Bazı örnekler"},{"k":"n","n":1,"x":"et-Tezkira fi’l-ehâdîsi’l-müştehira; Bedrüddin Muhammed b. Abdullah ez-Zerkeşî (ö.794/1392). Eserde 234 rivâyet vardır."},{"k":"n","n":2,"x":"ed-Dürerü’l-münteşira fi’l-ehâdîsi’l-müştehira; Celâlüddin Abdurrahman es-Süyûtî (ö.911/1505). Eserde 299 rivâyet vardır."},{"k":"n","n":3,"x":"el-Leâli’l-mensûra fi’l-ehâdîsi’l-meşhûra; İbn Hacer el-Askalânî (ö.852/1448)."},{"k":"n","n":4,"x":"el-Makâsıdü’l-hasene fî beyâni kesîrin mine’l-ehâdîsi’l-müştehira ale’l-elsine; Muhammed b. Abdurrahman es-Sehâvî (ö.902/1496). Eserde 1356 rivâyet vardır. Eser tek cilt olup rivâyetler alfabetik tarzda düzenlenmiştir."},{"k":"n","n":5,"x":"Temyîzü’t-tayyib mine’l-habîs fî mâ yedûru alâ elsineti’n-nâs mine’l-hadîs; Abdurrahman b. Ali b. ed-Deyba’ eş-Şeybânî (ö.944/1537). Bu eser el-Makâsıdü’l-Hasene’nin özetidir."},{"k":"n","n":6,"x":"el-Bedru’l-münîr fî ğarîbi ehâdîsi’l-beşîri’n-nezîr; Abdülvehhab b. Ahmed eş-Şa’rânî (ö.973/1565)."},{"k":"n","n":7,"x":"Teshîlü’s-sebîl ilâ keşfi’l-iltibâs ammâ dâra mine’l-ehâdîsi beyne’n-nâs; Muhammed b. Ahmed el-Halîlî (ö.1057/1647). Bu eser daha çok önceki dönemlerde yapılan çalışmalara yönelik bir eserdir."},{"k":"n","n":8,"x":"İtkânu mâ yahsünu mine’l-ehâdîsi’d-dâire ale’l-elsine; Necmüddin Muhammed b. Muhammed el-Ğazzî (ö.985/1577). el-Ğazzî bu eserinde kendi ilâveleriyle birlikte; Zerkeşî, Süyûtî ve Sehâvî’nin kitaplarını da bir araya getirmiştir."},{"k":"n","n":9,"x":"Keşfü’l-hafâ ve müzîlü’l-ilbâs ammâ iştehera mine’l-ehâdîsi alâ elsineti’n-nâs; İsmail b. Muhammed el-Aclûnî (ö.1162/1749). 2 cilt olan bu eserde 3280 rivâyet vardır. Alfabetik olmakla birlikte eserin sonunda konu fihristi de bulunmaktadır."},{"k":"n","n":10,"x":"Esne’l-metâlib fî ehâdîsi muhtelifeti’l-merâtib; Muhammed b. Derviş eş-Şehîr bi’l-Hût el-Beyrûtî (ö.1276/1860). Rivâyetleri bir araya getirip derleyen ise; oğlu Ebû Zeyd Abdurrahman’dır."},{"k":"n","n":11,"x":"eş-Şezera fi’l-ehâdîsi’l-müştehira; İbn Tûlûn (ö.953/1546). Eser 2 cilt olup fihristi 2. cilttedir."},{"k":"n","n":12,"x":"en-Nevâfihü’l-atira; İbn Cârullah el-Yemenî (ö.1181/1767). en-Nevâfih’in özelliği; rivâyetin başka hangi eserlerde geçtiğini dipnot olarak vermesidir."},{"k":"n","n":13,"x":"el-Muhtasar ale’l-Makâsıd; ez-Zürkânî (ö.1138/1726)."},{"k":"tbl","r":[["Eser","Müellif","Not"],["**et-Tezkira fi’l-ehâdîsi’l-müştehira**","Zerkeşî (794)","234 rivâyet"],["**ed-Dürerü’l-münteşira**","Süyûtî (911)","299 rivâyet"],["**el-Leâli’l-mensûra**","İbn Hacer (852)","—"],["**el-Makâsıdü’l-hasene**","Sehâvî (902)","1356 rivâyet, tek cilt, alfabetik"],["**Temyîzü’t-tayyib**","İbnü’d-Deyba’ eş-Şeybânî (944)","el-Makâsıd’ın özeti"],["**el-Bedru’l-münîr fî ğarîbi ehâdîsi’l-beşîri’n-nezîr**","Şa’rânî (973)","—"],["**Teshîlü’s-sebîl**","el-Halîlî (1057)","Önceki çalışmalara yönelik"],["**İtkânu mâ yahsünu**","Necmüddin el-Ğazzî (985)","Zerkeşî, Süyûtî ve Sehâvî’yi birleştirir"],["**Keşfü’l-hafâ**","Aclûnî (1162)","2 cilt, 3280 rivâyet, sonunda konu fihristi"],["**Esne’l-metâlib**","el-Hût el-Beyrûtî (1276)","Derleyen oğlu Ebû Zeyd Abdurrahman"],["**eş-Şezera**","İbn Tûlûn (953)","2 cilt"],["**en-Nevâfihü’l-atira**","İbn Cârullah el-Yemenî (1181)","Diğer kaynakları dipnotta verir"],["**el-Muhtasar ale’l-Makâsıd**","Zürkânî (1138)","—"]]}]},{"h":"el-Makâsıdü’l-Hasene","b":[{"k":"p","x":"el-Makâsıdü’l-hasene fî beyâni kesîrin mine’l-ehâdîsi’l-müştehira ale’l-elsine:"},{"k":"p","x":"Şemseddin es-Sehâvî’nin (ö.902/1497) halk arasında meşhur olan hadislere dair eseri. Sahih, zayıf, hatta mevzû olmakla beraber halk arasında yayılan hadislerin bir araya getirilerek değerlendirildiği en önemli kaynaklardan biridir. Hadislerin alfabetik olarak düzenlendiği kitapta son hadis 1356 numarayı taşımakla birlikte bunlardan 191’i atıflardan ibarettir, on dört haber üzerinde ise herhangi bir değerlendirme yapılmamıştır."},{"k":"p","x":"Sehâvî kitabındaki hadisleri harf sırasına göre tertip etmiş, böylece aranan hadisin bulunmasını kolaylaştırmıştır. Müellif kaydettiği rivayetin bir senedine veya aslına ulaşabilmişse nerelerde geçtiğini göstermiş, sıhhat derecesini açıklamış, âlimlerin bu hadis hakkında söylediklerini yeter derecede zikretmiştir. Hadisin bir aslı yoksa ve hiçbir kitapta da bulamamışsa, bunu beyan etmiş ve “aslı yok” demiştir. Eğer hadisi bulamamış, ancak aslı yok demeye de cesaret edememişse, “bilmiyorum” demiştir."},{"k":"p","x":"Müellifin talebesi Abdurrahman b. Ali bu kitabı “Temyîzü’t-Tayyib” adıyla kısaltmıştır. el-Menûfî (936/1529) el-Vesâilü’s-Seniyye adlı eserinde özetlemiştir."},{"k":"tbl","r":[["Sehâvî’nin ifadesi","Ne zaman kullanır?"],["**“Aslı yok”**","Hadisin bir aslı yoksa ve hiçbir kitapta bulamamışsa"],["**“Bilmiyorum”**","Hadisi bulamamış, ancak aslı yok demeye de cesaret edememişse"]]}]},{"h":"Temyîzü’t-Tayyib","b":[{"k":"p","x":"Temyîzü’t-tayyib mine’l-habîs fî mâ yedûru alâ elsineti’n-nâs mine’l-hadîs; Abdurrahman b. Ali b. ed-Deyba’ eş-Şeybânî (ö.944/1537)."},{"k":"p","x":"Bu eser el-Makâsıdü’l-Hasene’nin özetidir. Bu muhtasar çalışmasında müellif her hadisin yer aldığı kaynağı ve sıhhat derecesini belirtmiş ve hadisin ravileri niçin zayıf veya metruk olduğunu açıklama hususunda fazla tafsilata girmemiştir. Ana kitapta yer alan hadislerde bir eksiltmeye gitmediği gibi, biraz ilavelerde de bulunmuş ve ilavelerini başta “derim ki” sonunda da “Allah bilir” ifadeleriyle ayırmıştır. Tertip olarak ana kitap düzenine uymuştur. Ancak Sehâvî’nin kitabının sonunda bulunan ve rivayetlerin konularına göre tekrar sıralandığı bölüm bu esere alınmamıştır."}]},{"h":"Keşfü’l-Hafâ","b":[{"k":"p","x":"Keşfü’l-hafâ ve müzîlü’l-ilbâs ammâ iştehera mine’l-ehâdîsi alâ elsineti’n-nâs; İsmail b. Muhammed el-Aclûnî (ö.1162/1749)."},{"k":"p","x":"2 cilt olan bu eserde 3280 rivâyet vardır. Alfabetik olmakla birlikte eserin sonunda konu fihristi de bulunmaktadır. Müellif eserini bu sahada ulaşabildiği eserleri birleştirmek ve özetlemek maksadıyla yazdığını ifade etmektedir. Eserini oluştururken “Makâsıd”daki hadislerle yetinmemiş, bu konuda daha önce yazılan İbn Hacer’in el-Leâli’l-Mensûra ve Süyûtî’nin ed-Dürerü’l-Münteşira’sı gibi diğer eserlerden de hadisleri eklemiştir. Genel olarak hadisin derecesinin ne olduğunu belirtmiş ve âlimlerin bu hadis hakkındaki görüşlerini kaydetmiştir. Eğer hadisin aslı yoksa bunu da belirtmiştir. Kaydettiği rivayet hadis değilse bunu “hadis değildir, sahabe sözüdür, hikmetli sözdür, âlimlerden birinin sözüdür” vb. ifadelerle açıklamıştır."},{"k":"p","x":"Eserin 23 sayfalık hatime kısmında meşhur imamlar ve âlimler hakkındaki efsanevi rivayet ve asılsız isnatlara, bazı meşhur âlimlerin yanlış anlaşılan ve yanlış yorumlanan görüşlerine ve birçok yararlı konuya değinmektedir. Bu kısım bir nevi kitabın yazılış gayesini özetlemektedir. Kitap, basılan nüshasında rakamlanmış olarak 3281 hadis ihtiva etmektedir."}]},{"h":"Esne’l-Metâlib","b":[{"k":"p","x":"Esne’l-metâlib fî ehâdîsi muhtelifeti’l-merâtib; Muhammed b. Derviş eş-Şehîr bi’l-Hût el-Beyrûtî (ö.1276/1860)."},{"k":"p","x":"Müellif bu eserini Sehâvî’nin mezkûr kitabını ihtisar eden Abdurrahman ed-Deyba’ın eserinden seçerek ve ilavelerde bulunarak oluşturmuştur. Müellifin oğlu Abdurrahman babasının ölümünden sonra eserine birçok ilavede bulunarak eseri alfabetik olarak tertiplemiştir. Hacminin küçüklüğüne rağmen eser çok hadis ihtiva etmektedir. Hadisler hakkında genel olarak çok kısa bilgi verilmiştir. Bazen de söz uzatılmıştır. Eser kısa yoldan neticeye ulaşmak isteyenler için yararlıdır."},{"k":"steps","x":["**el-Makâsıdü’l-hasene:** Sehâvî (902)","**Temyîzü’t-tayyib:** İbnü’d-Deyba’ (944), özeti","**Esne’l-metâlib:** el-Hût el-Beyrûtî (1276), Temyîz’den seçme + ilaveler; oğlu Abdurrahman alfabetik tertipledi"]}]},{"h":"Rivâyetleri Alfabetik Düzenlenmiş Eserler","b":[{"k":"p","x":"Bu gruptaki kitapların mütekaddimûn döneminden ziyâde müteahhirûn döneminde kaleme alındığını görüyoruz. Genel itibarıyla bu grupta yer alan kitapların en belirgin özellikleri şunlardır:"},{"k":"n","n":1,"x":"Rivâyetler çeşitli aslî hadis kitaplarından alınmıştır."},{"k":"n","n":2,"x":"Senedleri hazfedilmiştir."},{"k":"n","n":3,"x":"Araştırmacılara kolaylık olması için rivâyetler alfabetik tarzda düzenlenmiştir."},{"k":"n","n":4,"x":"Genellikle hadislerin hükümlerine yer verilmiştir."},{"k":"h","x":"Bazı örnekler"},{"k":"n","n":1,"x":"Süyûtî’nin (ö.911/1505) el-Câmiu’s-sağîr min hadîsi’l-beşîri’n-nezîr’i."},{"k":"n","n":2,"x":"Süyûtî’nin ez-Ziyâde alâ Câmii’s-sağîr’i."},{"k":"n","n":3,"x":"Süyûtî’nin el-Câmiu’l-kebîr’i. 20141 hadis ihtiva eder."},{"k":"n","n":4,"x":"Yusuf en-Nebhânî’nin el-Fethu’l-Kebîr fî Dammi’z-ziyâdeti ile’l-Câmii’s-Sağîr’i."}]},{"h":"el-Câmiu’s-Sağîr","b":[{"k":"p","x":"Süyûtî’nin (ö.911/1505) el-Câmiu’s-sağîr min hadîsi’l-beşîri’n-nezîr’i:"},{"k":"p","x":"Bu sahada yazılmış en önemli eserlerden birisidir. Süyûtî’nin bu eserinin matbu’ olan nüshasında 10.031 rivâyet bulunmaktadır. Bu rivâyetleri yine kendisine ait olan bir tür derleme niteliğindeki Cem’u’l-cevâmi’ isimli eserinden seçmiştir. Araştırıcıya kolaylık olması için rivâyetleri alfabetik tarzda düzenlemiş, veciz rivâyetleri tercih etmiştir. Ahkâm ile ilgili rivâyetlere çok az yer vermiştir. Eserinde kendi görüşüne göre, uydurmacı ve yalancı damgası vurulmuş râvîlerin rivâyetlerine yer vermemiş, bilakis sahih, hasen ve zayıf rivâyetleri zikretmiştir."},{"k":"h","x":"Eserinde izlediği yöntem"},{"k":"p","x":"Hadisi rivâyet eden sahâbî de dâhil olmak üzere ilgili rivâyeti senedsiz zikreder. Rivâyetin sonunda hadisi kimin tahric ettiğini (eserinde zikrettiğini) rumuzlarla, hangi sahâbî tarîkıyla geldiğini sahâbî ismi zikrederek belirtir. Daha sonra hadisin sıhhat derecesine rumuzlarla işaret eder."},{"k":"h","x":"Sıhhat derecesi rumuzları"},{"k":"p","x":"Hadisin sıhhat derecesine işaret ettiği rumuzlar üç tanedir:"},{"k":"tbl","r":[["Rumuz","Anlamı"],["«صح»","Sahih"],["«ح»","Hasen"],["«ض»","Zayıf"]]},{"k":"h","x":"Musannif rumuzları"},{"k":"p","x":"Hadislerine yer verdiği musanniflerin rumuzları 30 tanedir:"},{"k":"tbl","r":[["No","Musannif / eser","Rumuz"],["1","Buhârî","«خ»"],["2","Müslim","«م»"],["3","Müttefekun aleyh","«ق»"],["4","Ebû Dâvûd","«د»"],["5","Tirmizî","«ت»"],["6","Nesâî","«ن»"],["7","İbn Mâce","«ه»"],["8","Dört Sünen sahibi","4"],["9","İbn Mâce hariç diğer üç sünen","3"],["10","Ahmed b. Hanbel’in Müsned’i","«حم»"],["11","Ahmed b. Hanbel’in oğlu [[Abdullah]]’ın Zevâid’i","«عم»"],["12","Hâkim’in Müstedrek’i","«ك»"],["13","Buhârî’nin Edeb’i","«خد»"],["14","Buhârî’nin Tarih’i","«تخ»"],["15","İbn Hibbân’ın Sahih’i","«حب»"],["16","Taberânî’nin Kebîr’i","«طب»"],["17","Taberânî’nin Evsat’ı","«طس»"],["18","Taberânî’nin Sağîr’i","«طص»"],["19","Said b. Mansur’un Sünen’i","«ص»"],["20","İbn Ebî Şeybe","«ش»"],["21","Abdürrezzak’ın Câmi’i","«عب»"],["22","Ebû Ya’lâ’nın Müsned’i","«ع»"],["23","Dârekutnî’nin Sünen’i","«قط»"],["24","Deylemî’nin Müsnedü’l-firdevs’i","«فر»"],["25","Ebû Nuaym’ın Hilye’si","«حل»"],["26","Beyhakî’nin Şuabü’l-îmân’ı","«هب»"],["27","Beyhakî’nin Sünen’i","«هق»"],["28","İbn Adiyy’in Kâmil’i","«عد»"],["29","Ukaylî’nin Zuafâ’sı","«عق»"],["30","Hatîb el-Bağdâdî’nin Tarih’i","«خط»"]]},{"k":"dikkat","x":"Süyûtî hadisin sıhhati konusunda vermiş olduğu hükümlerde bazen mütesâhil davranmıştır. Bundan dolayı Münâvî (ö.1032/1623), Câmiu’s-sağîr’i şerhettiği Feyzü’l-kadîr isimli eserinde bu tür rivâyetleri değerlendirmeye almış, hükümleri konusunda kendi kanaatini de belirterek Süyûtî’ye muhâlefet etmiştir. Bundan dolayı Süyûtî’nin ilgili rivâyet için vermiş olduğu hüküm konusunda Münâvî’nin görüşüne mürâcaat etmek isâbetli olacaktır."}]},{"h":"Fihrist Kitapları","b":[{"k":"p","x":"Bazı âlimler belirli kitaplara alfabetik sıraya göre kullanımı kolaylaştırmak ve vakitten istifade edip hızlıca hadise ulaşılmak maksadıyla fihrist kitapları yazmışlardır."},{"k":"h","x":"Fihrist kitapları"},{"k":"n","n":1,"x":"Miftâhu’s-Sahîhayn; Tokâdî."},{"k":"n","n":2,"x":"Miftâhu’t-Tertîb li-ehâdîsi Târîhi’l-Hatîb; Seyyid Ahmed el-Gumârî."},{"k":"n","n":3,"x":"el-Buğye fî tertîbi ehâdîsi’l-Hilye; Seyyid Abdülaziz el-Gumârî."},{"k":"n","n":4,"x":"Fihrisün li-tertîbi ehâdîsi “Sahîhi Müslim”; Muhammed Fuad Abdülbâkî."},{"k":"n","n":5,"x":"Miftâhun li-ehâdîsi Muvatta’ Mâlik; Muhammed Fuad Abdülbâkî."},{"k":"n","n":6,"x":"Fihrisün li-tertîbi ehâdîsi “Süneni İbn Mâce”; Muhammed Fuad Abdülbâkî."},{"k":"tbl","r":[["Fihrist","Müellif","Hangi eserin fihristi?"],["**Miftâhu’s-Sahîhayn**","Tokâdî","Buhârî ve Müslim"],["**Miftâhu’t-Tertîb**","Seyyid Ahmed el-Gumârî","Hatîb el-Bağdâdî’nin Târîh’i"],["**el-Buğye**","Seyyid Abdülaziz el-Gumârî","Ebû Nuaym’ın Hilye’si"],["**Fihrisün li-tertîbi ehâdîsi Sahîhi Müslim**","Muhammed Fuad Abdülbâkî","Sahîh-i Müslim"],["**Miftâhun li-ehâdîsi Muvatta’**","Muhammed Fuad Abdülbâkî","Muvatta’"],["**Fihrisün li-tertîbi ehâdîsi Süneni İbn Mâce**","Muhammed Fuad Abdülbâkî","Sünen-i İbn Mâce"]]}]},{"h":"Miftâhu’s-Sahîhayn","b":[{"k":"li","x":"Muhammed Şerif b. Mustafa Tokâdî hicrî 1312 senesinde telifi tamamlamıştır."},{"k":"li","x":"Buhârî ve Müslim’deki kavlî hadislerin etrâfını (başından bir kısmını) toplamış. Alfabetik bir şekilde tertib etmiştir. Sonra her hadisin karşısına kitab ismi, bab no ve rakamını yazmıştır. Aynı şekilde en meşhur şerhlerinin de sayfa ve cilt numaralarını vererek oradaki yerlerini de belirtmiştir."},{"k":"li","x":"Buhârî’de kitap ismini ve bab no’sunu, cilt ve sayfa numarasını verdikten sonra Aynî, Askalânî ve Kastallânî’nin şerhlerindeki cilt ve sayfa numaralarını da vermiştir."},{"k":"li","x":"Müslim’deki hadisin kitap ismini ve bab no’sunu, cilt ve sayfa numarasını verdikten sonra Nevevî şerhindeki cilt ve sayfa numarasını da vermiştir."},{"k":"li","x":"İstifade yolu: Kullanımı alfabetik düzenlendiği için kolaydır. Sadece hadisin ilk kelimesini bilmen gereklidir. Hadisin başından bir kısmını zikretmekle yetinmiştir. Şerhlerden de bu hadise ulaşmak çok kolaydır. Çünkü cilt ve sayfa numarası verilmiştir. Ancak bu cilt ve sayfa numaraları belli baskılara göre verildiğinden elinin altında şerh kitapların o baskısı varsa kolaydır. Eğer o baskı sende yoksa ulaşman diğer baskıya göre kolay olmaz. O zaman şöyle ulaşılır; hadisin geçtiği kitap ve bab numarasına bakıp ona göre elindeki baskıdan bulursun."},{"k":"li","x":"Sahâbe isminin fihristi: Müellif, Sahîh-i Buhârî’de rivayeti yer alan sahâbeyi kitabın başında alfabetik zikretmiş ve rivayet ettiği hadis sayısını karşısına yazmıştır. Müslim’deki sahâbe raviler için aynı şeyi yapmamıştır."},{"k":"dikkat","x":"Değerlendirme: İçerisindeki en büyük eksiklik fiilî hadislerin fihristinin olmayışıdır. Araştırmacı fiilî hadisleri nasıl bulacak? Yine de kavlî hadisler için bir fihrist hazırlanması mümkündür. Buğye kitabının sahibinin yaptığı gibi her hadiste sahâbînin, hadisin geçtiği kitabın ismini zikreder ve hadisin yerini söyler."}]},{"h":"Miftâhu’t-Tertîb ve el-Buğye","b":[{"k":"h","x":"Miftâhu’t-Tertîb li-ehâdîsi Târîhi’l-Hatîb"},{"k":"li","x":"Seyyid Ahmed el-Gumârî yazmıştır."},{"k":"li","x":"Çok faydalı ve önemli bir kitaptır. Kitabın aslı 14 cilt yaklaşık olarak 7 bin sayfa olmasına rağmen bu fihristin oradaki tüm hadisleri içerip 90 sayfadan fazla olmaması önemini ortaya koymaktadır."},{"k":"p","x":"Bu fihrist kitap iki açıdan önemlidir:"},{"k":"n","n":1,"x":"Meşhur sünnet kaynaklarında zikredilmeyen birçok rivayeti Hatîb kitabında rivayet etmiştir."},{"k":"n","n":2,"x":"Hatîb’in kitabındaki hadislerin yerini tespit edebilmek için bu fihristten başka bir yol yoktur. Çünkü Hatîb bu hadislerin tertibinde herhangi bir metod gözetmemiştir. O ricalleri zikretmiş ve yeri geldikçe hadisleri vermiştir. Kitabın amacı tarihi olayları anlatmak değil ricaller hakkında bilgi vermektir."},{"k":"li","x":"Fihristteki metod: Hadisleri kavlî ve fiilî olmak üzere iki kısma ayırmıştır. Kavlî hadisleri alfabetik olarak sıralamış, hadisin baş kısmını zikretmiş, karşısına da cilt ve sayfa numarasını belirtmiştir. Fiilî hadislere gelince onları da alfabetik olarak sahâbe ismine göre düzenlemiştir. Bayan sahâbîleri de erkeklerle iç içe zikretmiş, onlara özel bir bölüm ayırmamıştır. Sahâbenin isminin karşısına hadisin alakalı olduğu konunun ismini zikretmiş ve yanında cilt ve sayfa numarasını belirtmiştir. Eğer Hatîb bir hadisi birden fazla yerde farklı lafızlarla zikretmişse onun getirdiği lafızlarla müellif de alfabetik olarak yine zikretmiştir. Bu şekilde bir araştırmacı bir hadisin bütün turuklarını toplayabilir ve kaç farklı sahâbeden rivayet edildiğini görebilir."},{"k":"li","x":"Müellifin mukaddimesinden: Burası çok önemli değil; müellif tekrar eden hadisleri sadece bir defa zikretmediğini, kaç defa zikredilmişse ve meşhur hali nasılsa o şekilde zikrettiğini söylüyor."},{"k":"li","x":"Bu fihristte bulunan hadis sayısı yaklaşık 4500 civarındadır. Az görülebilecek bir sayı değildir."},{"k":"h","x":"el-Buğye fî tertîbi ehâdîsi’l-Hilye"},{"k":"li","x":"Müellifi Seyyid Abdülaziz el-Gumârî’dir."},{"k":"li","x":"Bu kitap azıcık bir şey dışında az önce zikri geçen kitaba ehemmiyeti, çok faydalı oluşu, tertibi ve tebvibi açısından tamamen benzemektedir. Bu kitapta müellif Ebû Nuaym el-İsfahânî’nin (ö.430) Hilyetü’l-evliyâ ve Tabakâtü’l-Asfiyâ kitabındaki hadislerin fihristini yapmıştır. Kitap 400 sayfalık on ciltten oluşmaktadır. Hadisleri kavlî ve fiilî olmak üzere ikiye ayırmıştır. Kavlî hadisleri alfabetik olarak sıralamış, hadisin baş kısmını zikretmiş, karşısına da cilt ve sayfa numarasını belirtmiştir. Bayan sahâbîleri de erkeklerle iç içe zikretmiş, onlara özel bir bölüm ayırmamıştır. Ancak Miftâhu’t-Tertîb’ten farklı olarak müellif künyeleri ayrı olarak zikretmiştir."},{"k":"li","x":"Yaklaşık 5000 hadis bulunmaktadır. Araştırmacı için ulaşımı kolay olacak bir şekilde el-Gumârî fihristini hazırlamıştır."},{"k":"tbl","r":[["","Miftâhu’t-Tertîb","el-Buğye"],["**Müellif**","Seyyid Ahmed el-Gumârî","Seyyid Abdülaziz el-Gumârî"],["**Fihristi yapılan eser**","Hatîb’in Târîh’i (14 cilt, ~7 bin sayfa)","Ebû Nuaym’ın Hilyetü’l-evliyâ’sı (400 sayfalık 10 cilt)"],["**Metod**","Kavlî hadisler alfabetik; fiilî hadisler sahâbe ismine göre alfabetik","Aynı metod; farkı künyeleri ayrı zikretmesi"],["**Hadis sayısı**","~4500","~5000"]]}]},{"h":"Muhammed Fuad Abdülbâkî’nin Fihristleri","b":[{"k":"h","x":"Fihrisün li-tertîbi ehâdîsi “Sahîhi Müslim” el-Kavliyye"},{"k":"li","x":"Muhammed Fuad Abdülbâkî tarafından telif edilmiştir."},{"k":"li","x":"Müellif kavlî hadisleri ele alıp onun ilk kelimesine göre alfabetik olarak fihristi hazırlamıştır. Hadisin geçtiği sayfa numarasını yazmıştır. 88 sayfalık bir fihristtir."},{"k":"h","x":"Miftâhun li-ehâdîsi Muvatta’ Mâlik"},{"k":"li","x":"Muhammed Fuad Abdülbâkî tarafından telif edilmiştir."},{"k":"li","x":"Bu fihrist Muvatta’nın sonunda bulunmakla birlikte tertibi bir önceki kitabın tertibi gibidir."},{"k":"li","x":"Muvatta’da bulunan hadis sayısı 1812’dir. Bu kitapta bulunan fihristte kavlî hadislerin sayısı 867’dir."},{"k":"h","x":"Fihrisün li-tertîbi ehâdîsi “Süneni İbn Mâce”"},{"k":"li","x":"Muhammed Fuad Abdülbâkî tarafından telif edilmiştir."},{"k":"li","x":"Bu da bir önceki kitap gibi hazırlanmıştır. Bu da Sünen-i İbn Mâce’nin sonunda bulunmaktadır. Kısa sürede hadise ulaştırmaktadır."},{"k":"li","x":"Kitaptaki hadis sayısı 4341 iken fihristte yer alan kavlî hadis sayısı 3100’dür."},{"k":"tbl","r":[["Fihrist","Eserdeki hadis","Fihristteki kavlî hadis"],["**Sahîh-i Müslim**","—","88 sayfalık fihrist"],["**Muvatta’**","1812","867"],["**Sünen-i İbn Mâce**","4341","3100"]]}]}],"ht":[{"s":0,"x":"Halk dilinde meşhur sözler: Hz. Peygamber’e nisbet edilerek yaygınca nakledilir; bir kısmı sahih/hasen, pek çoğu zayıf, mevzu’ veya senedsiz. Buradaki şöhret ıstılâhî değil lügavîdir."},{"s":0,"x":"Bu eserlerin çoğu metnin ilk kelimesine göre alfabetiktir."},{"s":1,"x":"el-Makâsıdü’l-hasene: Sehâvî (902); alfabetik, son hadis 1356 (191’i atıf, 14’ü değerlendirmesiz). Bulamazsa “aslı yok”, emin değilse “bilmiyorum” der."},{"s":1,"x":"el-Makâsıd’ın özetleri: talebesi Abdurrahman b. Ali’nin Temyîzü’t-Tayyib’i ve el-Menûfî’nin el-Vesâilü’s-Seniyye’si."},{"s":2,"x":"Temyîzü’t-Tayyib: İbnü’d-Deyba’ (944), el-Makâsıd’ın özeti; eksiltme yapmaz, ilavelerini “derim ki … Allah bilir” ile ayırır; konulara göre sıralanan son bölüm alınmamıştır."},{"s":3,"x":"Keşfü’l-hafâ: Aclûnî (1162), 2 cilt, 3280 rivâyet (basılı nüshada 3281); alfabetik, sonunda konu fihristi. el-Makâsıd’a İbn Hacer’in el-Leâli’si ve Süyûtî’nin ed-Dürer’inden hadisler ekler. 23 sayfalık hatime."},{"s":4,"x":"Esne’l-metâlib: el-Hût el-Beyrûtî (1276); Temyîzü’t-Tayyib’den seçme ve ilavelerle; oğlu Abdurrahman ölümünden sonra alfabetik tertipledi. Kısa yoldan neticeye ulaşmak isteyenler için."},{"s":5,"x":"Alfabetik eserler müteahhirûn dönemindedir: aslî kitaplardan alınır, senedleri hazfedilir, alfabetik düzenlenir, genellikle hükümleri verilir."},{"s":5,"x":"Süyûtî: el-Câmiu’s-sağîr, ez-Ziyâde, el-Câmiu’l-kebîr (20141 hadis). Nebhânî: el-Fethu’l-Kebîr."},{"s":6,"x":"el-Câmiu’s-sağîr: Süyûtî; 10.031 rivâyet, Cem’u’l-cevâmi’den seçme; alfabetik, veciz rivâyetler, ahkâm az; uydurmacı ve yalancı râvîlerin rivâyetleri yok."},{"s":6,"x":"Sıhhat rumuzları: «صح» sahih, «ح» hasen, «ض» zayıf. Musannif rumuzları 30 tane."},{"s":6,"x":"Câmiu’s-sağîr rumuzları: «ق» müttefekun aleyh, «ه» İbn Mâce, «حم» Müsned, «عم» Zevâid, «ك» Müstedrek, «طب» Kebîr, «ش» İbn Ebî Şeybe, «عب» Abdürrezzak, «حل» Hilye, «هب» Şuab, «هق» Sünen-i Beyhakî, «خط» Tarih-i Bağdâd."},{"s":6,"x":"Süyûtî hükümlerde mütesâhildir; Münâvî’nin şerhi Feyzü’l-kadîr’e mürâcaat edilir."},{"s":7,"x":"Fihrist kitapları belirli kitaplara alfabetik sıraya göre yazılır. Muhammed Fuad Abdülbâkî: Müslim, Muvatta’ ve İbn Mâce fihristleri."},{"s":8,"x":"Miftâhu’s-Sahîhayn: Tokâdî (1312); Buhârî ve Müslim’deki kavlî hadislerin başları alfabetik; Buhârî için Aynî, Askalânî, Kastallânî; Müslim için Nevevî şerhindeki yerleri verir. En büyük eksiği fiilî hadislerin fihristinin olmayışı."},{"s":9,"x":"Miftâhu’t-Tertîb: Seyyid Ahmed el-Gumârî; Hatîb’in Târîh’inin (14 cilt) fihristi, 90 sayfayı geçmez, ~4500 hadis. Hatîb metod gözetmediği için başka yol yoktur."},{"s":9,"x":"el-Buğye: Seyyid Abdülaziz el-Gumârî; Ebû Nuaym’ın Hilye’sinin fihristi, ~5000 hadis; Miftâh’tan farkı künyeleri ayrı zikretmesi."},{"s":9,"x":"Kavlî hadisler alfabetik baş kısımlarıyla, fiilî hadisler sahâbe ismine göre; hanım sahâbîlere ayrı bölüm yok."},{"s":10,"x":"Fuad Abdülbâkî fihristleri kavlî hadislerin ilk kelimesine göre alfabetiktir: Müslim (88 sayfa), Muvatta’ (1812 hadis / 867 kavlî), İbn Mâce (4341 / 3100)."}],"oz":{"t":"İkinci Yol: Metnin İlk Lafzı · Özet","intro":"İkinci fasıl: hadisin metninden ilk lafzı bilme yoluyla tahric; halk arasında meşhur hadis kitapları, ilk kelimelere göre alfabetik eserler ve fihristler.","s":[{"h":"İkinci Fasıl: İkinci Yol","b":[{"k":"ar","a":"الطَّرِيقَةُ الثَّانِيَةُ: التَّخْرِيجُ عَنْ طَرِيقِ مَعْرِفَةِ أَوَّلِ لَفْظٍ مِنْ مَتْنِ الْحَدِيثِ.","x":"Hadisin metninden ilk lafzı bilme yoluyla tahric yapmak."},{"k":"p","x":"Bu yolda başvuracağımız kitaplar 3 şekil üzere yazılmıştır:"},{"k":"n","n":1,"x":"Halk arasında meşhur olan hadislerin yer aldığı kitaplar."},{"k":"n","n":2,"x":"Hadislerin ilk kelimelerine göre alfabetik yazılmış eserler."},{"k":"n","n":3,"x":"Fihristler."}]},{"h":"Halk Arasında Meşhur Olan Hadislerin Yer Aldığı Kitaplar","b":[{"k":"p","x":"Mesela: «ثلاث من كن»، «حب الوطن من الإيمان» hadisi gibi."},{"k":"ar","a":"١- الدُّرَرُ الْمُنْتَثِرَةُ فِي الْأَحَادِيثِ الْمُشْتَهِرَةِ لِجَلَالِ الدِّينِ السُّيُوطِيِّ، ٩١١ هـ","x":""},{"k":"ar","a":"٢- اللَّآلِئُ الْمَنْثُورَةُ فِي الْأَحَادِيثِ الْمَشْهُورَةِ لِابْنِ حَجَرٍ، ٨٥٢ هـ","x":""},{"k":"ar","a":"٣- الْمَقَاصِدُ الْحَسَنَةُ فِي بَيَانِ كَثِيرٍ مِنَ الْأَحَادِيثِ الْمُشْتَهِرَةِ عَلَى الْأَلْسِنَةِ لِمُحَمَّدِ بْنِ عَبْدِ الرَّحْمَنِ السَّخَاوِيِّ، ٩٠٢ هـ","x":""},{"k":"p","x":"Bu kitap “Makâsıdü’l-hasene” bu konuda yazılan ilk kitaptır. Bu kitabı iki kişi ihtisar ederek eser yazmış:"},{"k":"ar","a":"أ- تَمْيِيزُ الطَّيِّبِ مِنَ الْخَبِيثِ لِلشَّيْبَانِيِّ، ٩٤٤ هـ / الشَّيْبَانِيُّ هُوَ تِلْمِيذُ السَّخَاوِيِّ","x":""},{"k":"ar","a":"ب- كَشْفُ الْخَفَاءِ لِلْعَجْلُونِيِّ، ١١٦٢ هـ","x":"“el-Makâsıdü’l-Hasene”nin çok mükemmel bir özetidir."},{"k":"ar","a":"٤- أَسْنَى الْمَطَالِبِ فِي أَحَادِيثَ مُخْتَلِفَةِ الْمَرَاتِبِ لِمُحَمَّدِ بْنِ دَرْوِيشٍ، ١٢٧٦ هـ","x":"“el-Makâsıdü’l-Hasene” ve “Temyîzü’t-Tayyib”in özeti olarak yazılmıştır."},{"k":"not","x":"Bu alanın olmazsa olmaz kitabı “Keşfü’l-Hafâ”dır. Aclûnî Keşfü’l-Hafâ’yı yazarken el-Makâsıdü’l-Hasene’yi ihtisar ederken 1., 2. ve 3. kaynaklardan yararlanmıştır. Yani Aclûnî kitabını yazarken hem Süyûtî hem İbn Hacer hem de Sehâvî’den yararlanmıştır. Kitabında “kâle Süyûtî” derse 1. kitap anlaşılır, “kâle İbn Hacer” derse 2. kitap anlaşılır, “kâle fi’l-Feth” derse Fethu’l-Bârî anlaşılır vs."},{"k":"dikkat","x":"**Bir hadis Keşfü’l-Hafâ’da yer alıyor diye mevzu olmaz**, zira bu kitap halk arasında meşhur olan hadisleri ele almıştır. Mevzu da olabilir, olmayabilir de; zayıf olur, hasen olur, sahih olur."},{"k":"p","x":"Bu kitaplar senedi olmayan ve hadis kaynaklarında bulunmayan hadislere «لا أصل له» derler. Mevzu demiyorlar; “**mevzu**” diyebilmek için râvinin yalancılığı bilinmesi lazım. Hadis olmayan sözlere de «ليس بحديث» derler. Bazen «موضوع» der, zındıklar uydurdu derler."},{"k":"p","x":"“Lâ asle leh” ile “leyse bi-hadîsin” ve “mevzudur” sözü arasında fark vardır. “Mevzudur” dediği zaman hadisin kim tarafından uydurulduğunu belirtir. “Leyse bi-hadîsin” dediğinde mesela söz, yani ya hikmetli sözlerden ya sahâbe sözü ya da ulemadan birinin sözüdür diye belirtir. “Lâ asle leh” dediğinde ise ben senedini bulamadım diyor; yani ne hadis olduğuna ne de hadis olmadığına delil yok demektir."},{"k":"tbl","r":[["İfade","Anlamı"],["«لا أصل له»","Senedini bulamadım; ne hadis olduğuna ne de olmadığına delil yok"],["«ليس بحديث»","Hadis değil; hikmetli söz, sahâbe sözü ya da ulemadan birinin sözü"],["«موضوع»","Uydurmadır; kim tarafından uydurulduğu belirtilir"]]}]},{"h":"Hadislerin İlk Kelimelerine Göre Alfabetik Yazılmış Eserler","b":[{"k":"p","x":"Bu şekilde yazılmış eser bilmiyorum diyor Tahhân hoca; lakin müteahhirûn bazı âlimler sayılı eserlerden senetlerini hazfedip hadisin metnini alfabetik şekilde tertip etmişler. Bunların en meşhuru:"},{"k":"n","n":1,"x":"«الجامع الصغير من حديث البشير النذير للسيوطي ٩١١ هـ»: “Cem’u’l-Cevâmi’” kitabından yazmış, senetleri hazfetmiş, hadisi tasnif edeni (Buhârî, Müslim vd.) belirtmek için rumuz kullanmış, sonra rumuzlarla hadisin derecesini belirtmiş. 3 rumuz var: «ض» zayıf, «ح» hasen, «صح» sahih demektir."},{"k":"not","x":"Süyûtî mütesâhil olduğu için hadisin derecesi için söylediğini, şerhi “Feyzü’l-Kadîr” olan Allâme Abdurrauf el-Münâvî’nin kitabındaki derecesine baktıktan sonra derecesi hakkında kesin bilgi edinebiliriz."},{"k":"n","n":2,"x":"Süyûtî’nin “Câmiu’l-Kebîr”i de bu konuda yazılmış ikinci eserdir. Süyûtî bu eserini o zamana ulaşmış bütün hadisleri toplama amacıyla yazmıştır."},{"k":"n","n":3,"x":"Süyûtî’nin “ez-Ziyâde alâ Kitâbi’l-Câmii’s-Sağîr” eseridir."},{"k":"n","n":4,"x":"Yusuf en-Nebhânî’nin “el-Fethu’l-Kebîr”i: “Câmiu’s-Sağîr” ile “ez-Ziyâde alâ Câmii’s-Sağîr”i birleştirerek alfabetik olarak sıralamış ve hadisin sıhhatini belirten rumuzları silerek yazmıştır."}]},{"h":"Fihristler","b":[{"k":"p","x":"Hadisin ilk kelimesini biliyorsak bakabiliriz."},{"k":"ar","a":"١- مِفْتَاحُ الصَّحِيحَيْنِ لِلتَّوْقَادِيِّ","x":"Tokatlı"},{"k":"p","x":"Bu kitap: Buhârî ve Müslim’de geçen hadislerin ilk kelimesini biliyorsak bu kitaba bakıyoruz. Aynı zamanda hadisin hangi şerhte geçtiğini (Kastallânî, Askalânî, Aynî, Buhârî) de belirtiyor. Müslim’deki hadisin yerini belirtirken de Nevevî’deki yerini de belirtiyor."},{"k":"not","x":"Bu kitaptan yararlanırken hangi baskıyı esas aldığını belirtmiş; oradan hangi baskıdan bakmamız gerektiğine bakmalıyız. Yoksa biraz zor buluruz hadisi."}]}]}},{"t":"Üçüncü Yol: Az Kullanılan Kelime","intro":"Hadis metninin herhangi bir yerinde geçen, kullanımı yaygın olmayan garib bir kelimeden yola çıkarak hadise ulaştıran eser: el-Mu’cemü’l-müfehres (Concordance), rumuzları ve kullanımı.","s":[{"h":"Üçüncü Yol ve Concordance","b":[{"k":"p","x":"Hadis metninin herhangi bir yerinde bulunan ve kullanımı yaygın olmayan yabancı (ğarib) bir kelimeden yola çıkarak hadis metnine ulaşmayı sağlayan eserden yararlanma."},{"k":"h","x":"el-Mu’cemü’l-müfehres li-elfâzi’l-hadîsi’n-nebevî (Concordance)"},{"k":"li","x":"Fransızca olarak Concordance et Indices de la Tradition Musulmane, Arapça olarak el-Mu’cemü’l-müfehres li-elfâzi’l-hadîsi’n-nebevî adını taşıyan ve kısaca Concordance diye anılan hadis fihristi, Amsterdam Kraliyet Akademisi’nin himayesinde ve değişik ülkelere ait 15 kadar akademi ve enstitünün ilmî ve mâlî desteğiyle gerçekleştirilmiş modern bir çalışmadır."},{"k":"li","x":"Kütüb-i Sitte’ye ilâve olarak Dârimî’nin Sünen’i, İmam Mâlik’in Muvatta’ı ve İmam Ahmed b. Hanbel’in Müsned’ini ihtiva eden Concordance’ın hazırlanması için çalışmalar fiîlen 1916 yılında **Juynboll, Wensinck, Horovitz** ve başka bazı müsteşriklerin planlamasıyla başlatılmıştır. Muhtelif ülkelerden 40 kadar ilim adamı tarafından sürdürülen çalışmanın ilk ürünü, 1. cildi tam 20 yıl sonra 1936’da Leiden’de neşredilmiştir. 8. cildi ise 1988’de yayımlanmıştır."},{"k":"li","x":"Eserin 1. cildinde kitapta kullanılan rumuzlar verilmekte, kelimelerin diziliş usulüne dair bazı uyarılar ve bilgilendirmeler yapılmaktadır. Ancak, kitabın kullanımını genişçe anlatan mukaddimenin yazılmamış olması büyük bir eksikliktir. Öte yandan işin genişliğinden ve tek elden yapılmamasından kaynaklanan bir kısım eksiklikler de bulunmaktadır."},{"k":"li","x":"Maddelerinin tertibi genellikle sözlüklerin yöntemine yakındır."},{"k":"li","x":"Çoğu kez maddelerin herhangi birisinde başka maddelere bakılması için o maddelere havale eder. Bu yüzden bu esere müracaat edenlerin birçoğu bunu işi zorlaştıran bir durum olarak görürler."},{"k":"tbl","r":[["Concordance","Bilgi"],["**Kapsamı**","Kütüb-i Sitte + Dârimî’nin Sünen’i + Muvatta’ + Ahmed b. Hanbel’in Müsned’i (9 kitap)"],["**Başlangıç**","1916; Juynboll, Wensinck, Horovitz ve başka müsteşrikler"],["**Yayım**","1. cilt 1936 Leiden; 8. cilt 1988"],["**Destek**","Amsterdam Kraliyet Akademisi himayesi, 15 kadar akademi ve enstitü; 40 kadar ilim adamı"],["**Eksikliği**","Kullanımı genişçe anlatan mukaddime yok; tek elden yapılmadığı için eksiklikler; çok havale"]]}]},{"h":"Concordance’ın Rumuzları","b":[{"k":"p","x":"Şahıs ve yer isimlerine tahsis edilmiş olan 8. cilt dışında hadislerde yer alan önemli ifâdelerin, lügat tekniği içinde anılan 9 kitaptaki yerlerine işâret eden Concordance, ihtiva ettiği kitaplar için Miftâhu künûzi’s-sünne’den ayrı olarak aşağıdaki kısaltmaları kullanmaktadır:"},{"k":"tbl","r":[["Kitap","Rumuz"],["**Buhârî**","«خ»"],["**Müslim**","«م»"],["**Ebû Dâvûd**","«د»"],["**Tirmizî**","«ت»"],["**Nesâî**","«ن»"],["**Dârimî**","«دي»"],["**İbn Mâce**","«جه» (ilk iki ciltte «ق» şeklindedir)"],["**Muvatta’**","«ط»"],["**Ahmed b. Hanbel**","«حم» (ilk iki ciltte «حل» şeklindedir)"]]},{"k":"p","x":"Ayrıca bu kısaltmalar her sayfa altında gösterilmek sûretiyle araştırıcıya yardımcı olunmuştur."}]},{"h":"Rakamların Anlamı","b":[{"k":"p","x":"Bu 9 kitap için verilen rakamlar değişik anlamlardadır. Bu açıdan şöyle bir gruplandırma yapmak gerekmektedir:"},{"k":"n","n":1,"x":"Bölüm (kitab) adından sonra bâb numarası verilenler: Bunlar; Buhârî, Ebû Dâvûd, Tirmizî, İbn Mâce, Nesâî ve Dârimî’nin kitaplarıdır."},{"k":"n","n":2,"x":"Bölüm (kitab) adından sonra hadis numarası verilenler: Bunlar da; sadece Müslim’in Sahîh’i ve İmam Mâlik’in Muvatta’ıdır."},{"k":"n","n":3,"x":"Cilt ve sayfa numarası verilen: Bu yalnızca Ahmed b. Hanbel’in Müsned’idir."},{"k":"tbl","r":[["Rakamın anlamı","Kitaplar"],["**Kitab adı + bâb numarası**","Buhârî, Ebû Dâvûd, Tirmizî, İbn Mâce, Nesâî, Dârimî"],["**Kitab adı + hadis numarası**","Müslim, Muvatta’"],["**Cilt + sayfa numarası**","Ahmed b. Hanbel’in Müsned’i"]]}]},{"h":"Concordance’ın Kullanımı","b":[{"k":"p","x":"Concordance’tan kısa zamanda aranılan hadis hakkında bilgi alabilmek için, o hadiste geçen en nâdir ve müştak kelimenin tespit edilmesi ve o kelimeden hareketle aramaya başlamak gerekir."},{"k":"dikkat","x":"Bir hadis için bir-iki kelimeden bakıldıktan sonra bulunmazsa, hemen bu hadisin Concordance’ın ihtiva ettiği 9 kitapta bulunmadığı hükmüne varmamak lâzımdır. Daha başka kelimelerden araştırma sürdürülmelidir."},{"k":"p","x":"Concordance’ta kelimeler; mâzi, muzâri, emir… ma’lûm, meçhûl sırasıyla ve şahıs zamirleri ve emsile-i muttaride sırasına göre dizilmişlerdir."},{"k":"dikkat","x":"Ayrıca, Concordance’tan tespit edilen kitab, bâb veya hadis numaralarının ait oldukları kaynaklardan tek tek kontrol edilmesi, hele bilhassa metinlerin gösterilen yerde bulunup bulunmadıklarının tetkiki asla unutulmamalıdır."},{"k":"h","x":"Şu iki nokta da bilinmelidir"},{"k":"n","n":1,"x":"Concordance’ta, Müslim’in Sahîh’inde sadece senedi zikredilmiş, fakat metni verilmemiş rivâyetlere atıf yapılmamıştır."},{"k":"n","n":2,"x":"Muvatta’daki sadece merfu’ hadislere atıf yapılmış, İmam Mâlik’e ve öteki zevâta ait görüşlere (âsâr) işâret edilmemiştir."},{"k":"p","x":"Hadisin en ğarib, en nâdir kelimesinden yola çıkarak köküne ve hece harfine göre Concordance’ta araştırma yapılırken, hadis metninin bir bölümüyle karşılaşılır. Fakat bulunan bu bölüm, aranılan hadisin dışında bir başka hadisin bir parçası olabilir. Bulunan bu kısım hemen kaynak olarak gösterilmemelidir."},{"k":"ar","a":"لَوْلَا أَنْ أَشُقَّ عَلَى أُمَّتِي لَأَمَرْتُهُمْ ...","x":"Örnek"},{"k":"p","x":"Bu hadisin hem misvakla hem de vitr namazının tehiriyle ilgili varyantı olduğu için, aslî kaynakta hadis bulunmadan Concordance’taki yeri kaynak olarak gösterilmez."},{"k":"steps","x":["Hadisteki en nâdir ve müştak kelimeyi tespit et.","Kelimenin köküne ve hece harfine göre Concordance’ta ara.","Bulamazsan başka kelimelerden aramayı sürdür.","Bulunan kitab, bâb, hadis numarasını aslî kaynakta tek tek kontrol et."]}]}],"ht":[{"s":0,"x":"Concordance (el-Mu’cemü’l-müfehres): 9 kitap (Kütüb-i Sitte + Dârimî + Muvatta’ + Müsned). 1916’da Juynboll, Wensinck, Horovitz ile başladı; 1. cilt 1936 Leiden, 8. cilt 1988."},{"s":0,"x":"Concordance’ın eksikleri: kullanımını anlatan mukaddimenin olmayışı, tek elden yapılmaması, maddeler arası çok havale."},{"s":1,"x":"Concordance rumuzları: «خ» Buhârî, «م» Müslim, «د» Ebû Dâvûd, «ت» Tirmizî, «ن» Nesâî, «دي» Dârimî, «جه» İbn Mâce (ilk iki ciltte «ق»), «ط» Muvatta’, «حم» Ahmed (ilk iki ciltte «حل»)."},{"s":1,"x":"8. cilt şahıs ve yer isimlerine ayrılmıştır."},{"s":2,"x":"Concordance’ta rakamlar: Buhârî, Ebû Dâvûd, Tirmizî, İbn Mâce, Nesâî, Dârimî → kitab + bâb no; Müslim ve Muvatta’ → kitab + hadis no; Müsned → cilt + sayfa."},{"s":3,"x":"Concordance’ta en nâdir ve müştak kelimeden aranır; bir-iki kelimede bulunmazsa hadis 9 kitapta yok denmez."},{"s":3,"x":"Concordance’ta Müslim’in yalnızca senedi verilen rivâyetlerine ve Muvatta’nın âsârına atıf yoktur; yalnızca merfu’ hadisler."},{"s":3,"x":"Concordance’taki yer, aslî kaynakta hadis bulunmadan kaynak olarak gösterilmez (örnek: «لولا أن أشق على أمتي» hem misvak hem vitrin tehiri varyantı)."}],"oz":{"t":"Üçüncü Yol: Az Kullanılan Kelime · Özet","intro":"Üçüncü fasıl: hadisin insanların dilinde az dolaşan herhangi bir kelimesini bilmek yoluyla tahric; Concordance ve kaynak gösterme yöntemi.","s":[{"h":"Üçüncü Fasıl: Üçüncü Yol","b":[{"k":"ar","a":"الطَّرِيقَةُ الثَّالِثَةُ: التَّخْرِيجُ عَنْ طَرِيقِ مَعْرِفَةِ كَلِمَةٍ يَقِلُّ دَوَرَانُهَا عَلَى الْأَلْسِنَةِ مِنْ أَيِّ جُزْءٍ مِنْ مَتْنِ الْحَدِيثِ.","x":"Hadisin insanların dilinde az dolanan herhangi bir kelimesini bilmek yoluyla tahric yapmak."},{"k":"p","x":"Bu yolda yararlanılabilecek kitap “el-Mu’cemü’l-müfehres li-elfâzi’l-hadîsi’n-nebevî” adı ile meşhur “Concordance” kitabıdır. Müsteşriklerden bir grup yazmıştır. Dr. Arent Jan Wensinck neşretmiştir; neşrinde Muhammed Fuad Abdülbâkî yardımcı olmuştur. 1936’da ilk cilt, 1969’da son cilt basılmıştır."},{"k":"p","x":"Kütüb-i Sitte, Muvatta’, Müsned-i Ahmed b. Hanbel ve Dârimî’nin Sünen’inin lafızlarının fihristidir."},{"k":"h","x":"Concordance’ın metodu"},{"k":"n","n":1,"x":"Fiiller: mâzi, muzâri, emir, ism-i fâil-mef’ûl; önce fiilleri yalın ma’lûm, sonra bitişikleri ile beraber ma’lûm, sonra yalın halde meçhul olarak zikreder."},{"k":"n","n":2,"x":"Esmâü’l-meânî’yi sonra,"},{"k":"n","n":3,"x":"Müştakkât’ı zikreder."}]},{"h":"Kaynak Gösterme ya da Kaynak Bulma Yöntemi","b":[{"k":"tbl","r":[["Verilen bilgi","Kitaplar"],["**İsim, kitap ismi, bab no**","Buhârî, Tirmizî, İbn Mâce, Ebû Dâvûd, Dârimî, Nesâî"],["**İsim, konu başlığı, hadis no**","Muvatta’, Müslim"],["**İsim, cilt no, sayfa no**","Ahmed b. Hanbel ve diğer kitaplar"]]},{"k":"h","x":"Örnekler"},{"k":"tbl","r":[["Concordance’taki ifade","Anlamı"],["«خ، شركة، 3، 16»","Buhârî, Kitâbü’ş-şerike, 3 ve 16. bablar"],["«ت، أدب، 15»","Tirmizî, Kitâbü’l-edeb, 15. bab"],["«جه، تجارات، 31»","İbn Mâce, Kitâbü’t-ticârât, 31. bab"],["«د، طهارة، 72»","Ebû Dâvûd, Kitâbü’t-tahâre, 72. bab"],["«دي، صلاة، 79»","Dârimî, Kitâbü’s-salât, 79. bab"],["«ن، صيام، 78»","Nesâî, Kitâbü’s-sıyâm, 78. bab"],["«ط، صفة النبي، 3»","Muvatta’, Sıfatü’n-nebî başlığı, 3 nolu hadis"],["«م، فضائل الصحابة، 165»","Müslim, Kitâbü fezâili’s-sahâbe, 165 nolu hadis"],["«حم، 4، 175»","Ahmed b. Hanbel, 4. cilt, 175. sayfa"]]}]}]}},{"t":"Dördüncü Yol (1): Bütün Konuları İçeren Eserler","intro":"Hadisin konusu biliniyorsa başvurulan yol ve birinci kısım eserler: câmi’ler, müstahrecler, müstedrekler, mecma’lar, zevâidler ve Miftâhu Künûzi’s-Sünne.","s":[{"h":"Dördüncü Yol: Hadisin Konusu","b":[{"k":"p","x":"Hadisin konusuna göre tertib edilmiş eserlerden yararlanma:"},{"k":"li","x":"Konusuna göre hadis arama faaliyetinde, öncelikli olarak dikkat edilmesi gerekli olan ilk husus, aradığımız hadisin hangi konuda olduğunu tespit etmektir."},{"k":"li","x":"Konularına göre tasnif edilmiş (ale’l-ebvâb) hadis literatüründeki ana başlıkların (kitapların orijinal isimleri) bilinmeden araştırılan hadisin nerede bulunabileceğini sağlıklı bir şekilde tespit etmek mümkün olmayacaktır."},{"k":"li","x":"Araştırılacak olan hadis, tek bir konu değil de, birden çok konuyla bağlantılı olabilir. Bu durumda, araştırmacının tek bir konudan değil de, hadisle ilgili olabileceğini tahmin ettiği konuların hepsinden hareketle arama işine devam etmesi gerekir."},{"k":"li","x":"Konularına göre tertip edilmiş olan hadis kitapları, aynı konuda birçok hadisi bir arada görme imkânı sunmaktadır."},{"k":"p","x":"Elimizdeki hadisin konusu veya içerdiği konulardan birisini belirleyip aşağıdaki kaynaklardan birisine müracaat ederiz."},{"k":"n","n":1,"x":"Dinin bütün konularını içeren kitaplar ki, bunların en meşhurları: câmi’ler, müstahrecler, câmi’ler üzerine yazılan müstedrekler, mecâmi’ türü eserler, Miftâhu Künûzi’s-Sünne."},{"k":"n","n":2,"x":"Dinin çoğu konusunu içeren eserler ki; sünenler, muvatta’ ve sünenler üzerine yazılan müstedrekler bu tür eserlerdendir."},{"k":"n","n":3,"x":"Dinin sadece bir konusuna göre dizayn edilmiş eserler ki bunlar da cüzler, terğîb-terhîb, zühd, fezâil-ahlak ve âdâb, ahkâm vs. ile bazı ilim dallarında yazılmış eserler ki tahric, hadis şerhleri ve bunlara yazılan ta’likatlara bakarız."},{"k":"tbl","r":[["Kısım","Kapsam","Eserler"],["**Birinci kısım**","Dinin bütün konuları","Câmi’ler, müstahrecler, müstedrekler, mecâmi’, zevâid, Miftâhu Künûzi’s-Sünne"],["**İkinci kısım**","Dinin çoğu konusu","Sünenler, musannefler, muvatta’lar, bunlar üzerine müstahrecler"],["**Üçüncü kısım**","Dinin belli bir konusu","Cüzler, terğîb-terhîb, zühd-fezâil-âdâb, ahkâm, müstakil konular, tahric kitapları, şerhler"]]}]},{"h":"Câmi’ler (el-Cevâmi’)","b":[{"k":"d","t":"Câmi’","x":"Dînî konuların hemen hemen tamâmını ihtiva eden hadisleri toplayan en kapsamlı eserlerdir."},{"k":"p","x":"Câmi’ler, dînî konuların hemen hemen tamâmını kapsayan sekiz ana bölümü ihtiva etme özelliğine sâhiptir. Her birine ‘kitab’ adı denen bu sekiz bölümün muhtevâları kısaca şöyledir: İman, ahkâm, zühd, âdâb, tefsir, târih-siyer-cihad, menâkıb, fiten ve melâhim."},{"k":"dikkat","x":"Câmi’ler bu sekiz bölümden herhangi birini ihtiva etmezler veya nâkıs olarak ihtiva ederlerse câmi’ olmaktan çıkarlar."},{"k":"li","x":"Câmi’ler aynı zamanda ‘sahih’ adıyla da anılmaktadır. Meselâ; Buhârî, Müslim ve Tirmizî’nin kitaplarının adı el-Câmiu’s-sahîh’tir."},{"k":"h","x":"Câmi’lerden bazı örnekler"},{"k":"n","n":1,"x":"Buhârî’nin (ö.256/870) el-Câmiu’s-sahîh’i."},{"k":"n","n":2,"x":"Müslim’in (ö.261/874) el-Câmiu’s-sahîh’i."},{"k":"n","n":3,"x":"Abdürrezzak’ın (ö.211/827) Câmi’i."},{"k":"n","n":4,"x":"Ma’mer b. Râşid’in (ö.152/769) Câmi’i."},{"k":"n","n":5,"x":"Tirmizî’nin (ö.279/892) el-Câmiu’s-sahîh’i."},{"k":"n","n":6,"x":"Sevrî’nin (ö.161-166 / 777-782) Câmi’i."},{"k":"n","n":7,"x":"İbn Uyeyne’nin (ö.198/813) Câmi’i."}]},{"h":"Buhârî’nin el-Câmiu’s-Sahîh’i","b":[{"k":"p","x":"Bu kitabın tam adı: “el-Câmiu’l-Müsnedü’s-Sahîhu’l-Muhtasar min Umûri Rasûlillâh ve Sünenihî ve Eyyâmihî.”"},{"k":"li","x":"“Kitâbu Bed’i’l-Vahy” ile başlar, “Kitâbu’t-Tevhîd” ile biter."},{"k":"li","x":"Buhârî, Sahîh’ini 600.000 hadis arasından seçmiştir. Concordance’a göre 97 kitab ve 3730 bâbtan oluşmaktadır. Mükerrerler de dâhil 7275 (veya 9082) hadis ihtiva etmektedir. Buhârî’nin Sahîh’inde zayıf hadis yoktur. Hadis kitaplarının birinci tabakasına dâhildir."},{"k":"li","x":"Eserde bab başlıkları senedsiz zikredilmiştir. Eserde ana bölümler halinde olan her kitap bablara ayrılmakta ve her babın altında da hadisler sıralanmaktadır."},{"k":"li","x":"Bab başlıklarının çoğunluğu ayetlerden, bazen hadislerden alıntı yapılarak, bazen de fıkhî bir anlam taşıyacak nitelikte seçilmiş ibarelerden oluşmaktadır."},{"k":"li","x":"Buhârî, bir hadisi bazen ilgisi dolayısıyla ve ahkâm çıkarmak düşüncesiyle çeşitli kitapların çeşitli bablarında bölerek verir. Fakat bu hadisi değişik yerlerde verirken farklı senedlerle serdetmeye dikkat eder. Böylece hadisin değişik senedlerle de rivayet edilmiş olduğunu gösterir."},{"k":"h","x":"Buhârî’nin Sahîh’inde aradığımız hadise ulaşma şekilleri"},{"k":"li","x":"Concordance’den."},{"k":"li","x":"Konusuna göre; Miftâhu Künûzi’s-Sünne’den."},{"k":"li","x":"Mevsûatü etrâfi’l-hadîs’ten; hadisin başında geçen ilk kelimenin ilk harfine göre (Rumuzu: Buhârî «خ»)."},{"k":"li","x":"Kütüb-i Tis’a, Elfiye, Şâmile gibi hadis CD’lerinden."}]},{"h":"Câmi’ler Üzerine Yazılmış Müstahrecler","b":[{"k":"d","t":"Müstahrec","x":"Bir musannifin kendisinden önce tasnif edilmiş herhangi bir hadis kitabında bulunan hadisleri, teker teker ele alarak kitap sahibinin senedinden başka bir senedle rivayet etmek suretiyle bu kitabın musannifinin şeyhinde veya sahâbe de olsa daha yukarıda bir raviyle karşılaşmak suretiyle meydana getirdiği hadis kitabıdır."},{"k":"p","x":"Böylece, esas aldığı eserdeki rivayetlerin başka varyantlarını tespit suretiyle kuvvetlendirme amaçlanmaktadır."},{"k":"not","x":"Şartı: Kendisini en yakına ulaştıracak senedi kaybetmemek için daha uzak bir şeyhe ulaşmamasıdır. Ancak âlî sened amacıyla veya hadisteki önemli bir ziyade olursa başkadır."},{"k":"li","x":"Bu tür çalışmalar daha çok bir hadisin farklı varyantlarını derlemek, sened, metin, sened tahkiki ve tahlili yoluyla hadis hakkında daha sağlıklı bir hükme varmak için yapılan araştırmalarda kullanılır."},{"k":"p","x":"Bu eserlerin faydası; ğarib hadislerin kuvvet kazanması, sahih hadislerin sıhhatini pekiştirerek onlara âlî isnad özelliği kazandırmasıdır."},{"k":"li","x":"Müstahreclerin tertibi ve düzeni, çalışmaya esas alınan eserlerin tertip ve düzeni ile aynıdır. Sonuç olarak, câmi’lere yapılmış olan müstahrec türü eserlerde konularına göre hadisleri ararken takip edilen yöntem, câmi’ türü eserlerde takip edilen yöntemle aynıdır."},{"k":"li","x":"Sünenler gibi câmi’ler dışındaki kitaplara yapılan müstahrecler câmi’lere yapılan müstahrecler gibi değildir."},{"k":"dikkat","x":"Burada senedleri farklı hadis metinlerinin, müstahrec sahiplerinin esas aldıkları kitaptaki metinlerle farklı olabileceği husûsu unutulmamalıdır. Yâni mânâ rivâyeti yapılmış veya benzer lafızlarla rivâyet edilmiş olabilir."},{"k":"h","x":"Yalnız Buhârî üzerine yapılmış müstahrecler"},{"k":"n","n":1,"x":"İsmâilî’nin (ö.371/981) Müstahrec’i."},{"k":"n","n":2,"x":"Ğıtrîfî’nin (ö.377/987) Müstahrec’i."},{"k":"n","n":3,"x":"İbn Ebî Zühl’ün (ö.378/988) Müstahrec’i."},{"k":"n","n":4,"x":"İbn Merdûyeh (Merdeveyh)’in (ö.416/1019) Müstahrec’i."},{"k":"h","x":"Yalnız Müslim üzerine yapılmış müstahrecler"},{"k":"n","n":1,"x":"Ebû Avâne el-İsferâyînî’nin (ö.316/928) Müstahrec’i: 5 cilt olup içerisinde tekrarlarla birlikte 8.718 rivâyet vardır. Eserde, aynı hadis farklı farklı senedlerle yer alır. Ebû Avâne’de bulunan bir rivâyetin senedi, Müslim’de bulunan rivâyetin senediyle, Müslim’in hocasında veya hocasının hocasında birleşebilir. Böylece senedler arası incelikler ve farklılıklar görülmüş olur. Ebû Avâne’nin eserinin dipnotunda, hadisin Müslim’deki yeri hadis numarası ile birlikte verilmiştir."},{"k":"p","x":"CD dışında bu kitaptan hadis araştıranlar, 5. ciltten hadisin hece harfine ve sahâbî ismine göre faydalanabilirler."},{"k":"n","n":2,"x":"el-Hîrî (veya el-Hiyerî)’nin (311) Müstahrec’i."},{"k":"n","n":3,"x":"Ebû Hâmid el-Herevî’nin (355) Müstahrec’i."},{"k":"h","x":"Hem Buhârî hem de Müslim üzerine yapılmış müstahrecler"},{"k":"n","n":1,"x":"Ebû Nuaym el-İsfahânî’nin (ö.430/1039) Müstahrec’i."},{"k":"n","n":2,"x":"İbnü’l-Ahram’ın (ö.344/955) Müstahrec’i."},{"k":"n","n":3,"x":"Ebû Bekir el-Berkânî’nin (ö.425/1034) Müstahrec’i."},{"k":"tbl","r":[["Müstahrec","Esas aldığı eser"],["**İsmâilî (371)**","Buhârî"],["**Ğıtrîfî (377)**","Buhârî"],["**İbn Ebî Zühl (378)**","Buhârî"],["**İbn Merdûyeh (416)**","Buhârî"],["**Ebû Avâne el-İsferâyînî (316)**","Müslim"],["**el-Hîrî (311)**","Müslim"],["**Ebû Hâmid el-Herevî (355)**","Müslim"],["**Ebû Nuaym el-İsfahânî (430)**","Buhârî ve Müslim"],["**İbnü’l-Ahram (344)**","Buhârî ve Müslim"],["**Ebû Bekir el-Berkânî (425)**","Buhârî ve Müslim"]]}]},{"h":"Câmi’ler Üzerine Yazılmış Müstedrekler","b":[{"k":"d","t":"İstidrâk","x":"Kelime olarak; tamamlama, ek bilgi anlamına gelir."},{"k":"d","t":"Müstedrek","x":"Önceki musannifin şartlarına (râvîlerine) uygun olmasına rağmen, herhangi bir sebeple eserinde yer almamış olan hadislerin bir başkası tarafından toplanması neticesinde meydana gelen yeni eserlerin ismidir."},{"k":"p","x":"Bu anlam içinde Buhârî ve Müslim’in Sahîh’lerine yazılmış sekiz, on kadar müstedrek bulunmaktadır."},{"k":"li","x":"Bu eserlerde âdetâ (önceki) esas aldığı eseri tamamlama hedefi vardır."},{"k":"tbl","r":[["","Müstahrec","Müstedrek"],["**Ne yapar?**","Kitaptaki hadisleri başka bir senedle rivayet eder","Kitabın şartına uyup da alınmamış hadisleri toplar"],["**Amacı**","Varyantlarla kuvvetlendirme, âlî isnad","Esas alınan eseri tamamlama"]]}]},{"h":"Hâkim’in el-Müstedrek ale’s-Sahîhayn’i","b":[{"k":"p","x":"Hâkim en-Neysâbûrî’nin (ö.405/1014) el-Müstedrek ale’s-Sahîhayn’i:"},{"k":"li","x":"Buhârî ve Müslim üzerinde çalışılmış istidrak örneğidir. Hadisler konularına göre tertib edilmişlerdir. İçinde 8803 rivâyet vardır. 4 cilt olup her cildin sonunda konu fihristi bulunmakla beraber tek cilt halinde müstakil olarak hazırlanmış bir fihristi de bulunmaktadır. Bu fihristten, hadisin başındaki ilk kelimenin hece harfine ve sahâbe ismine göre istifâde etmek mümkündür."},{"k":"li","x":"Hâkim Müstedrek’ini bablar halinde tertip etmiştir. Buhârî ve Müslim’in Sahîh’lerinde takip etmiş oldukları tertibi izlemiştir."},{"k":"dikkat","x":"Hâkim mütesâhil bir âlimdir. Bundan dolayı hadislerin kritiği için Zehebî’nin (ö.748/1347) Telhîsü’l-Müstedrek isimli eserine bakılmalıdır. Çünkü Zehebî Müstedrek’teki hadislerin; yarıya yakınının sahih, dörtte birinin senedi sağlam ancak metninin illetli, dörtte birinin ise münker ve zayıf rivâyetler olduğunu ifâde eder."},{"k":"li","x":"Eserde önce Hâkim’in görüşü verilir. Zehebî’nin görüşleri dipnotlardadır. Örneğin; Zehebî Hâkim’le aynı şeyleri söylemişse hadis için «وافقه» ifâdesi kullanılır ve onayladığı anlaşılır. «سكت عنه» denilmişse Zehebî’nin hadise herhangi bir hüküm vermediği anlaşılır."},{"k":"h","x":"Hâkim Müstedrek’te hadisleri üç grup halinde zikreder"},{"k":"n","n":1,"x":"Buhârî ve Müslim’in şartına veya birinin şartına uygun olup da kitaplarına almadıkları hadisleri almıştır."},{"k":"n","n":2,"x":"Buhârî ve Müslim’in şartına uymasa da kendisine göre sahih olan hadisleri almıştır."},{"k":"n","n":3,"x":"Kendisine göre sahih olmayıp o konuya destek mahiyetinde getirdiği zayıf rivâyetleri almıştır. Bu hadisin zayıflık nedenlerini de kendisi açıklamıştır. Bu tür rivâyetleri genelde şâhit ve mütâbi’ (destekçi) rivâyetler olarak verir."},{"k":"tbl","r":[["Zehebî’ye göre Müstedrek’teki hadisler","Oran"],["**Sahih**","Yarıya yakını"],["**Senedi sağlam, metni illetli**","Dörtte biri"],["**Münker ve zayıf**","Dörtte biri"]]},{"k":"h","x":"Müstedrek’te aradığımız hadise ulaşma şekilleri"},{"k":"li","x":"Müstedrek’in tek ciltlik fihristinden, hadisin ilk kelimesinin hece harfine göre ve sahâbe ismine göre. Ayrıca hadisin konusuna göre her cildin sonunda bulunan fihristten."},{"k":"li","x":"Mevsûatü etrâfi’l-hadîs’ten; hadisin başında geçen ilk kelimenin ilk harfine göre (Rumuzu: «ك»)."},{"k":"li","x":"Elfiye, Şâmile gibi hadis CD’lerinden."},{"k":"not","x":"Müstedrek’te aradığımız hadisi bulduktan sonra önce Hâkim’in, daha sonra ise dipnotta bulunan Zehebî’nin görüşü belirtilir."},{"k":"h","x":"Tahric usûlünde kullanılacak ifâde"},{"k":"ar","a":"أَخْرَجَهُ الْحَاكِمُ فِي الْمُسْتَدْرَكِ عَلَى الصَّحِيحَيْنِ (ج / ص) رَقْمُ الْحَدِيثِ: (...) (نَحْوَهُ / مِثْلَهُ) وَقَالَ الْحَاكِمُ: (...) وَوَافَقَهُ الذَّهَبِيُّ / أَوْ سَكَتَ عَنْهُ.","x":""},{"k":"h","x":"Konuyla ilgili örnek bir çalışma"},{"k":"ar","a":"عَنْ نَافِعٍ قَالَ: كَانَ لِابْنِ عُمَرَ صَدِيقٌ مِنْ أَهْلِ الشَّامِ يُكَاتِبُهُ، فَكَتَبَ إِلَيْهِ عَبْدُ اللَّهِ بْنُ عُمَرَ: إِنَّهُ بَلَغَنِي أَنَّكَ تَكَلَّمْتَ فِي شَيْءٍ مِنَ الْقَدَرِ، فَإِيَّاكَ أَنْ تَكْتُبَ إِلَيَّ، فَإِنِّي سَمِعْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَقُولُ: إِنَّهُ سَيَكُونُ فِي أُمَّتِي أَقْوَامٌ يُكَذِّبُونَ بِالْقَدَرِ.","x":""},{"k":"ar","a":"أَخْرَجَهُ الْحَاكِمُ فِي الْمُسْتَدْرَكِ عَلَى الصَّحِيحَيْنِ (1/158). وَقَالَ: هَذَا حَدِيثٌ صَحِيحٌ عَلَى شَرْطِ مُسْلِمٍ. وَوَافَقَهُ الذَّهَبِيُّ.","x":""}]},{"h":"Mecma’lar (el-Mecâmî’)","b":[{"k":"p","x":"el-Mecâmî’, mecma’ kelimesinin çoğuludur. Hadis alanında te’lif edilmiş bulunan belli sayıdaki eserin, müelliflerinin gözettiği tertibe riâyet ederek derlenmesiyle oluşturulan çalışmalar bu başlık altında incelemeye tâbi tutulur. Bu konu, hadisleri bir arada toplamaya çalışan eserler başlığı altında da incelenmiştir."},{"k":"h","x":"Mecma’lardan bazı örnekler"},{"k":"n","n":1,"x":"Hasan b. Muhammed es-Sâğânî’nin (ö.650/1252) Meşâriku’l-envâri’n-nebeviyye min sıhâhi’l-ahbâri’l-mustafaviyye ismini verdiği el-Cem’u beyne’s-Sahîhayn’i."},{"k":"n","n":2,"x":"Ebû Abdullah Muhammed b. Ebî Nasr Futûh el-Humeydî’nin (ö.488/1095) el-Cem’u beyne’s-Sahîhayn’i."},{"k":"n","n":3,"x":"Ebü’l-Hasan Rezîn b. Muâviye el-Endelüsî’nin (ö.535/1141) et-Tecrîd li’s-sıhâh ve’s-sünen ismini verdiği el-Cem’u beyne’l-usûli’s-sitte’si; içinde İbn Mâce yerine Muvatta’ yer almaktadır."},{"k":"n","n":4,"x":"İbnü’l-Esîr diye bilinen Ebü’s-Seâdât’ın (ö.606/1209) Câmiu’l-usûl fî ehâdîsi’r-Resûl ismini verdiği el-Cem’u beyne’l-usûli’s-sitte’si. Eser Kitâbü’l-îmân’dan başlamaktadır. Konular alfabetik olarak tertib edilmiştir. Eseri, İbnü’d-Deyba’ (ö.944/1537) Teysîru’l-vusûl adlı eseriyle özetlemiştir. Bu eser İbrahim Canan tarafından, Muvatta’ da eklenerek Türkçe’ye tercüme edilmiştir."},{"k":"n","n":5,"x":"Muhammed b. Süleyman el-Mağribî (er-Rudânî)’nin (ö.1094/1683) Cem’u’l-fevâid min Câmii’l-usûl ve Mecmai’z-zevâid’i. Eserini 14 hadis kitabını (Buhârî, Müslim, Muvatta’, Sünen-i erbaa, Müsned-i Dârimî, Müsned-i Ahmed, Müsned-i Ebî Ya’lâ, Müsnedü’l-Bezzâr, Meâcimü’t-Taberânî es-selâse) bir araya getirerek derlemiştir. Eserin Türkçe’ye tercümesi Büyük Hadis Külliyâtı ismiyle Naim Erdoğan, tahrici ise Yusuf Özbek tarafından yapılmıştır."},{"k":"tbl","r":[["Mecma’","Müellif","Bir araya getirdiği eserler"],["**Meşâriku’l-envâr**","Sâğânî (650)","Sahîhayn"],["**el-Cem’u beyne’s-Sahîhayn**","Humeydî (488)","Sahîhayn"],["**et-Tecrîd li’s-sıhâh ve’s-sünen**","Rezîn b. Muâviye (535)","Usûl-i sitte (İbn Mâce yerine Muvatta’)"],["**Câmiu’l-usûl**","İbnü’l-Esîr (606)","Usûl-i sitte; konular alfabetik"],["**Cem’u’l-fevâid**","er-Rudânî (1094)","14 hadis kitabı"]]}]},{"h":"Zevâidler","b":[{"k":"d","t":"Zevâid","x":"Herhangi bir hadis kitabının bir başka hadis eseri ile karşılaştırılıp birincisinin ikincisinden fazla olarak ihtiva ettiği hadislerin bir araya getirilmesi sonucu oluşturulan eserlerdir."},{"k":"li","x":"Bu tür eserlerin en büyük yararı elde mevcut olan meşhur eserler ve koleksiyonlara ilave olarak ulaşılması zor ve nadir eserlerdeki rivayetlere de ulaşma imkânı vermeleridir. Bu tür çalışmalarda da çoğunlukla Sahîhayn ve Kütüb-i Sitte esas olarak alınmış ve bunların zevâidleri hazırlanmıştır."},{"k":"li","x":"Zevâid edebiyatından faydalanmanın pratik bir yönü, aynı anda birçok hadis kitabının taranmış olmasıdır. Mesela herhangi bir hadisi Mecmau’z-Zevâid’de bulduk diyelim, bu durumda Ahmed b. Hanbel, Ebû Ya’lâ ve Bezzâr’ın Müsnedleri ile Taberânî’nin üç mu’cemi ve Kütüb-i Sitte olmak üzere toplam 12 eser aynı anda taranmış olmaktadır."},{"k":"h","x":"Zevâidlerden bazı örnekler"},{"k":"n","n":1,"x":"Ebü’l-Abbas Ahmed b. Muhammed el-Bûsırî’nin (ö.840/1436) Misbâhu’z-zücâce fî zevâidi İbn Mâce’si. Bûsırî Kütüb-i Sitte içinde kendisine İbn Mâce’yi esas almış, diğerlerinde bulunmayıp da İbn Mâce’de bulunan rivâyetleri kitabında derlemiştir."},{"k":"n","n":2,"x":"Bûsırî’nin Fevâidü’l-müntekâ li-zevâidi’l-Beyhakî’si. Eser; Beyhakî’nin Sünen-i Kübrâ’sının Kütüb-i Sitte’ye zevâididir. Bûsırî bu eserinde, Kütüb-i Sitte’de bulunmayıp Beyhakî’nin Sünen-i Kübrâ’sında bulunan rivâyetleri derlemiştir."},{"k":"n","n":3,"x":"Bûsırî’nin İthâfü’s-sâdeti’l-mehereti’l-hıyere bi-zevâidi’l-mesânîdi’l-aşere’si. Eser, şu 10 müsnedin Kütüb-i Sitte’ye zevâididir: Müsned-i Ebî Dâvûd et-Tayâlisî, Müsnedü’l-Humeydî, Müsned-i Müsedded b. Müserhed, Müsned-i Muhammed b. Yahyâ el-Adenî, Müsned-i İshak b. Râhûyeh, Müsned-i Ebî Bekr b. Ebî Şeybe, Müsned-i Ahmed b. Menî’, Müsned-i Abd b. Humeyd, Müsnedü’l-Hâris b. Muhammed b. Ebî Üsâme, Müsned-i Ebî Ya’lâ el-Mevsılî. Bûsırî bu eserinde, Kütüb-i Sitte’de bulunmayıp mezkûr 10 eserde bulunan rivâyetleri (zâidleri) bir araya getirmiştir."},{"k":"n","n":4,"x":"el-Hâfız Ahmed b. Ali b. Hacer el-Askalânî’nin (ö.852/1448) el-Metâlibü’l-âliye bi-zevâidi’l-mesânîdi’s-semâniye’si. Eser; Müsned-i Ebî Ya’lâ el-Mevsılî ve Müsned-i İshak b. Râhûyeh dışında bir önceki maddede zikredilen 8 müsnedin, Kütüb-i Sitte ve Ahmed b. Hanbel’in Müsned’ine zevâididir. İbn Hacer el-Askalânî bu eserinde, Kütüb-i Sitte’de ve Ahmed b. Hanbel’in Müsned’inde bulunmayıp mezkûr 8 müsnedde bulunan rivâyetleri toplamıştır. Bu kadarla yetinmeyen İbn Hacer, Heysemî’nin Mecmau’z-zevâid adlı eserinde Müsned-i Ebî Ya’lâ için tespit ettiği zâidlerden gözünden kaçanları da zikretmiştir."},{"k":"n","n":5,"x":"el-Hâfız Ali b. Ebî Bekr el-Heysemî’nin (ö.807/1404) Mecmau’z-zevâid ve menbau’l-fevâid’i. Eser; Müsned-i Ahmed b. Hanbel, Müsned-i Ebî Ya’lâ el-Mevsılî, Müsned-i Ebî Bekr el-Bezzâr ve Meâcimü’t-Taberânî es-Selâse (kebîr, evsat, sağîr)’nin Kütüb-i Sitte’ye zevâididir. Heysemî bu eserinde, Kütüb-i Sitte’de bulunmayıp mezkûr 6 eserde bulunan rivâyetleri derlemiştir. Hadisler hakkında hükümler vermiştir."},{"k":"dikkat","x":"Zevâid’den nakilde bulunuluyorsa; Heysemî’nin hadisler hakkında verdiği hükümler mutlaka hadis tahricinde belirtilmelidir."},{"k":"tbl","r":[["Zevâid eseri","Müellif","Neyin neye zevâidi?"],["**Misbâhu’z-zücâce**","Bûsırî (840)","İbn Mâce’nin diğer Kütüb-i Sitte’ye"],["**Fevâidü’l-müntekâ**","Bûsırî","Beyhakî’nin Sünen-i Kübrâ’sının Kütüb-i Sitte’ye"],["**İthâfü’s-sâdeti’l-mehere**","Bûsırî","10 müsnedin Kütüb-i Sitte’ye"],["**el-Metâlibü’l-âliye**","İbn Hacer (852)","8 müsnedin Kütüb-i Sitte ve Müsned’e"],["**Mecmau’z-zevâid**","Heysemî (807)","Ahmed, Ebû Ya’lâ, Bezzâr ve Taberânî’nin 3 mu’ceminin Kütüb-i Sitte’ye"]]}]},{"h":"Miftâhu Künûzi’s-Sünne","b":[{"k":"p","x":"Müsteşrik **A. J. Wensinck** tarafından İngilizce olarak hazırlanmış, **Muhammed Fuad Abdülbâkî** tarafından Arapça’ya çevrilmiştir."},{"k":"p","x":"Kitap, alfabetik olarak ana konu ve şahıs isimlerini, sonra da bu ana konunun tâlî bahislerini vermekte ve her defasında da ihtiva ettiği 14 kitaptan hangilerinin nerelerinde o konuyu bulmak mümkünse, remizlerle ve rakamlarla işâret etmektedir."},{"k":"li","x":"Konu esasına göre hazırlanmış olan bir çalışma olup, her ana konunun altında onunla ilgili olan tâlî konular yer almakta ve her tâlî konunun altında da 14 kitapta yer alan ilgili hadisler ve âsâr verilmektedir."},{"k":"h","x":"İhtiva ettiği kitaplar ve remizleri"},{"k":"tbl","r":[["Kitap","Remiz"],["**Sahîhu’l-Buhârî**","«بخ»"],["**Sahîh-i Müslim**","«مس»"],["**Sünen-i Ebî Dâvûd**","«بد»"],["**Sünenü’t-Tirmizî**","«تر»"],["**Sünenü’n-Nesâî**","«نس»"],["**Sünen-i İbn Mâce**","«مج»"],["**Sünenü’d-Dârimî**","«مي»"],["**Mâlik’in Muvatta’ı**","«ما»"],["**Müsned-i Ahmed b. Hanbel**","«حم»"],["**Müsnedü’t-Tayâlisî**","«ط»"],["**Sîret-i İbn Hişâm**","«هش»"],["**Tabakât-ı İbn Sa’d**","«عد»"],["**Meğâzi’l-Vâkıdî**","«قد»"],["**Müsned-i Zeyd b. Ali**","«ز»"]]},{"k":"p","x":"Ayrıca «ك» ile kitab’a, «ب» ile bâb’a, «ح» ile hadis’e, «ص» ile sayfa’ya, «ج» ile cüz’e (cilde), «ق» ile kısım’a işâret edilmiştir. «قا» işâretiyle de “baş kısmıyla son kısmını karşılaştır” denmek istenmiştir. Rakamların sol tarafında görülecek üç küçük mim harfi ile de hadisin defâlarca tekerrür ettiğine; sayıların sol üst köşesindeki rakamlarla da o hadisin o sayfa ya da bâbta o kadar tekerrür ettiğine işâret edilmiştir."},{"k":"h","x":"Rakamların anlamı"},{"k":"p","x":"Bu 14 kitap için verilen rakamlar hepsi için aynı şeyi ifâde etmezler. Bu açıdan da bu kitapların şöyle gruplandığı görülmektedir:"},{"k":"n","n":1,"x":"Kitab ve hadis numarası verilenler: Müslim, Muvatta’, Tayâlisî’nin Müsned’i, Zeyd b. Ali’nin Müsned’i."},{"k":"n","n":2,"x":"Kitab ve bâb numaraları verilenler: Buhârî, Ebû Dâvûd, Tirmizî, Nesâî, İbn Mâce, Dârimî’nin kitaplarıdır."},{"k":"n","n":3,"x":"Cilt ve sayfa numaraları verilenler: Ahmed b. Hanbel’in Müsned’i, İbn Sa’d’ın Tabakât’ı, İbn Hişâm’ın Sîre’si ve Vâkıdî’nin Meğâzî’sidir."},{"k":"h","x":"Miftâhu Künûzi’s-Sünne’den yararlanırken izlenecek yöntem"},{"k":"steps","x":["Elimizde bulunan hadis metninin konusu tespit edilir. Örneğin, hadisimiz ‘altının zekâtı’ ile ilgili olsun.","Eserden «ز» harfine gelinerek zekât ana başlığı bulunur. Buradan altının zekâtı alt başlığına ulaşılır ve «بد ك 9 ب 4» ibaresi görülür. Böylece aradığımız hadisin Ebû Dâvûd (9. kitab 4. bab)’da geçtiği öğrenilmiş olur.","Daha sonra çizelgeden zekât kitabının Ebû Dâvûd’da hangi cilt ve sayfada bulunduğu tespit edilir.","Ebû Dâvûd’da hadise ulaşıldıktan sonra ilgili ifâde kullanılır."]},{"k":"ar","a":"أَخْرَجَهُ أَبُو دَاوُدَ فِي كِتَابِ الزَّكَاةِ، بَابِ: 4. مِثْلَهُ.","x":""}]}],"ht":[{"s":0,"x":"Dördüncü yolda önce hadisin konusu tespit edilir; hadis birden çok konuyla ilgiliyse hepsinden aranır."},{"s":0,"x":"Konuya göre eserler 3 kısım: bütün konular · çoğu konu · belli bir konu."},{"s":1,"x":"Câmi’in 8 bölümü: iman, ahkâm, zühd, âdâb, tefsir, târih-siyer-cihad, menâkıb, fiten ve melâhim. Biri eksikse câmi’ olmaz."},{"s":1,"x":"Buhârî, Müslim ve Tirmizî’nin kitaplarının adı el-Câmiu’s-sahîh’tir."},{"s":2,"x":"Buhârî’nin Sahîh’i: 600.000 hadis arasından seçme; 97 kitab, 3730 bâb (Concordance’a göre); mükerrerlerle 7275 (veya 9082) hadis. Bed’ü’l-vahy ile başlar, Tevhîd ile biter. Zayıf hadis yoktur."},{"s":2,"x":"Buhârî bir hadisi farklı bablarda bölerek, her seferinde farklı senedle verir."},{"s":3,"x":"Müstahrec: önceki bir kitabın hadislerini musannifin senedinden başka bir senedle rivayet edip onun şeyhinde veya daha yukarıda birleşmek. Faydası: ğarib hadis kuvvet, sahih hadis âlî isnad kazanır."},{"s":3,"x":"Müstahrecin şartı: en yakına ulaştıran senedi kaybetmemek için daha uzak şeyhe ulaşmamak (âlî sened ve önemli ziyade hariç)."},{"s":3,"x":"Ebû Avâne’nin Müstahrec’i (Müslim üzerine): 5 cilt, 8.718 rivâyet; dipnotta Müslim’deki numara."},{"s":4,"x":"Müstedrek: önceki musannifin şartına uygun olup eserine almadığı hadisleri toplayan eser. Sahîhayn’e 8-10 kadar müstedrek yazılmıştır."},{"s":5,"x":"el-Müstedrek: Hâkim (405); 8803 rivâyet, 4 cilt + tek ciltlik fihrist; Sahîhayn’in tertibini izler. Hâkim mütesâhildir; Zehebî’nin Telhîsü’l-Müstedrek’ine bakılır."},{"s":5,"x":"Zehebî’ye göre Müstedrek: yarıya yakını sahih, dörtte biri senedi sağlam metni illetli, dörtte biri münker ve zayıf. «وافقه» = onayladı; «سكت عنه» = hüküm vermedi."},{"s":5,"x":"Hâkim’in 3 grubu: Şeyhayn’in (ya da birinin) şartına uygun · kendisine göre sahih · destek mahiyetinde zayıf (şâhit ve mütâbi’)."},{"s":6,"x":"Mecma’lar: Sâğânî’nin Meşâriku’l-envâr’ı ve Humeydî’nin el-Cem’u beyne’s-Sahîhayn’i (Sahîhayn); Rezîn’in et-Tecrîd’i (İbn Mâce yerine Muvatta’); İbnü’l-Esîr’in Câmiu’l-usûl’ü; Rudânî’nin Cem’u’l-fevâid’i (14 kitap)."},{"s":6,"x":"Câmiu’l-usûl’ün özeti İbnü’d-Deyba’ın Teysîru’l-vusûl’üdür; Türkçesi İbrahim Canan. Cem’u’l-fevâid’in Türkçesi Büyük Hadis Külliyâtı (Naim Erdoğan)."},{"s":7,"x":"Zevâid: bir kitabın diğerinden fazla olan hadislerini toplar; aynı anda birçok kitap taranmış olur (Mecmau’z-zevâid’de 12 eser)."},{"s":7,"x":"Bûsırî’nin zevâidleri: Misbâhu’z-zücâce (İbn Mâce), Fevâidü’l-müntekâ (Beyhakî), İthâfü’s-sâdeti’l-mehere (10 müsned)."},{"s":7,"x":"el-Metâlibü’l-âliye: İbn Hacer, 8 müsned. Mecmau’z-zevâid: Heysemî, 6 eser (Ahmed, Ebû Ya’lâ, Bezzâr, Taberânî’nin 3 mu’cemi); Heysemî’nin hükümleri tahricte mutlaka belirtilir."},{"s":8,"x":"Miftâhu Künûzi’s-Sünne: Wensinck İngilizce hazırladı, Fuad Abdülbâkî Arapçaya çevirdi; konuya göre alfabetik, 14 kitap."},{"s":8,"x":"Miftâh remizleri: «بخ» Buhârî, «مس» Müslim, «بد» Ebû Dâvûd, «تر» Tirmizî, «نس» Nesâî, «مج» İbn Mâce, «مي» Dârimî, «ما» Muvatta’, «حم» Ahmed, «ط» Tayâlisî, «هش» İbn Hişâm, «عد» İbn Sa’d, «قد» Vâkıdî, «ز» Zeyd b. Ali."},{"s":8,"x":"Miftâh’ta rakamlar: Müslim, Muvatta’, Tayâlisî, Zeyd b. Ali → kitab + hadis; Buhârî, Ebû Dâvûd, Tirmizî, Nesâî, İbn Mâce, Dârimî → kitab + bâb; Ahmed, İbn Sa’d, İbn Hişâm, Vâkıdî → cilt + sayfa."},{"s":8,"x":"Dikkat: Concordance’ta «ط» Muvatta’dır; Miftâhu Künûzi’s-Sünne’de «ط» Tayâlisî, «ما» Muvatta’dır."}],"oz":{"t":"Dördüncü Yol (1): Bütün Konuları İçeren Eserler · Özet","intro":"Dördüncü fasıl: hadisin konusunu bilme yoluyla tahric. Konuya göre kitaplar üç kısımdır; A) bütün bablar üzerine olanlar.","s":[{"h":"Dördüncü Fasıl: Dördüncü Yol","b":[{"k":"ar","a":"الطَّرِيقَةُ الرَّابِعَةُ: التَّخْرِيجُ عَنْ طَرِيقِ مَعْرِفَةِ مَوْضُوعِ الْحَدِيثِ.","x":"Hadisin konusunu bilme yoluyla tahric yapmak."},{"k":"ar","a":"الْكُتُبُ عَلَى حَسَبِ مَوْضُوعِ الْحَدِيثِ ثَلَاثَةُ أَقْسَامٍ:","x":"Hadisin konusuna göre kitaplar üç kısımdır."},{"k":"tbl","r":[["Kısım","Arapça"],["**A**","«على جميع الأبواب»"],["**B**","«على أبواب الفقه»"],["**C**","«على جانب الدين»"]]}]},{"h":"A) Bütün Bablar Üzerine","b":[{"k":"ar","a":"عَلَى جَمِيعِ الْأَبْوَابِ","x":""},{"k":"tbl","r":[["Tür","Örnekler"],["**1. «الجوامع»**","«بخاري، مسلم، ترمذي»"],["**2. «المستخرج»**","«الإسماعيلي على بخاري، أبو عوانة على مسلم، أبو نعيم عليهما معا»"],["**3. «المستدركات»**","«المستدرك على الصحيحين للحاكم»"],["**4. «المجاميع»**","«مشارق الأنوار للصاغاني، يجمع بين الصحيحين؛ جامع الأصول لابن الأثير، يجمع بين الأصول الستة؛ جمع الفوائد للمغربي، يجمع الكتب التسعة ومسندي أبي يعلى والبزار ومعاجم الطبراني الثلاثة (الكبير، الأوسط، الصغير)»"],["**5. «الزوائد»**","«مصباح الزجاجة للبوصيري يحتوي زيادات ابن ماجه على باقي كتب الستة؛ مجمع الزوائد للحافظ الهيثمي يحتوي زيادات معاجم (الكبير، الأوسط، الصغير) الطبراني ومسانيد أبي يعلى وأبي بكر البزار وأحمد بن حنبل على كتب الستة»"],["**6. «مفتاح كنوز السنة»**","«مفتاح كنوز السنة»"]]},{"k":"not","x":"Câmi’ler, bütün hadisleri toplayan kitaplardır; Mecâmi’ler ise hadis kitaplarını bir araya getiren eserlerdir."},{"k":"p","x":"(Miftâhu Künûzi’s-Sünne kitabı Concordance yazarı Wensinck tarafından yazılmıştır. Aralarındaki fark: diğeri ilk lafza göre, bu hadisin konusuna göre yazılmıştır; diğeri Fransızca, bu İngilizce basılmıştır; diğeri Kütüb-i Tis’a, bu 14 kitap içerir; bu ricâl hakkında bilgi verir.)"},{"k":"tbl","r":[["","Concordance","Miftâhu Künûzi’s-Sünne"],["**Esas**","Lafız","Hadisin konusu"],["**Dil**","Fransızca","İngilizce"],["**Kapsam**","Kütüb-i Tis’a","14 kitap; ricâl hakkında bilgi verir"]]}]}]}},{"t":"Dördüncü Yol (2): Konuların Çoğunu İçeren Eserler","intro":"İkinci kısım: fıkhî konulara göre bablar üzerine tertip edilmiş eserler; sünenler, musannefler, muvatta’lar ve bunlar üzerine yazılan müstahrecler.","s":[{"h":"İkinci Kısım: Fıkhî Konuları İçine Alan Eserler","b":[{"k":"li","x":"Bu kısım, bablar üzerine tertip edilmiş, özellikle fıkıh konularını ele alan eserlerden oluşur. Genellikle taharetle başlar; namaz, ibadet, muamelat ve diğer fıkhî ahkâmı ele alırlar. Bazen iman, âdâb gibi konulara da yer verdikleri oluyor. Bu 2. kısımda şu eserlere değinilmiştir:"},{"k":"li","x":"Sünenler, Muvatta’lar, Musannefler, Müstahrecler."},{"k":"tbl","r":[["Eser türü","İçerdiği rivâyetler"],["**Sünen**","Çoğunlukla merfu’; mevkuf ve maktu’ yok denecek kadar az"],["**Musannef**","Merfu’, mevkuf ve maktu’ (sahâbe sözleri, tâbiûn fetvâları, bazen etbâu’t-tâbiîn fetvâları)"],["**Muvatta’**","Merfu’, mevkuf ve maktu’; isimleri farklı olsa da musannefler gibi"],["**Müstahrec**","Sünen, musannef ve muvatta’lar üzerine yazılmış eserler"]]}]},{"h":"Sünenler","b":[{"k":"d","t":"Sünen","x":"Hadis literatüründe, fıkhî konulara göre tertib edilmiş kitaplara sünen denir."},{"k":"p","x":"Sünenlerde çoğunlukla merfu’ rivâyetler yer almaktadır. Mevkuf ve maktu’ rivâyetler yok denecek kadar azdır. Bu yönleriyle musanneflerden ayrılırlar."},{"k":"dikkat","x":"**Kettânî**, bu kitaplarda mevkuf hadisin bulunmadığını söylerken, **Mahmud Tahhân** ise konuyla ilgili olarak şunu ifâde etmektedir: Bazı sünenlerde merfu’ hadislerin dışında başka hadisler de bulunmaktadır. Ancak bu, musannef ve muvatta’lara kıyasla gerçekten azdır."},{"k":"h","x":"Sünenlerden bazı örnekler"},{"k":"p","x":"Sünen tarzı yazılan eserler çoktur. Bunlardan en meşhur olanlar şunlardır:"},{"k":"n","n":1,"x":"Ebû Dâvûd’un (ö.275) Sünen’i."},{"k":"n","n":2,"x":"Nesâî’nin (ö.303) Sünen’i (el-Müctebâ)."},{"k":"n","n":3,"x":"İbn Mâce’nin (ö.273) Sünen’i."},{"k":"n","n":4,"x":"İmam Şâfiî’nin (204) Sünen’i."},{"k":"n","n":5,"x":"Dârimî’nin (ö.255) Sünen’i."},{"k":"n","n":6,"x":"Dârekutnî’nin (ö.385) Sünen’i."},{"k":"n","n":7,"x":"Beyhakî’nin (ö.384/994) Sünen’i."},{"k":"h","x":"Ebû Dâvûd’un Sünen’i"},{"k":"p","x":"Ebû Dâvûd’un (ö.275) Sünen’i 40 kitaptan oluşur. Önce kitap numarası verilir. Sonra kitap ismi verilir. Birinci kitap “Taharet kitabı”yla başlar, kırkıncı kitap “Edeb”le biter. Genelde, bâb başlıkları altında oldukça az hadise yer verir. Bâb başlıkları kısadır. Gerekli gördüğü yerde şahıs tanıtımı yapar. Zayıf hadisleri belirtirken gerekçe zikreder. Mekânlar hakkında bilgi verir. Hadisin sebeb-i vürûdunu bildirir. Ebû Dâvûd’un Sünen’i hadis kitaplarının ikinci tabakasına dâhildir."}]},{"h":"Musannefler","b":[{"k":"d","t":"Musannef","x":"Bütün fıkhî konulara ait merfu’, mevkuf ve maktu’ rivâyetleri içeren hadis kitaplarına musannef denir."},{"k":"p","x":"Bu eserlerde Hz. Peygamber’in hadisleri, sahâbe sözleri, tâbiûn fetvâları bulunmakla birlikte bazen de etbâu’t-tâbiîn fetvâlarına rastlanmaktadır."},{"k":"dikkat","x":"Musannef-sünen farkı: Musannefler merfu’, mevkuf ve maktu’ hadisleri kapsar. Sünenler ise sadece merfu’ hadisleri kapsar. Çünkü mevkuf ve maktu’ onların ıstılahında sünen olarak isimlendirilmez."},{"k":"h","x":"Musanneflerden bazı örnekler"},{"k":"n","n":1,"x":"Muhammed b. Ebî Şeybe’nin (ö.235) Musannef’i."},{"k":"n","n":2,"x":"Abdürrezzak b. Hemmâm es-San’ânî’nin (211) Musannef’i."},{"k":"n","n":3,"x":"Bakî b. Mahled el-Kurtubî’nin (ö.276) Musannef’i."},{"k":"n","n":4,"x":"Ebû Süfyan Vekî’ b. el-Cerrâh el-Kûfî’nin (ö.196) Musannef’i."},{"k":"n","n":5,"x":"Ebû Seleme Hammâd b. Seleme el-Basrî’nin (ö.167) Musannef’i."}]},{"h":"Muvatta’lar","b":[{"k":"d","t":"Muvatta’ (lügat)","x":"Kolaylaştırılmış, ezilmiş, çiğnenmiş, uygun görülmüş gibi mânâlara gelir."},{"k":"d","t":"Muvatta’ (ıstılah)","x":"Fıkhî konulara göre tertib edilmiş kitaplara verilen isimdir."},{"k":"p","x":"Merfu’, mevkuf, maktu’ hadisleri kapsamına alır. Bu yönüyle isimleri farklı olsa da, aynı musannefler gibidir. Bu kitaplarda az ve öz rivâyetler bulunmaktadır."},{"k":"sc","q":"Muvatta’ diye neden isimlendirildi?","x":"Çünkü müellifi onu insanlara kolaylaştırdı."},{"k":"h","x":"Muvatta’lardan bazı örnekler"},{"k":"n","n":1,"x":"İmam Mâlik’in (ö.179) Muvatta’ı."},{"k":"n","n":2,"x":"Muhammed b. Abdurrahman el-Medenî’nin (158) Muvatta’ı."},{"k":"n","n":3,"x":"Mervezî’nin (293) Muvatta’ı."}]},{"h":"İkinci Kısım Üzerine Müstahrecler","b":[{"k":"p","x":"Bu ikinci kısımda anlatılan (sünenler, musannefler ve muvatta’lar) eserler üzerine yazılmış, derlenmiş eserlerdir (Müellif bunu burada ayrıca zikretmiş, Buhârî, Müslim üzerine yazılmış olanlarla karıştırmayalım). Kitapta geçen tek müstahrec örneği şudur (o da olmasaydı ne iyi olurdu!..?):"},{"k":"li","x":"Kâsım b. Esbağ’ın Müstahrec’i (Sünen-i Ebû Dâvûd üzerine)."}]}],"ht":[{"s":0,"x":"İkinci kısım: fıkıh bablarına göre tertip edilen eserler; genellikle taharetle başlar. Sünenler, musannefler, muvatta’lar, müstahrecler."},{"s":1,"x":"Sünen: fıkhî konulara göre tertib; çoğunlukla merfu’. Kettânî’ye göre mevkuf yok; Tahhân’a göre bazılarında var ama musannef ve muvatta’lara göre az."},{"s":1,"x":"Ebû Dâvûd’un Sünen’i: 40 kitap, Taharet ile başlar, Edeb ile biter; bâb başlıkları kısa, az hadis; zayıfı gerekçesiyle belirtir; sebeb-i vürûdu bildirir. Hadis kitaplarının ikinci tabakası."},{"s":1,"x":"Nesâî’nin Sünen’i: el-Müctebâ."},{"s":2,"x":"Musannef: merfu’, mevkuf ve maktu’ rivâyetleri içerir. Sünen yalnızca merfu’dur; mevkuf ve maktu’ onların ıstılahında sünen sayılmaz."},{"s":2,"x":"Musannefler: İbn Ebî Şeybe (235), Abdürrezzak (211), Bakî b. Mahled (276), Vekî’ b. el-Cerrâh (196), Hammâd b. Seleme (167)."},{"s":3,"x":"Muvatta’: lügatte kolaylaştırılmış; müellifi onu insanlara kolaylaştırdığı için bu adı aldı. Merfu’, mevkuf, maktu’ içerir; musannef gibidir, az ve öz rivâyet."},{"s":3,"x":"Muvatta’lar: İmam Mâlik (179), Muhammed b. Abdurrahman el-Medenî (158), Mervezî (293)."},{"s":4,"x":"İkinci kısım üzerine yazılan müstahrecin kitaptaki tek örneği: Kâsım b. Esbağ’ın Müstahrec’i (Sünen-i Ebû Dâvûd üzerine)."}],"oz":{"t":"Dördüncü Yol (2): Konuların Çoğunu İçeren Eserler · Özet","intro":"B) Fıkıh babları üzerine olanlar: sünenler, musannefler, muvatta’lar ve bunlar üzerine müstahrecler.","s":[{"h":"B) Fıkıh Babları Üzerine","b":[{"k":"ar","a":"عَلَى أَبْوَابِ الْفِقْهِ","x":""},{"k":"tbl","r":[["Tür","Örnekler"],["**1. «السنن»**","«أبو داود، النسائي، ابن ماجه، البيهقي، الدارقطني، الدارمي»"],["**2. «المصنفات»**","«ابن أبي شيبة، عبد الرزاق، حماد بن سلمة»"],["**3. «الموطآت»**","«الإمام مالك، ابن أبي ذئب، المروزي»"],["**4. «المستخرجات عليها»**","«المستخرجات على ما ذكر في القسم الثاني من الكتب وهي السنن والمصنفات والموطآت»"]]},{"k":"li","x":"**Sünenler** sadece **merfu’** hadisleri içerir."},{"k":"li","x":"**Musannefler merfu’, mevkuf ve maktu’** hadisleri içerir."},{"k":"li","x":"Muvatta’lar da musannefler gibidir, sadece isim farkı vardır. İmam Mâlik “ben kitabımı 70 âlime sundum ve onay aldım” demiştir."}]}]}},{"t":"Dördüncü Yol (3): Belli Bir Konuyu İçeren Eserler","intro":"Üçüncü kısım: dinin belli bir konusunu, cüzünü veya babını ele alan eserler; cüzler, terğîb-terhîb, zühd ve âdâb, ahkâm, müstakil konular, hadis dışı eserler, tahric kitapları ve şerhler.","s":[{"h":"Üçüncü Kısım","b":[{"k":"p","x":"Bu kısımda dinin belli bir konusunu, tarafını, cüzünü veya bir babını, bölümünü ele alan eserlere yer verilmiştir: Onlar da; cüzler, et-Terğîb ve’t-Terhîb, zühd, fezâil, âdâb ve ahlak, ahkâm, bazı has konuları ele alan eserler, diğer alanlarda yazılmış eserler, tahric eserleri, hadis şerhleri ve bunlara yapılan ta’likatlar vb. Şimdi bunları sırayla ele alalım."},{"k":"steps","x":["**Cüzler**","**et-Terğîb ve’t-Terhîb**","**Zühd, fezâil, âdâb ve ahlak**","**Ahkâm**","**Bazı müstakil konular**","**Hadis kitapları dışındaki çalışmalar**","**Tahric kitapları**","**Hadis şerhleri ve ta’likler**"]}]},{"h":"Cüzler (el-Eczâ’)","b":[{"k":"d","t":"Cüz","x":"Hadis literatüründe cüzler; küçük hacimli kitaplara verilen bir ad olup bünyelerinde şu iki husustan birini barındırırlar."},{"k":"n","n":1,"x":"Ya sahâbe veya tâbiînin birinden mervî rivâyetlerin toplanmasıyla oluşturulur. Samed et-Taberî’nin (ö.178) Cüz’ü mâ ravâhu Ebû Hanîfe ani’s-sahâbe’si gibi."},{"k":"n","n":2,"x":"Ya da, belli bir konuya ilişkin rivâyetlerin detaylı bir şekilde incelenmesi yoluyla oluşturulur. Buhârî’nin (ö.256) Cüz’ü ref’i’l-yedeyn fi’s-salâh ve Cüz’ü’l-kırâe halfe’l-imâm adlı eserleri."},{"k":"p","x":"Cüzlerde hadis araştırması, hadisleri toplanmış kişilerden herhangi bir sahâbî veya meşhur bir râvî vasıtasıyla rivayet edilen ya da elde mevcut cüz’ün konusuyla ilgili olan bir hadisin yerini bulmak amacıyla yapılır."},{"k":"tbl","r":[["Cüz türü","Örnek"],["**Bir sahâbî veya tâbiînin rivâyetleri**","Samed et-Taberî’nin Cüz’ü mâ ravâhu Ebû Hanîfe ani’s-sahâbe’si"],["**Belli bir konunun rivâyetleri**","Buhârî’nin Cüz’ü ref’i’l-yedeyn ve Cüz’ü’l-kırâe halfe’l-imâm’ı"]]}]},{"h":"et-Terğîb ve’t-Terhîb","b":[{"k":"d","t":"Terğîb ve terhîb","x":"Yapılması istenen
