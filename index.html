bir işi teşvik veya yapılmaması istenen bir işten sakındırma sadedinde vârid olan rivâyetleri toplamak suretiyle tertib edilen eserlerdir."},{"k":"ornek","x":"Ana babaya iyiliği teşvik eden, onlara karşı gelmekten sakındıran rivâyetlerin toplanması gibi."},{"k":"h","x":"Bu sahada yapılmış bazı çalışmalar"},{"k":"li","x":"İbn Şâhîn’in (ö.385) et-Terğîb ve’t-Terhîb’i."},{"k":"li","x":"el-Münzirî’nin (ö.656) et-Terğîb ve’t-Terhîb’i. Bu sahada yazılmış en meşhur eser budur."}]},{"h":"Zühd, Fezâil, Âdâb ve Ahlak","b":[{"k":"p","x":"Bu tür eserler, birtakım rivâyetleri, din büyüklerine ait sözleri derlemesi ve doyurucu bilgi aktarımında bulunması sebebiyle verimli birer kaynak konumundadır. Bu sahada kaleme alınmış pek çok eser mevcuttur."},{"k":"h","x":"Bu sahada yapılmış bazı çalışmalar"},{"k":"li","x":"İbn Ebi’d-Dünyâ’nın (ö.281) Kitâbu zemmi’l-gıybe, Kitâbu zemmi’l-hased, Kitâbu zemmi’d-dünyâ isimli eserleri."},{"k":"li","x":"Ebü’ş-Şeyh Ebû Muhammed Abdullah b. Muhammed el-İsfahânî’nin (ö.369) Kitâbu ahlâki’n-nebî’si."},{"k":"li","x":"İmam Ahmed b. Hanbel’in (ö.241) Kitâbü’z-zühd’ü."},{"k":"li","x":"Abdullah b. Mübârek’in (ö.181) Kitâbü’z-zühd ve’r-rekâik’i."},{"k":"li","x":"İmam Ebû Yusuf Ya’kub b. İbrahim’in (ö.182) Kitâbu’z-zikr ve’d-duâ’sı."},{"k":"li","x":"İmam Şâfiî’nin (204) Kitâbu fezâili’l-Kur’ân’ı."},{"k":"li","x":"Ebû Nuaym el-İsfahânî’nin (ö.430) Kitâbu fezâili’s-sahâbe’si."},{"k":"li","x":"İmam Nevevî’nin (ö.676) Riyâzü’s-sâlihîn min kelâmi seyyidi’l-mürselîn ve el-Ezkâr isimli eserleri."},{"k":"tbl","r":[["Eser","Müellif"],["**Kitâbu zemmi’l-gıybe / zemmi’l-hased / zemmi’d-dünyâ**","İbn Ebi’d-Dünyâ (281)"],["**Kitâbu ahlâki’n-nebî**","Ebü’ş-Şeyh el-İsfahânî (369)"],["**Kitâbü’z-zühd**","Ahmed b. Hanbel (241)"],["**Kitâbü’z-zühd ve’r-rekâik**","Abdullah b. Mübârek (181)"],["**Kitâbu’z-zikr ve’d-duâ**","Ebû Yusuf (182)"],["**Kitâbu fezâili’l-Kur’ân**","Şâfiî (204)"],["**Kitâbu fezâili’s-sahâbe**","Ebû Nuaym el-İsfahânî (430)"],["**Riyâzü’s-sâlihîn · el-Ezkâr**","Nevevî (676)"]]}]},{"h":"Ahkâm Kitapları","b":[{"k":"d","t":"Ahkâm kitapları","x":"Sadece ahkâm ile ilgili rivâyetleri bünyelerinde barındıran eserlerdir."},{"k":"p","x":"Bu tür kitapları kaleme alan müellifler rivâyetlerini temel hadis kaynaklarından seçmişler ve onları fıkhî bâblara göre tertib etmişlerdir. Bu sahada da pek çok eser te’lif edilmiştir."},{"k":"h","x":"Bu sahada yapılmış bazı çalışmalar"},{"k":"li","x":"Ebû Muhammed Abdülhak b. Abdurrahmân el-İşbîlî’nin (ö.581) el-Ahkâmü’l-kübrâ ve el-Ahkâmü’s-suğrâ’sı."},{"k":"li","x":"Abdülğanî b. Abdilvâhid el-Makdisî’nin (ö.600) el-Ahkâm ve Umdetü’l-ahkâm an seyyidi’l-enâm isimli eserleri."},{"k":"li","x":"İbn Dakîk’in (Muhammed b. Ali) (ö.702) el-İmâm fî ehâdîsi’l-ahkâm ve el-İlmâm bi-ehâdîsi’l-ahkâm (el-İmâm’ın özeti) isimli eserleri."},{"k":"li","x":"Abdüsselâm b. Abdullah b. Teymiyye el-Harrânî’nin (ö.652) el-Müntekâ fi’l-ahkâm’ı. Bu eseri İmam Şevkânî (ö.1255/1839) Neylü’l-evtâr isimli eseriyle şerh etmiştir."},{"k":"li","x":"İbn Hacer el-Askalânî’nin (ö.852) Bulûğu’l-merâm min edilleti’l-ahkâm’ı. Bu eserin en meşhur şerhi Emîr San’ânî’nin Sübülü’s-selâm’ıdır."},{"k":"li","x":"İbnü’l-Mülakkin’in el-İ’lâm bi-fevâidi Umdeti’l-ahkâm’ı."},{"k":"tbl","r":[["Ahkâm eseri","Müellif","Şerhi / özeti"],["**el-Ahkâmü’l-kübrâ · el-Ahkâmü’s-suğrâ**","Abdülhak el-İşbîlî (581)","—"],["**el-Ahkâm · Umdetü’l-ahkâm**","Abdülğanî el-Makdisî (600)","İbnü’l-Mülakkin’in el-İ’lâm’ı (Umde üzerine)"],["**el-İmâm · el-İlmâm**","İbn Dakîk (702)","el-İlmâm, el-İmâm’ın özeti"],["**el-Müntekâ fi’l-ahkâm**","Abdüsselâm b. Teymiyye (652)","Şevkânî’nin Neylü’l-evtâr’ı"],["**Bulûğu’l-merâm**","İbn Hacer (852)","San’ânî’nin Sübülü’s-selâm’ı"]]}]},{"h":"Bazı Müstakil Konular","b":[{"k":"p","x":"Bazı müstakil konular (ihlas, cihad v.b.): Bazı müellifler sadece bir konuya yoğunlaşarak kitaplar te’lif ettiler. Ele aldıkları konuyu bütün yönleriyle değerlendirdiler. Konuya ilişkin pek çok rivâyet neşrettiler. Bu tür kitaplar dikkat ve titizlikle kaleme alınmış kıymetli eserlerdir. Bu sahada incelemede bulunmak isteyenler, meşhur hadis eserlerinde bulamadıkları rivâyet ve kelâm-ı kibâra bu tür eserlere bakarak ulaşabilir ve öğrenebilirler."},{"k":"h","x":"Bu sahada yapılmış bazı çalışmalar"},{"k":"li","x":"İbn Ebi’d-Dünyâ’nın (ö.281) Kitâbü’l-ihlâs’ı."},{"k":"li","x":"Ebû Bekr Ahmed b. Hüseyin el-Beyhakî’nin (ö.458) Kitâbü’l-esmâ ve’s-sıfât’ı."},{"k":"li","x":"Ebû İsmâil Abdullah b. Muhammed el-Ensârî el-Herevî’nin (ö.481) Kitâbu zemmi’l-kelâm’ı."},{"k":"li","x":"Ebû Abdullah Nuaym b. Hammâd el-Mervezî’nin (ö.228) Kitâbü’l-fiten ve’l-melâhim’i."},{"k":"li","x":"Abdullah b. Mübârek el-Mervezî’nin (ö.181) Kitâbü’l-cihâd’ı. Cihad ile ilgili ilk eser te’lif eden bu âlimdir."},{"k":"tbl","r":[["Eser","Müellif"],["**Kitâbü’l-ihlâs**","İbn Ebi’d-Dünyâ (281)"],["**Kitâbü’l-esmâ ve’s-sıfât**","Beyhakî (458)"],["**Kitâbu zemmi’l-kelâm**","Herevî (481)"],["**Kitâbü’l-fiten ve’l-melâhim**","Nuaym b. Hammâd (228)"],["**Kitâbü’l-cihâd**","Abdullah b. Mübârek (181)"]]}]},{"h":"Hadis Kitapları Dışındaki Çalışmalar","b":[{"k":"p","x":"Hadis kitapları dışındaki diğer çalışmalar (tefsir, fıkıh, târih v.b.): Bunlar; hadis ilminin dışında tefsir, fıkıh, târih gibi farklı ilim dallarında te’lif edilmiş eserlerdir. Ne var ki konumları gereği içlerinde pek çok rivâyet vârid olmuştur. Bu türden tasnif edilen eserleri iki grupta değerlendirebiliriz:"},{"k":"n","n":1,"x":"Başka bir kitaptan alınmaksızın içindeki hadislerin senedli olarak rivâyet edildiği eserler."},{"k":"n","n":2,"x":"İçindeki hadislerin senedsiz olarak rivâyet edilip daha sonra bunların hangi aslî kaynak tarafından tahric edildiğine işâret eden eserler."},{"k":"dikkat","x":"Şayet eser hem senedsiz oluşturulmuş hem de aslî kaynakta kimin tahric ettiği belirtilmemişse, bunun yarar sağlamaktan uzak olduğu açıktır."},{"k":"h","x":"Bu sahada yapılmış bazı çalışmalar"},{"k":"li","x":"Ebû Ca’fer Muhammed b. Cerîr et-Taberî’nin (ö.310) Câmiu’l-beyân an te’vîli âyi’l-Kur’ân’ı."},{"k":"li","x":"Ebü’l-Fidâ İsmail b. Ömer el-Kureşî ed-Dımeşkî (İbn Kesîr)’nin (ö.774) Tefsîru’l-Kur’âni’l-azîm’i."},{"k":"li","x":"Süyûtî’nin (ö.911) ed-Dürrü’l-mensûr fi’t-tefsîr bi’l-me’sûr’u."},{"k":"li","x":"İmam Nevevî’nin (ö.676) el-Mecmû’u. Şâfiî fıkhına dâir kaleme aldığı eser Şîrâzî’nin (ö.476) el-Mühezzeb isimli eserinin şerhidir."},{"k":"li","x":"Ebû Muhammed Abdullah b. Ahmed b. Kudâme el-Makdisî’nin (ö.620) el-Muğnî’si. Hanbelî fıkhına dair kaleme aldığı eser Hırakî’nin Muhtasar’ının şerhidir."},{"k":"tbl","r":[["Eser","Müellif","Not"],["**Câmiu’l-beyân**","Taberî (310)","Tefsir"],["**Tefsîru’l-Kur’âni’l-azîm**","İbn Kesîr (774)","Tefsir"],["**ed-Dürrü’l-mensûr**","Süyûtî (911)","Tefsir"],["**el-Mecmû’**","Nevevî (676)","Şâfiî fıkhı; Şîrâzî’nin el-Mühezzeb’inin şerhi"],["**el-Muğnî**","İbn Kudâme (620)","Hanbelî fıkhı; Hırakî’nin Muhtasar’ının şerhi"]]}]},{"h":"Tahric Kitapları","b":[{"k":"p","x":"Müelliflerin, incelemeye aldıkları kitaplardaki hadislerin tahriclerini yaparak oluşturdukları eserlerdir. Bu eserler, tahricleri yapılan kitapların konularına göre çeşitlilik arz eder. Tefsir, fıkıh, lügat vb. kitapların içinde bulunan rivâyetler incelenmiş, tahricleri yapılarak sıhhat dereceleri belirlenmeye çalışılmıştır."},{"k":"h","x":"Bu sahada yapılmış bazı çalışmalar"},{"k":"li","x":"Hâfız Ebû Muhammed Abdullah b. Yusuf ez-Zeylaî’nin Tahrîcü ehâdîsi’l-Keşşâf ve Nasbu’r-râye li-ehâdîsi’l-Hidâye isimli eserleri."},{"k":"li","x":"İbn Hacer el-Askalânî’nin Telhîsü’l-habîr fî tahrîci ehâdîsi şerhi’l-Vecîzi’l-kebîr’i."},{"k":"li","x":"Süyûtî’nin Menâhilü’s-safâ fî tahrîci ehâdîsi’ş-Şifâ’sı. Yine Felkü’l-ısbâh fî tahrîci ehâdîsi’s-Sıhâh eseri."},{"k":"li","x":"Irâkî’nin el-Muğnî an hamli’l-esfâr fi’l-esfâr fî tahrîci mâ fi’l-İhyâ mine’l-ahbâr’ı."}]},{"h":"Hadis Şerhleri ve Ta’likler","b":[{"k":"p","x":"Hadis şerhleri ve bunlara yapılan ta’lik çalışmaları: Şârihler, eserlerinde rivâyetlere açıklık getirmelerinin yanında tahricte bulunmayı da ihmal etmemişlerdir. Bundan dolayı bu eserlerden tahric kaynağı olma yönüyle de istifâde edilmiştir."},{"k":"h","x":"Bu sahada yapılmış bazı çalışmalar"},{"k":"li","x":"İbn Hacer el-Askalânî’nin Fethü’l-bârî bi-şerhi Sahîhi’l-Buhârî’si."},{"k":"li","x":"Kâdi’l-kudât Ebû Muhammed Mahmud b. Ahmed el-Aynî’nin (ö.855) Umdetü’l-kârî şerhu Sahîhi’l-Buhârî’si."},{"k":"li","x":"Ebü’l-Feyz Muhammed Murtazâ ez-Zebîdî’nin (ö.893) İthâfü’s-sâdeti’l-müttakîn’i. (İhyâ’nın şerhidir)"},{"k":"li","x":"İbnü’l-Hümâm’ın Fethu’l-kadîr’i (Hidâye’nin şerhidir)."},{"k":"tbl","r":[["Şerh","Şârih","Şerh edilen eser"],["**Fethü’l-bârî**","İbn Hacer","Sahîh-i Buhârî"],["**Umdetü’l-kârî**","Aynî (855)","Sahîh-i Buhârî"],["**İthâfü’s-sâdeti’l-müttakîn**","Murtazâ ez-Zebîdî","İhyâ"],["**Fethu’l-kadîr**","İbnü’l-Hümâm","Hidâye"]]}]}],"ht":[{"s":0,"x":"Üçüncü kısım (belli bir konu) 8 tür: cüzler, terğîb-terhîb, zühd-fezâil-âdâb, ahkâm, müstakil konular, hadis dışı eserler, tahric kitapları, şerhler."},{"s":1,"x":"Cüz: küçük hacimli kitap; ya bir sahâbî/tâbiînin rivâyetlerini ya da belli bir konunun rivâyetlerini toplar. Örnek: Buhârî’nin Cüz’ü ref’i’l-yedeyn’i."},{"s":2,"x":"Terğîb-terhîb: teşvik ve sakındırma rivâyetleri. En meşhuru Münzirî’nin (656) et-Terğîb ve’t-Terhîb’i; ayrıca İbn Şâhîn (385)."},{"s":3,"x":"Zühd ve âdâb eserleri: İbn Ebi’d-Dünyâ (zemmü’l-gıybe, zemmü’l-hased, zemmü’d-dünyâ), Ebü’ş-Şeyh (Ahlâku’n-nebî), Ahmed b. Hanbel ve İbnü’l-Mübârek (Kitâbü’z-zühd), Nevevî (Riyâzü’s-sâlihîn, el-Ezkâr)."},{"s":4,"x":"Ahkâm kitapları: yalnızca ahkâm rivâyetleri, fıkhî bâblara göre. el-Müntekâ (İbn Teymiyye el-Harrânî) → şerhi Neylü’l-evtâr (Şevkânî); Bulûğu’l-merâm (İbn Hacer) → şerhi Sübülü’s-selâm (San’ânî)."},{"s":4,"x":"Umdetü’l-ahkâm: Abdülğanî el-Makdisî; el-İlmâm: İbn Dakîk, el-İmâm’ın özeti."},{"s":5,"x":"Müstakil konular: İbn Ebi’d-Dünyâ (ihlâs), Beyhakî (esmâ ve sıfât), Herevî (zemmü’l-kelâm), Nuaym b. Hammâd (fiten), İbnü’l-Mübârek (cihâd; cihad konusundaki ilk eser)."},{"s":6,"x":"Hadis dışı eserler 2 grup: hadisleri senedli rivâyet edenler ve senedsiz verip aslî kaynağa işâret edenler. Hem senedsiz hem kaynaksız olan yarar sağlamaz."},{"s":6,"x":"el-Mecmû’ (Nevevî) = el-Mühezzeb’in şerhi; el-Muğnî (İbn Kudâme) = Hırakî’nin Muhtasar’ının şerhi."},{"s":7,"x":"Tahric kitapları da dördüncü yolun üçüncü kısmındadır: Zeylaî (Keşşâf ve Hidâye), İbn Hacer (Telhîsü’l-habîr), Süyûtî (Menâhilü’s-safâ, Felkü’l-ısbâh), Irâkî (el-Muğnî)."},{"s":8,"x":"Şerhler de tahric kaynağıdır: Fethü’l-bârî (İbn Hacer) ve Umdetü’l-kârî (Aynî) Buhârî’nin; İthâfü’s-sâdeti’l-müttakîn (Zebîdî) İhyâ’nın; Fethu’l-kadîr (İbnü’l-Hümâm) Hidâye’nin şerhi."}],"oz":{"t":"Dördüncü Yol (3): Belli Bir Konuyu İçeren Eserler · Özet","intro":"C) Dinin bir yönü üzerine olanlar: cüzler, terğîb-terhîb, zühd ve fezâil, ahkâm, tahric kitapları ve şerhler.","s":[{"h":"C) Dinin Bir Yönü Üzerine","b":[{"k":"ar","a":"عَلَى جَانِبِ الدِّينِ","x":""},{"k":"tbl","r":[["Tür","Örnek"],["**1. «الأجزاء»**","«رفع اليدين في الصلاة للبخاري»"],["**2. «الترغيب والترهيب»**","«الترغيب والترهيب للمنذري»"],["**3. «الزهد والفضائل»**","«كتاب الزهد لأحمد بن حنبل، رياض الصالحين للنووي»"],["**4. «الأحكام»**","«بلوغ المرام لابن حجر»"],["**5. «كتب التخريج»**","«نصب الراية للزيلعي»"],["**6. «الشروح»**","«فتح الباري لابن حجر، عمدة القاري للعيني، كلاهما شرح صحيح البخاري»"]]},{"k":"not","x":"Eczâ türü kitaplar kaynak olarak da kullanılabilir."}]}]}},{"t":"Beşinci Yol: Metin ve Sened Hâli","intro":"Hadisin metni ve senedi üzerinde düşünülerek belirlenen vasıflardan yola çıkarak arama: metin bakımından (mevzûât, kudsî hadisler), sened bakımından (isnad latîfeleri, müselsel, mürsel, zayıf râvi), hem metin hem sened açısından (illet ve ibham).","s":[{"h":"Bu Yöntemin Maksadı","b":[{"k":"p","x":"Hadisin metin ve sened bakımından tahrici: Burada söz konusu olan, hadisin metni ve senedi üzerinde derin bir şekilde tefekkür ettikten sonra, metin ve sened bakımından belirlenen bir takım vasıflardan yola çıkarak arama yapmaktır."},{"k":"tbl","r":[["Bakılan yön","Vasıf","Başvurulan eserler"],["**1. Metin**","Uydurma alâmetleri","Mevzûât kitapları"],["**1. Metin**","Kudsî hadis","Kudsî hadisleri toplayan kitaplar"],["**2. Sened**","İsnad latîfesi (babanın oğlundan rivâyeti)","Rivâyetü’l-âbâ’ ani’l-ebnâ’"],["**2. Sened**","Müselsel","Müselsel rivâyetleri derleyen eserler"],["**2. Sened**","Mürsel","Merâsil kitapları"],["**2. Sened**","Zayıf râvi","Duafâ kitapları (Mîzânü’l-i’tidâl)"],["**3. Metin ve sened**","İllet ve ibham","İlel ve mübhemât kitapları"]]}]},{"h":"Metin Bakımından","b":[{"k":"h","x":"Uydurma alâmetleri"},{"k":"p","x":"Hadis metninde uydurma alâmetleri belirdiğinde -ki bunlar; lafızlarda rekâket (zayıflık, gevşeklik), mânâda bozukluk, Kur’ân’ın sarih anlamına zıtlık gibi konularda göze çarpar- böyle bir durumda hadis hakkında bilgi sâhibi olmak için en uygun yol; mevzûât kitaplarına mürâcaat etmektir. Ne var ki bu kitapların tahric ve tahkikli olanlarının sayısı azdır."},{"k":"p","x":"Mevzûât kitaplarından bir kısmı alfabetik olarak bir kısmı da konularına göre tertib edilmiştir. Bu kitaplardan konularına göre tertib edilenler ise daha fazladır."},{"k":"h5","x":"Alfabetik olarak tasnif edilenler"},{"k":"li","x":"Ali el-Kârî el-Herevî’nin (ö.1014/1605) el-Masnû’ fî ma’rifeti’l-hadîsi’l-mevzû’u (el-Mevzûâtü’s-suğrâ)."},{"k":"h5","x":"Konularına göre tasnif edilenler"},{"k":"li","x":"Ebü’l-Hasan Ali b. Muhammed b. Arrâk el-Kinânî’nin (ö.963/1555) Tenzîhü’ş-şerîati’l-merfûa ani’l-ehâdîsi’ş-şenîati’l-mevzûa’sı."},{"k":"h","x":"Kudsî hadis olursa"},{"k":"p","x":"O zaman sadece kudsî hadisleri toplayan kitaplardan araştırılır. Çünkü bu tür kitaplar hem hadisi hem de tahric edenlerin kaynağını veriyorlar."},{"k":"n","n":1,"x":"Muhyiddin İbnü’l-Arabî’nin (ö.638/1241) Mişkâtü’l-envâr fî mâ ruviye anillâhi sübhânehû ve teâlâ mine’l-ahbâr’ı. Eserinde senedleriyle birlikte 101 hadisi bir araya getirmiştir."},{"k":"n","n":2,"x":"Şeyh Abdurrauf el-Münâvî’nin (ö.1031/1622) el-İthâfâtü’s-seniyye bi’l-ehâdîsi’l-kudsiyye’si. Eserinde senedsiz olarak 272 hadisi bir araya getirmiş ve bunları alfabetik olarak tertib etmiştir."},{"k":"tbl","r":[["Eser","Müellif","Özellik"],["**el-Masnû’ (el-Mevzûâtü’s-suğrâ)**","Ali el-Kârî (1014)","Mevzûât, alfabetik"],["**Tenzîhü’ş-şerîa**","İbn Arrâk el-Kinânî (963)","Mevzûât, konularına göre"],["**Mişkâtü’l-envâr**","Muhyiddin İbnü’l-Arabî (638)","Kudsî, senedli 101 hadis"],["**el-İthâfâtü’s-seniyye**","Münâvî (1031)","Kudsî, senedsiz 272 hadis, alfabetik"]]}]},{"h":"Sened Bakımından","b":[{"k":"h","x":"Senedde isnad latîfeleri bulunabilir"},{"k":"p","x":"Babanın oğlundan hadis rivâyet ettiği mevcut ise; bu durumda hadisin tahricine ulaşmada en uygun yol, babaların çocuklarından yaptıkları rivâyetleri derleyen (Rivâyetü’l-âbâ’ ani’l-ebnâ’ gibi) eserlere mürâcaat etmektir."},{"k":"ornek","x":"Ebû Bekr Ahmed b. Ali el-Hatîb el-Bağdâdî’nin (ö.463/1071) Rivâyetü’l-âbâ’ ani’l-ebnâ’ı."},{"k":"h","x":"Sened müselsel olabilir"},{"k":"p","x":"Bu takdirde müselsel rivâyetleri derleyen eserlere mürâcaat edilir. Bu konuda kaleme alınan eserlerden bazıları şunlardır:"},{"k":"n","n":1,"x":"Süyûtî’nin (911) el-Müselselâtü’l-kübrâ’sı. Eserinde 85 rivâyeti bir araya getirmiştir."},{"k":"n","n":2,"x":"Muhammed b. Abdülbâkî el-Eyyûbî’nin (ö.1364/1944) el-Menâhilü’s-selsele fi’l-ehâdîsi’l-müselsele’si. Eserinde 212 rivâyeti bir araya getirmiştir."},{"k":"h","x":"Sened mürsel olabilir"},{"k":"p","x":"Bu takdirde mürsel rivâyetleri derleyen eserlere mürâcaat edilir:"},{"k":"n","n":1,"x":"Ebû Dâvûd es-Sicistânî’nin (ö.275/888) el-Merâsil mea’l-esânîd’i. Konularına göre düzenlenmiş bir eserdir."},{"k":"n","n":2,"x":"İbn Ebî Hâtim er-Râzî’nin (ö.327/938) Kitâbü’l-merâsil’i."},{"k":"h","x":"Senedde zayıf râvi olabilir"},{"k":"p","x":"Bu takdirde zayıf râvîler hakkında yazılmış (ed-Duafâ gibi) eserlere bakılır: ez-Zehebî’nin (ö.748/1374) Mîzânü’l-i’tidâl fî nakdi’r-ricâl’i."},{"k":"tbl","r":[["Sened vasfı","Eser","Müellif"],["**Babanın oğlundan rivâyeti**","Rivâyetü’l-âbâ’ ani’l-ebnâ’","Hatîb el-Bağdâdî (463)"],["**Müselsel**","el-Müselselâtü’l-kübrâ (85 rivâyet)","Süyûtî (911)"],["**Müselsel**","el-Menâhilü’s-selsele (212 rivâyet)","Muhammed b. Abdülbâkî el-Eyyûbî (1364)"],["**Mürsel**","el-Merâsil (konularına göre)","Ebû Dâvûd (275)"],["**Mürsel**","Kitâbü’l-merâsil","İbn Ebî Hâtim (327)"],["**Zayıf râvi**","Mîzânü’l-i’tidâl","Zehebî (748)"]]}]},{"h":"Hem Sened Hem Metin Açısından","b":[{"k":"p","x":"İllet ve ibham gibi bazı hususlar vardır ki; bunlar bâzen senedde bâzen metinde olabilir. Bu takdirde hadislerdeki illetleri ve kapalılıkları îzah eden kitaplara mürâcaat etmek gerekir."},{"k":"not","x":"Seneddeki kapalılık cerh ve ta’dil yapmayı ortadan kaldırması sebebiyle hadis kritiği açısından hadise zarar verirken, metindeki kapalılık hadise zarar vermez."},{"k":"h","x":"Bu eserlerden bazıları"},{"k":"n","n":1,"x":"İbn Ebî Hâtim er-Râzî’nin (ö.327/938) İlelü’l-hadîs’i. Eser konulara göre tertib edilmiştir. Her konunun altında illetli hadisler zikredilir. İllet sebepleri güzel bir şekilde açıklanır."},{"k":"n","n":2,"x":"Hatîb el-Bağdâdî’nin (ö.463/1071) el-Esmâü’l-mübheme fi’l-enbâi’l-muhkeme’si. Eserde, metindeki mübhem isimleri kapsayan hadisler zikredilir. Daha sonra kendisinde mübhem ismin sarih olarak zikredildiği başka bir tarik verilmek sûretiyle bu mübhem isim beyân edilir. Eser, mübhem isimlere nisbet edilerek alfabetik tarzda hazırlanmıştır."},{"k":"dikkat","x":"Fakat bu mübhem ismi tespit etmek gerçekten zordur. Çünkü bu mübhem şahsı bilen kişi zaten onu araştırmaya ihtiyaç duymaz. Bu mübhem şahsı bilmeyen kişi de zaten onun hadisin neresinde olduğunu bilemez."},{"k":"n","n":3,"x":"Ebû Zür’a Ahmed b. Abdirrahim el-Irâkî’nin (ö.826/1422) el-Müstefâd min mübhemâti’l-metn ve’l-isnâd’ı. Eser fıkhî konulara göre tertib edilmiş olup, bu sahada kaleme alınmış eserlerin en kapsamlısı ve en yararlısıdır."},{"k":"tbl","r":[["Eser","Müellif","Konu ve tertip"],["**İlelü’l-hadîs**","İbn Ebî Hâtim (327)","İllet; konulara göre"],["**el-Esmâü’l-mübheme**","Hatîb el-Bağdâdî (463)","Mübhem isimler; alfabetik"],["**el-Müstefâd min mübhemâti’l-metn ve’l-isnâd**","Ebû Zür’a el-Irâkî (826)","Mübhemler; fıkhî konulara göre, en kapsamlısı"]]}]}],"ht":[{"s":0,"x":"Beşinci yol: hadisin metni ve senedi üzerinde düşünülür; belirlenen vasıflardan yola çıkılarak aranır. 3 kısım: metin · sened · hem metin hem sened."},{"s":1,"x":"Uydurma alâmetleri: lafızda rekâket, mânâda bozukluk, Kur’ân’ın sarih anlamına zıtlık → mevzûât kitapları. Alfabetik: Ali el-Kârî’nin el-Masnû’u; konulara göre: İbn Arrâk’ın Tenzîhü’ş-şerîa’sı."},{"s":1,"x":"Kudsî hadisler: İbnü’l-Arabî’nin Mişkâtü’l-envâr’ı (senedli 101) ve Münâvî’nin el-İthâfâtü’s-seniyye’si (senedsiz 272, alfabetik)."},{"s":2,"x":"İsnad latîfesi (babanın oğlundan rivâyeti) → Hatîb’in Rivâyetü’l-âbâ’ ani’l-ebnâ’ı."},{"s":2,"x":"Müselsel → Süyûtî’nin el-Müselselâtü’l-kübrâ’sı (85), Eyyûbî’nin el-Menâhilü’s-selsele’si (212). Mürsel → Ebû Dâvûd ve İbn Ebî Hâtim’in Merâsil’leri. Zayıf râvi → Zehebî’nin Mîzânü’l-i’tidâl’i."},{"s":3,"x":"Hem metin hem sened (illet ve ibham): İbn Ebî Hâtim’in İlelü’l-hadîs’i; Hatîb’in el-Esmâü’l-mübheme’si (alfabetik); Ebû Zür’a el-Irâkî’nin el-Müstefâd’ı (en kapsamlı ve yararlı)."},{"s":3,"x":"Seneddeki kapalılık hadise zarar verir (cerh-ta’dil yapılamaz); metindeki kapalılık zarar vermez."}],"oz":{"t":"Beşinci Yol: Metin ve Sened Hâli · Özet","intro":"Beşinci fasıl: hadisin senet veya metninin (şüphelenmeden dolayı) incelenmesi yoluyla tahric.","s":[{"h":"Beşinci Fasıl: Beşinci Yol","b":[{"k":"ar","a":"الطَّرِيقَةُ الْخَامِسَةُ: التَّخْرِيجُ عَنْ طَرِيقِ النَّظَرِ فِي حَالِ الْحَدِيثِ مَتْنًا وَسَنَدًا.","x":"Hadisin senet veya metninin (şüphelenmeden dolayı) incelenmesi yoluyla tahric yapmak."},{"k":"p","x":"Bu yolu hadiste bulunan şüpheli bir durum karşısında kullanırız."}]},{"h":"A) Metinden Bakacaksak","b":[{"k":"p","x":"Bu konuda bakılabilecek eserler:"},{"k":"n","n":1,"x":"«المصنوع في معرفة الحديث / الموضوعات الصغرى»: hadisin ilk kelimesinden bakılır."},{"k":"n","n":2,"x":"«الأسرار المرفوعة في الأخبار الموضوعة / الموضوعات الكبرى»: hadisin konusundan bakılır. Bu iki kitap da Aliyyü’l-Kârî’ye aittir."},{"k":"p","x":"Eğer bakacağımız hadis “kudsî hadis” ise Abdurrauf el-Münâvî’nin «الإتحافات السنية بالأحاديث القدسية» eserine bakarız."}]},{"h":"B) Senetten Bakacaksak","b":[{"k":"p","x":"Hadiste mürsellik olma durumunda:"},{"k":"n","n":1,"x":"Ebû Dâvûd es-Sicistânî ve İbn Ebî Hâtim’in «المراسيل»lerine bakılır."},{"k":"n","n":2,"x":"Zehebî’nin «ميزان الاعتدال» kitabına; ayrıca bu kitaptan ricâle de bakılır, Zehebî zayıf olan râvi ile ilgili görüşünü söyler."}]},{"h":"C) Hem Metin Hem Senet","b":[{"k":"p","x":"Eğer hem metin hem de senedi beraber bakacaksak İbn Ebî Hâtim’in «علل الحديث» kitabına bakarız."},{"k":"tbl","r":[["Bakılan yön","Eser","Müellif"],["**Metin (ilk kelime)**","«المصنوع في معرفة الحديث» (el-Mevzûâtü’s-suğrâ)","Aliyyü’l-Kârî"],["**Metin (konu)**","«الأسرار المرفوعة في الأخبار الموضوعة» (el-Mevzûâtü’l-kübrâ)","Aliyyü’l-Kârî"],["**Kudsî hadis**","«الإتحافات السنية بالأحاديث القدسية»","Münâvî"],["**Sened (mürsel)**","«المراسيل»","Ebû Dâvûd · İbn Ebî Hâtim"],["**Sened (râvi)**","«ميزان الاعتدال»","Zehebî"],["**Metin ve sened**","«علل الحديث»","İbn Ebî Hâtim"]]}]}]}},{"t":"Sened Tenkidi ve Cerh-Ta’dîl","intro":"İsnad tenkidi ve hadis hakkında hüküm verme; sened ve metin, isnadın önemi, rivayeti makbul râvinin şartları, adalet ve zabtın bilinmesi, cerh-ta’dîl meseleleri ve lafızlarının mertebeleri.","s":[{"h":"Sened Tenkidi ve Hadis Hakkında Hüküm","b":[{"k":"p","x":"Sened tenkidi (cerh ve ta’dîl):"},{"k":"d","t":"İsnad tenkidi","x":"İsnadda geçen râvilerin tabakat kitaplarından araştırılması, sika ve zayıf râvilerin bilinmesi, râvilerin doğum-ölüm tarihlerine bakarak isnadda inkıta ve ittisalin bilinmesi, özellikle muan’an ise senedde tedlisin olup olmadığının bilinmesi, cerh ve ta’dil âlimlerinin görüşlerine muttali olma, senedde herkesin fark edemeyeceği gizli illeti tespit etmek için senedin derinliklerine dalma, mürsel ile mevsulu ve mevkufu maktu’dan ayırt edebilmek için sahâbe ve tâbiîni tanıma… demektir."},{"k":"p","x":"Hadis isnadı hakkında hüküm vermekten amaç, isnad tenkidini ince kâide ve usuller neticesinde varılan hükmü, örneğin: “bu isnad sahihtir”, “bu isnad zayıftır” veya “bu isnad mevzudur” diye belirtmektir."},{"k":"p","x":"Hadis metni hakkında hüküm: Sened incelemesi yaptıktan sonra hadis hakkında “Bu sened sahihtir”, “Bu sened zayıftır” şeklinde hüküm vermektir. Bu da ancak uzun süre sened araştırması yapıp da tecrübe sahibi olan birisinin yapabileceği ince kural ve sınırlı usullerle gerçekleşebilir. Bu ise sadece sened hakkındaki hükümdür."},{"k":"dikkat","x":"Metin hakkında hüküm vermek için ekstra araştırmalar yapmak lazımdır. Metinde şüzûz ve cerhedici bir illet var mı yok mu? Veya bu hadis hükmünün değişmesine sebep olabilecek şekilde başka bir sened veya senedlerle rivayet edildi mi edilmedi mi?… Bu araştırmalar neticesinde ancak “Bu hadis sahihtir”, “Bu hadis zayıftır” hükmü verilebilir."},{"k":"tbl","r":[["","İsnad hakkında hüküm","Hadis (metin) hakkında hüküm"],["**İfade**","“Bu isnad sahihtir / zayıftır / mevzudur”","“Bu hadis sahihtir / zayıftır”"],["**Gerektirdiği**","Sened incelemesi, ince kural ve usuller","Ek olarak şüzûz, illet ve başka senedlerin araştırılması"]]}]},{"h":"Sened ve Metin","b":[{"k":"p","x":"Hadis sened ve metin olarak iki kısma ayrılır."},{"k":"d","t":"Sened","x":"Lügatte “dayanılan şey” demektir. Istılahta ise; “metne ulaştıran râvi silsilelerinden meydana gelen kısımdır.”"},{"k":"d","t":"Metin","x":"Lügatte “sert ve yüksek yer” demektir. Istılahta ise; “senedin bitip de kelamın başladığı yerdir.”"}]},{"h":"İsnadın Değeri ve Önemi","b":[{"k":"p","x":"İsnad ümmet-i Muhammed’e has bir özelliktir. Daha önceki ümmetlerde böyle bir özellik olmadığı için Peygamberlerinin sahih haberleri kaybolduğu gibi, semâvî kitapları da tahrif edilmiştir. Rivâyetlerin senedli olarak nakledilmesi, bu ümmetin üzerinde titizlikle durarak takib ettikleri bir yoldur. Bundan dolayı; Hz. Peygamber’in hadislerinin ve selefe ait haberlerin senedli olarak nakledilmesi, müslümanın üzerine düşen bir görev olmuştur."},{"k":"p","x":"Bu konuda **İbnü’l-Mübârek** “İsnad dindendir, isnad olmasaydı dileyen dilediğini söylerdi”, **Süfyân-ı Sevrî** “İsnad mü’minin silahıdır” diyerek isnadın önemini vurgulamışlardır."},{"k":"p","x":"Bir rivâyette sened zincirinin bulunmasının önemi, rivâyetin Hz. Peygamber’e (sav) ulaşıp ulaşmadığının bilinmesinde ortaya çıkar. Bu da râvilerinin hallerini terceme kitaplarında araştırmakla olur. Sened olmasaydı haberlerin doğrusunu yalanından ayırt edemezdik. Bid’at ve bâtıl ehli hadis uydurmaya cüret ederdi."},{"k":"tbl","r":[["Söz","Söyleyen"],["**“İsnad dindendir, isnad olmasaydı dileyen dilediğini söylerdi.”**","İbnü’l-Mübârek"],["**“İsnad mü’minin silahıdır.”**","Süfyân-ı Sevrî"]]}]},{"h":"Cerh ve Ta’dîl ve Ricâl İlmine İhtiyaç","b":[{"k":"p","x":"İsnad tenkidi cerh-ta’dil ve râvilerin tarihi ilmine dayanıyor. Cerh ve ta’dil ilminin aşamaları şöyledir:"},{"k":"h","x":"Cerh ve ta’dil ilmine duyulan ihtiyaç"},{"k":"p","x":"Senette bulunan râviler hakkında hüküm vermek ve hadisin mertebelerini bilmek için cerh ve ta’dil ilmine ihtiyaç vardır. Çünkü isnad hakkında hüküm vermeden hadis hakkında hüküm vermek mümkün değildir. Bu yüzden münekkid âlimlerin dayandığı cerh ve ta’dil kuralları, makbul râvinin şartları, adalet ve zabtın sübutunun nasıllığı gibi hususları bilmek gerekir."},{"k":"p","x":"Araştırmacı seneddeki râvilerin biyografilerini içeren kitapları okurken, cerh ve ta’dil kurallarını, bu sanat erbabının kullandıkları ıstılah lafızlarını ve bu lafızların derecelerini adalet mertebesinin en yukarısından cerh mertebelerinin en düşüğüne kadar bilmeden herhangi bir neticeye varması düşünülemez."},{"k":"h","x":"Rivayeti makbul râvinin şartları"},{"k":"d","t":"Adalet","x":"Râvinin müslüman, âkil, bâliğ olması, büyük günah işlememesi, mürûetini zedeleyecek davranışlardan uzak durması demektir."},{"k":"d","t":"Zabt","x":"Râvinin hafızasının kötü olmaması, çok hata yapmaması, sika râvilere muhalif olmaması, aşırı gafil olmaması demektir."},{"k":"h","x":"Adalet nasıl bilinir?"},{"k":"p","x":"Cerh ve ta’dil âlimlerinden iki tanesinin o râvinin adil olduğunu cerh ve ta’dil kitaplarında belirtmesi gerekir (tansis). Ya da sika özelliği ile şöhret bulması gerekir. Böylesi râvilerin cerh ve ta’dil kitaplarında araştırılmasına gerek yoktur. Mâlik b. Enes, Evzâî gibi."},{"k":"h","x":"İbn Abdilberr’in adaletin sübutu ile ilgili görüşü"},{"k":"p","x":"Bütün ilim ehlinin yaptıkları (söyledikleri), cerhi açığa çıkmadığı sürece adalete hamledilir. Kimsenin adaletini sorgulamaya ihtiyaç duymayız diyor ve hadisi delil olarak getiriyor. Fakat ulema, bu görüşü hadisin zayıf olmasından ötürü kabul etmemiştir."},{"k":"h","x":"Râvinin zaptı nasıl bilinir?"},{"k":"p","x":"Râvinin zaptı, mutkin ve sika râvilere muvafakati ile bilinir. Az muhalefeti zarar vermez. Eğer muhalefeti çok olursa zabtı zedelenir ve hüccet olmaz."},{"k":"tbl","r":[["","Nasıl bilinir?"],["**Adalet**","İki cerh-ta’dil âliminin belirtmesi (tansis) ya da sika olarak şöhret (Mâlik b. Enes, Evzâî)"],["**Zabt**","Mutkin ve sika râvilere muvafakat; az muhalefet zarar vermez, çok muhalefet zabtı zedeler"]]}]},{"h":"Cerh ve Ta’dîl Meseleleri","b":[{"k":"h","x":"Sebep belirtmeksizin cerh ve ta’dil kabul edilir mi?"},{"k":"n","n":1,"x":"Meşhur ve sahih olan görüşe göre ta’dil, sebeplerini belirtmeksizin kabul edilir. Çünkü ta’dil sebepleri çok olduğundan hepsini tek tek belirtmek zordur."},{"k":"n","n":2,"x":"Cerh ise sebebini açıklamaksızın kabul edilmez. Çünkü insanlar çeşitli şeylerden ötürü cerh edilirler; o yüzden sebebini mutlaka belirtmesi gerekir."},{"k":"h","x":"Cerh ve ta’dil bir kişi ile gerçekleşir mi?"},{"k":"p","x":"Sahih olan görüşe göre cerh ve ta’dil, cerh ve ta’dil ehli olan bir kişiden, köle veya kadın olsa bile kabul edilir."},{"k":"h","x":"Bir râvide cerh ve ta’dilin bir araya gelmesi"},{"k":"p","x":"Cerh etme sebebi açıklanmışsa bu, ta’dilin önüne geçirilir. Açıklanmamışsa ta’dil cerhin önüne geçirilir."},{"k":"tbl","r":[["Mesele","Hüküm"],["**Sebepsiz ta’dil**","Kabul edilir (sebepleri çok olduğundan)"],["**Sebepsiz cerh**","Kabul edilmez (sebebi mutlaka belirtilmeli)"],["**Tek kişinin cerh-ta’dili**","Ehilse kabul edilir; köle veya kadın olsa bile"],["**Cerh ve ta’dil bir arada**","Cerhin sebebi açıklanmışsa cerh; açıklanmamışsa ta’dil öne geçer"]]}]},{"h":"Cerh ve Ta’dîl Lafızlarının Mertebeleri","b":[{"k":"p","x":"**İbn Ebî Hâtim er-Râzî** (ö.327/938) el-Cerh ve’t-ta’dîl isimli kitabının mukaddimesinde cerh ve ta’dîl lafızlarını 4’er gruba ayırmış ve her birinin hükmünü açıklamıştır. **Zehebî** ve **Irâkî**, Râzî’nin 1. grupta mütâlaa ettiği ta’dîl lafızlarının üzerine «ثقة ثقة»، «ثقة حجة» gibi tevsîk («التوثيق») lafızlarını tekrarlayarak ilâvede bulunmuştur."},{"k":"p","x":"**İbn Hacer el-Askalânî** ise, Zehebî ve Irâkî’nin eklediği tevsîk lafızlarının üzerine «أوثق الناس»، «أثبت الناس» gibi tafdîl («التفضيل») sîgaları kullanarak ayrı bir ilâvede bulunmuş, böylece ta’dîl lafızları 6 grupta mütâlaa edilmiştir."},{"k":"p","x":"Aynı şekilde Râzî’nin 4’e ayırarak ifâde ettiği cerh lafızlarının üzerine hadis âlimleri ilâvelerde bulunmuş, dolayısıyla cerh lafızlarından müteşekkil grup da altıya çıkmıştır."},{"k":"steps","x":["**İbn Ebî Hâtim er-Râzî:** cerh ve ta’dîl lafızları 4’er grup","**Zehebî ve Irâkî:** tekrarlanan tevsîk lafızları («ثقة ثقة»، «ثقة حجة»)","**İbn Hacer:** tafdîl sîgaları («أوثق الناس»، «أثبت الناس») → ta’dîl 6 grup; cerh de 6 grup"]}]},{"h":"Ta’dîl Lafızlarının Mertebeleri","b":[{"k":"h","x":"1. Grup"},{"k":"p","x":"Güvenilir (sika) olma konusunda mübâlağa üslûbu veya tafdîl sîgasıyla kullanılan ifâdeler:"},{"k":"ar","a":"فُلَانٌ إِلَيْهِ الْمُنْتَهَى فِي التَّثَبُّتِ","x":"Falanca doğrulukta son noktaya ulaştı."},{"k":"ar","a":"لَا أَعْرِفُ لَهُ نَظِيرًا فِي الدُّنْيَا","x":"Dünyada onun benzerini görmedim."},{"k":"ar","a":"فُلَانٌ أَثْبَتُ النَّاسِ","x":"Falanca insanların en sağlamı."},{"k":"ar","a":"فُلَانٌ أَوْثَقُ الْخَلْقِ","x":"Falanca yaratılmışların en güvenilir olanı."},{"k":"ar","a":"فُلَانٌ أَوْثَقُ مَنْ أَدْرَكْتُ مِنَ الْبَشَرِ","x":"Karşılaştığım insanların en güvenilir olanı."},{"k":"h","x":"2. Grup"},{"k":"p","x":"Tevsîk (güvenilir olduğunu) bildiren lafızların peş peşe veya te’kidli olarak kullanıldığı ifâdeler:"},{"k":"ar","a":"ثِقَةٌ ثِقَةٌ، ثِقَةٌ ثَبْتٌ، ثَبْتٌ حُجَّةٌ، ثِقَةٌ مَأْمُونٌ، ثِقَةٌ حَافِظٌ","x":""},{"k":"h","x":"3. Grup"},{"k":"p","x":"Tevsîk bildiren ancak te’kidsiz kullanılan ifâdeler:"},{"k":"ar","a":"ثِقَةٌ، حُجَّةٌ، ثَبْتٌ، كَأَنَّهُ مُصْحَفٌ، عَدْلٌ ضَابِطٌ","x":""},{"k":"li","x":"İlk 3 grupta yer alan ifâdeler hadisin sened îtibârıyla sahih seviyesinde olduğunu gösterir."},{"k":"h","x":"4. Grup"},{"k":"p","x":"Râvînin zabtına işâret etmeksizin ta’dîl (râvînin âdil olduğunu) bildiren ifâdeler:"},{"k":"ar","a":"صَدُوقٌ، مَحَلُّهُ الصِّدْقُ، لَا بَأْسَ بِهِ","x":""},{"k":"not","x":"«لا بأس به» ifâdesi Yahya b. Maîn’e göre «ثقة»، «مأمون»، «خيار» mânâsındadır. Bu grupta yer alan ifâdeler hadisin sened îtibârıyla hasen seviyesinde olduğunu gösterir."},{"k":"h","x":"5. Grup"},{"k":"p","x":"Kendisinde tecrîh ve tevsîk ile ilgili bir mânâ bulunmayan ifâdeler:"},{"k":"ar","a":"فُلَانٌ شَيْخٌ، رَوَى عَنْهُ النَّاسُ، إِلَى الصِّدْقِ مَا هُوَ، وَسَطٌ، شَيْخٌ وَسَطٌ","x":""},{"k":"h","x":"6. Grup"},{"k":"p","x":"Cerh (tecrîh) edilmeye yakın bulunduğuna işâret eden ifâdeler:"},{"k":"ar","a":"فُلَانٌ صَالِحُ الْحَدِيثِ، يُكْتَبُ حَدِيثُهُ، يُعْتَبَرُ بِهِ، مُقَارِبُ الْحَدِيثِ، صَالِحٌ","x":""},{"k":"not","x":"«يعتبر به» ifâdesi “hadisin îtibarı yapılır” mânâsındadır. 5. ve 6. grupta yer alan ifâdeler hadisin sened îtibârıyla «يسير الضعف» seviyesinde olduğunu gösterir."},{"k":"h","x":"Bu mertebelerin hükmü"},{"k":"n","n":1,"x":"Her ne kadar derece îtibârıyla birbirinden farklılık arz etse de, ilk 3 grupta yer alan râvîlerin rivâyetleriyle delil getirilir."},{"k":"n","n":2,"x":"4 ve 5. grupta yer alan râvîlerin rivâyetleriyle delil getirilmez. Ancak rivâyetleri yazılır. Zabt yönleri incelenir (ihtibâr). Rivâyetleri sika (mutkın) olan râvîlerin rivâyetlerine arz edilir. Uygunluk bulunuyorsa delil getirilir. Aksi halde delil getirilmez."},{"k":"n","n":3,"x":"6. grupta yer alan râvîlerin rivâyetleriyle delil getirilmez. Rivâyetleri, îtibâr yapmak (rivâyetin şâhit veya mütâbisinin olup olmadığını araştırmak) gâyesiyle yazılabilir. Zabt sahibi olmadıkları için rivâyetlerinin ihtibârı yapılmaz."},{"k":"h","x":"Ta’dîl tabakaları, lafızları ve verilen hükümleri gösteren tablo"},{"k":"tbl","r":[["Tabaka","Lafızlar","Hüküm"],["**1**","«فلان إليه المنتهى في التثبت - لا أعرف له نظيرا في الدنيا - فلان أثبت الناس - أوثق الخلق - أوثق من أدركت من البشر»","«صحيح»"],["**2**","«ثقة ثقة - ثقة ثبت - ثبت حجة - ثقة مأمون - ثقة حافظ»","«صحيح»"],["**3**","«ثقة - حجة - ثبت - كأنه مصحف - عدل ضابط»","«صحيح»"],["**4**","«صدوق - محله الصدق - مأمون - خيار - لا بأس به (عند غير ابن معين)»","«حسن»"],["**5**","«فلان شيخ - روى عنه الناس - إلى الصدق ما هو - وسط - شيخ وسط»","«ضعيف»"],["**6**","«فلان صالح الحديث - يكتب حديثه - يعتبر به - مقارب الحديث - صالح»","«ضعيف»"]]}]},{"h":"Cerh Lafızlarının Mertebeleri","b":[{"k":"h","x":"1. Grup"},{"k":"p","x":"Rivâyetinde zayıflık (telyin, lîn) olduğunu bildiren ifâdeler:"},{"k":"ar","a":"فُلَانٌ لَيِّنُ الْحَدِيثِ","x":"Falanın hadisi zayıf."},{"k":"ar","a":"فِيهِ مَقَالٌ","x":"Hakkında tenkit var."},{"k":"ar","a":"فِي حَدِيثِهِ ضَعْفٌ","x":"Hadisinde zayıflık var."},{"k":"ar","a":"لَيْسَ بِذَلِكَ","x":""},{"k":"ar","a":"لَيْسَ بِمَأْمُونٍ","x":"Güvenilir değil."},{"k":"h","x":"2. Grup"},{"k":"p","x":"Rivâyetiyle delil getirilemeyeceği açıkça bildirilen ifâdeler:"},{"k":"ar","a":"فُلَانٌ لَا يُحْتَجُّ بِهِ، ضَعِيفٌ، لَهُ مَنَاكِيرُ، وَاهٍ، ضَعَّفُوهُ","x":"«له مناكير»: sikaya muhalefet ettiği zamanlar olmuştur."},{"k":"p","x":"1 ve 2. gruba giren râvîlerin rivâyetleriyle delil getirilmez. Ancak bunların îtibârı yapılabilir."},{"k":"h","x":"3. Grup"},{"k":"p","x":"Rivâyetinin yazılamayacağını açıkça bildiren ifâdeler:"},{"k":"ar","a":"فُلَانٌ لَا يُكْتَبُ حَدِيثُهُ، لَا تَحِلُّ الرِّوَايَةُ عَنْهُ، ضَعِيفٌ جِدًّا، وَاهٍ بِمَرَّةٍ، طَرَحُوا حَدِيثَهُ","x":""},{"k":"h","x":"4. Grup"},{"k":"p","x":"Râvînin yalanla itham edildiğini bildiren ifâdeler:"},{"k":"ar","a":"فُلَانٌ مُتَّهَمٌ بِالْكَذِبِ، مُتَّهَمٌ بِالْوَضْعِ، يَسْرِقُ الْحَدِيثَ، سَاقِطٌ، لَيْسَ بِثِقَةٍ","x":""},{"k":"p","x":"3. gruptaki râvîlerin rivâyetleri münker, 4. gruptakilerinki ise metruktur. Her iki gruba dâhil olan râvîlerin rivâyetleri şedîdü’d-da’f seviyesindedir."},{"k":"h","x":"5. Grup"},{"k":"p","x":"Râvîde yalancılık vasfının bulunduğunu bildiren ifâdeler:"},{"k":"ar","a":"فُلَانٌ كَذَّابٌ، دَجَّالٌ، وَضَّاعٌ، يَكْذِبُ، يَضَعُ، زِنْدِيقٌ","x":""},{"k":"h","x":"6. Grup"},{"k":"p","x":"Râvînin aşırı derecede yalancı olduğunu bildiren ifâdeler:"},{"k":"ar","a":"فُلَانٌ أَكْذَبُ النَّاسِ، إِلَيْهِ الْمُنْتَهَى فِي الْكَذِبِ، هُوَ رُكْنُ الْكَذِبِ، هُوَ مَعْدِنُ الْكَذِبِ، إِلَيْهِ الْمُنْتَهَى فِي الْوَضْعِ","x":""},{"k":"p","x":"5 ve 6. gruba giren râvîlerin rivâyetleri mevzu’dur."},{"k":"h","x":"Bu mertebelerin hükmü"},{"k":"n","n":1,"x":"1 ve 2. gruba dâhil olan râvîlerin rivâyetleriyle delil getirilmez. Rivâyetleri sadece îtibar yapmak üzere yazılabilir."},{"k":"n","n":2,"x":"3, 4, 5 ve 6. gruba dâhil olan râvîlerin rivâyetleriyle delil getirilmez. Hadisleri yazılmaz. Birbirlerini destekleyip kuvvetlendirmeye uygun olmadıkları için de îtibarı yapılmaz."},{"k":"h","x":"Cerh tabakaları, lafızları ve verilen hükümleri gösteren tablo"},{"k":"tbl","r":[["Tabaka","Lafızlar","Hüküm"],["**1**","«فلان لين الحديث - فيه مقال - في حديثه ضعف - ليس بذلك - ليس بمأمون»","«لا يحتج به بل يكتب للاعتبار»"],["**2**","«فلان لا يحتج به - ضعيف - له مناكير - واه - ضعفوه»","«لا يحتج به بل يكتب للاعتبار»"],["**3**","«فلان لا يكتب حديثه - لا تحل الرواية عنه - ضعيف جدا - واه بمرة - طرحوا حديثه»","«منكر لا يحتج به ولا يعتبر به»"],["**4**","«فلان متهم بالكذب - متهم بالوضع - يسرق الحديث - ساقط - ليس بثقة»","«متروك لا يحتج به ولا يعتبر به»"],["**5**","«فلان كذاب - دجال - وضاع - يكذب - يضع - زنديق»","«موضوع لا يحتج به ولا يعتبر به»"],["**6**","«إليه المنتهى في الكذب - هو ركن الكذب - إليه المنتهى في الوضع - هو معدن الكذب»","«موضوع لا يحتج به ولا يعتبر به»"]]}]}],"ht":[{"s":0,"x":"İsnad tenkidi: râvileri tabakat kitaplarından araştırmak, sika-zayıfı bilmek, doğum-ölümle ittisal ve inkıtaı, muan’anda tedlisi, gizli illeti tespit etmek, mürsel-mevsul ve mevkuf-maktu’ ayrımı için sahâbe ve tâbiîni tanımak."},{"s":0,"x":"“Bu sened sahihtir” yalnızca sened hükmüdür; metin için şüzûz, illet ve başka senedler ayrıca araştırılır."},{"s":1,"x":"Sened: lügatte dayanılan şey; ıstılahta metne ulaştıran râvi silsilesi. Metin: lügatte sert ve yüksek yer; ıstılahta senedin bitip kelamın başladığı yer."},{"s":2,"x":"İsnad bu ümmete hastır; önceki ümmetlerde olmadığı için sahih haberler kayboldu, kitaplar tahrif edildi."},{"s":2,"x":"“İsnad dindendir…” İbnü’l-Mübârek; “İsnad mü’minin silahıdır” Süfyân-ı Sevrî."},{"s":3,"x":"Adalet: müslüman, âkil, bâliğ, büyük günah işlememe, mürûeti zedeleyecek davranıştan uzak durma. Zabt: hafızası kötü değil, çok hata yapmaz, sikalara muhalif değil, aşırı gafil değil."},{"s":3,"x":"Adalet tansis (iki âlimin belirtmesi) veya şöhretle bilinir. İbn Abdilberr: cerhi açığa çıkmayan her ilim ehli adildir; ulema hadis zayıf olduğu için kabul etmedi."},{"s":4,"x":"Ta’dil sebepsiz kabul edilir; cerh sebebi açıklanmadan kabul edilmez. Ehil tek kişinin (köle veya kadın olsa bile) cerh-ta’dili kabul edilir."},{"s":4,"x":"Cerh ve ta’dil çatışırsa: cerhin sebebi açıklanmışsa cerh, değilse ta’dil öne geçer."},{"s":5,"x":"Lafız mertebeleri: İbn Ebî Hâtim 4’er grup; Zehebî ve Irâkî tekrarlı tevsîk ekledi; İbn Hacer tafdîl sîgalarını ekledi → 6’şar grup."},{"s":6,"x":"Ta’dîl 1-3. grup (mübâlağa/tafdîl, tekrarlı tevsîk, tek tevsîk) → sahih; delil getirilir."},{"s":6,"x":"Ta’dîl 4. grup («صدوق»، «محله الصدق»، «لا بأس به») → hasen; 4-5. grup ihtibâr yapılır, uygunsa delil."},{"s":6,"x":"Ta’dîl 5-6. grup → «يسير الضعف»; 6. grup yalnızca îtibâr için yazılır. Yahya b. Maîn’e göre «لا بأس به» = sika."},{"s":7,"x":"Cerh 1-2. grup (lîn; delil olmaz) → delil getirilmez, îtibâr için yazılır."},{"s":7,"x":"Cerh 3. grup münker, 4. grup metruk (ikisi şedîdü’d-da’f); 5-6. grup (kezzâb, vaddâ’; ileri derece yalancı) mevzu’. 3-6. grup yazılmaz, îtibârı yapılmaz."}],"oz":{"t":"Sened Tenkidi ve Cerh-Ta’dîl · Özet","intro":"Ta’dîl ve cerh lafızları ve hükümleri.","s":[{"h":"Ta’dîl Lafızları","b":[{"k":"ar","a":"أَلْفَاظُ التَّعْدِيلِ","x":""},{"k":"tbl","r":[["Lafızlar","Hüküm"],["«فلان إليه المنتهى في التثبت – لا أعرف له نظيرا – فلان أثبت الناس»","«صحيح»"],["«ثقة ثبت حجة مأمون ثقة حافظ»","«صحيح»"],["«ثقة ثبت حجة عدل ضابط كأنه مصحف»","«صحيح»"],["«صدوق محله الصدق لا بأس به (أما عند ابن معين فثقة)»","«حسن»"],["«ليس فيه جرح أو تعديل شيخ روى عنه الناس وسط»","«يكتب حديثه للاعتبار»"],["«صالح الحديث يكتب حديثه يعتبر به مقارب الحديث»","«يكتب حديثه»"]]}]},{"h":"Cerh Lafızları","b":[{"k":"ar","a":"أَلْفَاظُ الْجَرْحِ","x":""},{"k":"tbl","r":[["Lafızlar","Hüküm"],["«لين الحديث فيه مقال في حديثه ضعف ليس بذلك ليس بمأمون»","«ضعيف لكن يكتب حديثه للاعتبار»"],["«لا يحتج به ضعيف له مناكير واه ضعفوه»","«ضعيف لكن يكتب حديثه للاعتبار»"],["«فلان لا يكتب حديثه ضعيف جدا لا تحل الرواية عنه طرحوا حديثه»","«منكر متروك لا يكتب حديثه»"],["«كذاب دجال وضاع يكذب يضع»","«موضوع»"],["«أكذب الناس إليه المنتهى في الكذب هو ركن الكذب إليه المنتهى في الوضع»","«موضوع»"]]}]}]}},{"t":"Ricâl Kitapları","intro":"Ricâl edebiyatı: sahâbe kitapları, tabakât kitapları, râvilerin geneline ayrılmış eserler, hususî kitapların ricâli, Kütüb-i Sitte ricâli (el-Kemâl → Tehzîbü’l-Kemâl → Tehzîbü’t-Tehzîb → Takrîb) ve sikât, duafâ ve şehir ricâli kitapları.","s":[{"h":"Ricâl Edebiyatının Amacı","b":[{"k":"p","x":"Ricâl edebiyâtı konusunda te’lif edilmiş çeşitli eserler:"},{"k":"li","x":"Râvilerin biyografileri ve tarihçe-i hayatlarına dair yazılan muhtelif eserlerin temel hedefi Hz. Peygamber’in (s.a.v.) sünnetine hizmet, O’na izafe edilen yalan ve iftiraları temizlemek, iftiracıları teşhir etmek, onlara ve iftiralarına karşı halkı uyandırmaktır."},{"k":"li","x":"Bunun için, hadis rivayet eden bütün râvilerin adlarını tespit ederek hayatlarını birçok yönden inceleme konusu yapmışlar, özellikle de onları hadis ilmindeki ehliyetleri açısından, yani cerh ve ta’dil yönünden araştırmaya tabi tutmuşlardır."},{"k":"li","x":"Bu faaliyetler sebebiyle İslam dininin düşmanları bu dine ve ortaya koyduğu fikirlere karşı açıkça mukavemete girişememişler; fakat onu temelden çökertmek için hile yolunu seçmişler; bu maksatla Hz. Peygamber adına iftira, yalan ve hadis uydurma yolunu tutmuşlardır. Hadis âlimleri ise bu durumlara karşı önlem almak için ricâl kitapları yazmışlardır."},{"k":"tbl","r":[["Ricâl eseri türü","Örnekler"],["**1. Sahâbeye dair eserler**","el-İstîâb, Üsdü’l-ğâbe, el-İsâbe"],["**2. Tabakât kitapları**","İbn Sa’d’ın et-Tabakâtü’l-kübrâ’sı, Zehebî’nin Tezkiratü’l-huffâz’ı"],["**3. Râvilerin geneline ayrılmış kitaplar**","Buhârî’nin et-Târîhu’l-kebîr’i, İbn Ebî Hâtim’in el-Cerh ve’t-ta’dîl’i"],["**4. Hususî kitapların ricâli**","Kelâbâzî, İsfahânî, İbnü’l-Kayserânî, Huzâî; Kütüb-i Sitte ricâli"],["**Sikât · duafâ · şehirler**","İclî, İbn Hibbân, İbn Şâhîn · Buhârî, Nesâî, İbn Adî, Zehebî, İbn Hacer · Târîhu Bağdâd vb."]]}]},{"h":"Sahâbeye Dair Eserler","b":[{"k":"p","x":"Ricâl edebiyâtı konusunda te’lif edilmiş eserler:"},{"k":"li","x":"Bu eserler, kimin sahâbe olduğunun bilinmesi, hadisin mevsul veya mürsel türlerinden hangisine dâhil olduğunun bilinmesi bakımından önemlidir. Senedin sona erdiği şahsın sahâbî olmadığını bilmeyen biri mürsel hadisi mevsul hadisten ayırma imkânına sahip olamaz."},{"k":"h","x":"İbn Abdilberr’in el-İstîâb fî ma’rifeti’l-ashâb’ı"},{"k":"p","x":"İbn Abdilberr (ö.463/1071)."},{"k":"li","x":"Sahâbe biyografileri konusunda müstakil olarak yazılmış en erken ve en muhtevalı eserlerden biridir."},{"k":"li","x":"Sahâbenin bütününü içerdiği iddiasıyla böyle bir isimlendirme yapıldıysa da, bu iddianın haklı olmadığı ve birçok sahâbenin bu eserde bulunmadığı görülmektedir."},{"k":"li","x":"Eserin baş tarafında özel bir bölüm halinde Hz. Peygamber’in biyografisi verilmiştir."},{"k":"li","x":"4 cilt olup içinde 3500 sahâbe vardır."},{"k":"li","x":"Alfabetik olarak tertib ettiği eserinde sahâbeyi şu şekilde sıralamıştır: a) Erkek sahâbe, b) Künyesiyle meşhur olan erkek sahâbe, c) Bin kadar hanım sahâbî, d) Künyesiyle meşhur olan hanım sahâbîler."},{"k":"h","x":"İbnü’l-Esîr’in Üsdü’l-ğâbe fî ma’rifeti’s-sahâbe’si"},{"k":"p","x":"İbnü’l-Esîr (İzzüddin Ali el-Cezerî) (ö.630/1233)."},{"k":"li","x":"Eserin baş tarafında özel bir bölüm halinde Hz. Peygamber’in biyografisi verilmiştir."},{"k":"li","x":"7 cilt olup içinde 7554 sahâbe vardır."},{"k":"li","x":"Alfabetik olarak tertib edilmiştir."},{"k":"li","x":"Eserin sonunda künyesiyle meşhur sahâbîlerin biyografileri künyelerine göre alfabetik olarak kaydedilmiştir."},{"k":"li","x":"En sonunda da 1021 hanım sahâbenin isim ve künyelerine göre yine alfabetik olarak biyografileri verilmiştir."},{"k":"li","x":"Eserin alfabetik tertibi oldukça dikkatli yapılmış, ilk harften sonra ismin sonuna kadar ikinci, üçüncü ve diğer harfler de tertipte dikkate alınmıştır. Aynı düzenleme lakaplar, baba isimleri ve kabile isimlerinde de gözetilmiştir."},{"k":"li","x":"Biyografisini yazacağı sahâbe hakkında bilgi aldığı kaynakları rumuzlarla göstermekte, bununla da yetinmeyip bu sahâbe hakkındaki bilgilere eserlerinde yer veren müelliflerin isimlerini vermektedir. Kullandığı başlıca kaynaklar ve rumuzları: İbn Mende («د»), Ebû Nuaym («ع»), İbn Abdilberr («ب») ve Ebû Musa («س»)’nın zeyilleri. Bunların zikretmediklerini istidrak ettiği gibi, yanılgılarını da beyân etmiştir."},{"k":"li","x":"Müellifin bazı biyografilerin sonundaki (ahrecehu’s-selâse) ifadesinden maksadı, zikredilen ilk üç müelliftir."},{"k":"h","x":"İbn Hacer’in el-İsâbe fî temyîzi’s-sahâbe’si"},{"k":"p","x":"İbn Hacer (852/1448)."},{"k":"li","x":"Eser son olmanın ve öncekilerin telif ve tertiplerindeki hata ve yanlışları görmenin tesiriyle, bu konuda yazılan en düzenli ve en muhtevalı eser olmuştur."},{"k":"li","x":"Giriş bölümünde üç fasıl halinde kime sahâbe denileceği, birinin sahâbîliğini bilme yollarını ve sahâbenin adaleti konularını ele almaktadır."},{"k":"li","x":"Eserini, sırasıyla sahâbe isimleri, künyeleri, hanım sahâbîler, künyeleri şeklinde alfabetik olarak tertib etmiştir. Mübhem sahâbîler bölümünü tamamlayamamıştır. Her harf ise dört bölüme ayrılmıştır:"},{"k":"n","n":1,"x":"Kısımda sahâbî olduğu kendisinin veya başkalarının rivayetiyle sabit olanların biyografileri verilmiştir."},{"k":"n","n":2,"x":"Kısımda Hz. Peygamber’in vefatı sırasında henüz çocuk olup temyiz çağının altında bulunanlar zikredilmiştir."},{"k":"n","n":3,"x":"Kısım muhadramların biyografilerine tahsis edilmiştir. Bunlar Hz. Peygamber’le görüşmedikleri için sahâbe değil tâbiînden sayılmaktadırlar ve Hz. Peygamber’e nispetle naklettikleri hadisler ittifakla mürsel sayılmaktadır. Sahâbeye tahsis edilmiş bir kitapta muhadramların yer almasının ana nedeni, bu gruptan kimselerin sahâbe ile sık sık karıştırılmaları ve sahâbe zannedilmeleridir. Bu yönüyle eser bu türden diğer çalışmalardan farklı ve orijinaldir."},{"k":"n","n":4,"x":"Kısımda sahâbe biyografisi konusunda daha önce yazılan eserlerde sahâbe olmadıkları halde sehven sahâbe gibi zikredilenler derlenmiştir. İbn Hacer bu hususta ilk defa eser yazanın kendisi olduğunu belirtmektedir."},{"k":"li","x":"Eserin son bölümünde hanım sahâbîler ve bazı hanım tâbiîlerden 1545 kişinin biyografisi ve künyesiyle meşhur olan şahıslar, yine dörtlü tasnif halinde ele alınmaktadır."},{"k":"li","x":"Biyografi sayısı 12267’dir: ricâlden isimleriyle tanınanlar 9477 kişi, künyeleriyle tanınanlar 1268 kişi, bayanlardan isim ve künyesiyle tanınanlar 1522 kişidir."},{"k":"tbl","r":[["Eser","Müellif","Cilt / sayı","Öne çıkan"],["**el-İstîâb**","İbn Abdilberr (463)","4 cilt, 3500 sahâbe","En erken ve muhtevalı; “hepsini içerir” iddiası haklı değil"],["**Üsdü’l-ğâbe**","İbnü’l-Esîr (630)","7 cilt, 7554 sahâbe","Çok dikkatli alfabetik tertip; kaynak rumuzları"],["**el-İsâbe**","İbn Hacer (852)","12267 biyografi","En düzenli ve muhtevalı; her harf 4 kısım"]]}]},{"h":"Tabakât Kitapları","b":[{"k":"li","x":"Bu tür kitaplar sahâbe döneminden başlayarak kitabın müellifinin zamanına kadar hadis râvilerinin biyografilerini tabakalar halinde tasnif edip kronolojik bir sıraya göre tertip edilmiştir."},{"k":"li","x":"Kimisi genel olarak ricâl tabakaları ile ilgili iken, kimisi de Zehebî’nin “Tabakâtü’l-Huffâz”ı, Ebû Amr ed-Dânî’nin “Tabakâtü’l-Kurrâ”sı ve Sübkî’nin “Tabakâtü’ş-Şâfiiyye”si gibi özel kimseler hakkındadır."},{"k":"h","x":"İbn Sa’d’ın et-Tabakâtü’l-kübrâ’sı"},{"k":"p","x":"Ebû Abdillah Muhammed İbn Sa’d Kâtibü’l-Vâkıdî (230/844), et-Tabakâtü’l-kübrâ."},{"k":"li","x":"Kitabın doğru ismi: Kitâbü’t-Tabakâti’l-kebîr."},{"k":"li","x":"Bu eserde Hz. Peygamber’den başlayarak sahâbe, tâbiîn, etbâu’t-tâbiîn vd. gibi müellifin zamanına kadar yaşayan şahısların biyografileri verilmektedir."},{"k":"n","n":1,"x":"Ciltte Hz. Peygamber’in hayatı ele alınmıştır."},{"k":"n","n":2,"x":"Ciltte Peygamberimizin gazveleri, hastalığı ve vefatı anlatıldıktan sonra, Medine’de fetva verecek ehliyette olanlar, Hz. Peygamber zamanında ve sonrasında Kur’ân’ın bütününü cem’ eden sahâbîler ile Hz. Peygamber sonrası Medine’de fetva veren Ensar ve Muhacir ele alınmıştır. Eser bu yönüyle de Hz. Peygamber hakkında yazılan ve kaynak olma özelliği taşıyan ilk ve en geniş biyografilerden biridir."},{"k":"n","n":3,"x":"Ciltte Bedir savaşına katılan Ensar ve Muhacirlerin biyografileri verilmektedir."},{"k":"n","n":4,"x":"Ciltte Bedir savaşına katılamamış, ancak Müslümanlıkta kıdemli olanlar ile Mekke’nin fethinden önce Müslüman olanların biyografileri verilmektedir."},{"k":"n","n":5,"x":"Ciltte Mekke, Taif, Yemen, Yemame, Bahreyn’e yerleşmiş olan sahâbîler, bu beldelerdeki tâbiîler ve takipçileri ile Medineli tâbiîlere yer verilmiştir."},{"k":"n","n":6,"x":"Ciltte Kûfe’ye tahsis edilerek buraya yerleşen sahâbe, tâbiîn ve takipçileri ile müellifin zamanına kadar buradan yetişmiş âlim, râvi ve fakihlerin biyografileri anlatılmıştır."},{"k":"n","n":7,"x":"Ciltte farklı belde ve kasabalara yerleşmiş sahâbe, tâbiîn ile müellifin zamanına kadarki takipçilerinin biyografilerine yer verilmiştir. Bu kısımda Basra, Şam ve Mısır’a yerleşenler zikredilmiş olup, diğer beldelere yerleşmiş olanlardan zikredilenler çok az sayıdadır."},{"k":"n","n":8,"x":"Ciltte hanım sahâbîlere yer verilmiştir."},{"k":"li","x":"Âlimler cerh-ta’dilde İbn Sa’d’ın sözünü makbul kabul ettiği için kitabı hadis ricâli biyografileri kaynaklarından güvenilir bir kaynak olarak itibar görmüştür."},{"k":"h","x":"Zehebî’nin Tezkiratü’l-huffâz’ı"},{"k":"p","x":"Ebû Abdillah Muhammed b. Ahmed b. Osmân ez-Zehebî (748/1347), Tezkiratü’l-huffâz."},{"k":"li","x":"Adından da anlaşıldığı gibi müellife göre sadece hadis ilminde hâfızlık ünvanına erişmiş, cerh-ta’dil konusunda içtihat ve görüşlerine başvurulan kişilerin biyografilerini ihtiva etmektedir."},{"k":"li","x":"Eserde sahâbe tabakasından başlamak üzere müellifin şeyhlerinin tabakasına kadar 1176 önemli râvinin ve hadis ilimlerinde müctehid olan şahısların biyografisine yer verilmektedir. Bu şahıslar 21 tabakaya tasnif olunarak incelenmektedir."},{"k":"li","x":"Sekiz asırlık bir zaman aralığındaki güvenilir hadis imamları ve râvilerini tanıma konusunda gerçekten önemli olan bu esere bazı âlimler tarafından zeyiller yazılarak eksiklikleri tamamlanmaya çalışılmıştır."}]},{"h":"Râvilerin Geneline Ayrılmış Kitaplar","b":[{"k":"li","x":"Bu tür eserler belirli bir kitaptaki râvilerle sınırlı değildir. Râvi niteliğine göre tasnif edilen eserlerde olduğu gibi, sika, zayıf ve benzeri belirli bir niteliğe sahip râvilerle de sınırlı değildir. Her nitelikte râvilerin biyografilerini ihtiva eden eserlerdir."},{"k":"h","x":"Buhârî’nin et-Târîhu’l-kebîr’i"},{"k":"p","x":"Muhammed b. İsmail Buhârî (256/870), et-Târîhu’l-kebîr."},{"k":"li","x":"18 yaşındayken Medine’de Hz. Peygamber’in kabri başında yazmış."},{"k":"li","x":"Muhtevasında 12315 kişinin biyografisi vardır."},{"k":"li","x":"Buhârî, bu eserini alfabetik olarak tertip etmiş olmasına rağmen, Hz. Peygamber’in ismine hürmetle adı Muhammed olanları ilk önce zikretmiştir. Tabii Hz. Peygamber’in biyografisiyle başlar."},{"k":"li","x":"Her harfin evvelinde adı o harfle başlayan sahâbîleri zikretmiştir. Sıralamada sahâbeye mahsus olarak sadece sahâbî isimlerinin harflerini dikkate almış, babalarının isimlerine itibar etmemiştir. Alfabetik tertipte aynı ismi taşıyanların sıralamasında baba ve dedelerinin ismi dikkate alınmış ve onlarda da alfabetik sıralamaya riayet edilmiştir. Bu durumda aranan şahsın babasının adının bilinmesi bu şahsı bulmayı kolaylaştıracaktır."},{"k":"li","x":"Buhârî, cerh ve ta’dil lafızlarını zikreder. Ancak cerhte latif ibareler kullanır. Mesela; “fîhi nazar”, “sekatû anhu” der. Bunlarla hadisleri terk edilmişleri ifade eder. Kullandığı en ağır ibarelerden biri “münkerü’l-hadîs” ifadesidir ki bununla rivayetini almanın caiz olmadığı kişileri kastetmektedir."},{"k":"li","x":"Çoğunlukla hakkında cerh ve ta’dil ifadeleri kullanmayıp susmayı tercih eder. Bu, râvileri ta’dil ettiği anlamına gelir."},{"k":"tbl","r":[["Buhârî’nin ifadesi","Anlamı"],["**“Fîhi nazar”, “sekatû anhu”**","Hadisleri terk edilmiş"],["**“Münkerü’l-hadîs”**","Rivayetini almak caiz değil (en ağır ibarelerinden)"],["**Sükût**","Ta’dil"]]},{"k":"h","x":"İbn Ebî Hâtim’in Kitâbü’l-Cerh ve’t-Ta’dîl’i"},{"k":"p","x":"İbn Ebî Hâtim er-Râzî (240-327/854-939), Kitâbü’l-Cerh ve’t-Ta’dîl."},{"k":"li","x":"Müellif bu eseri, genelde Buhârî’nin et-Târîhu’l-kebîr’ini ölçüt alarak te’lif etmiştir. Râvilerin cerh ve ta’dilinde söylenenleri zikretmeye önem vermiş, bu kavilleri özetlemiş ve çoğunda da kendi içtihadını ortaya koymuştur."},{"k":"li","x":"Mukaddimesiyle beraber 8 cilt olarak basılmıştır."},{"k":"li","x":"Müellif bu çalışmasına cerh-ta’dille ilgili önemli konuların olduğu bir mukaddime ile başlamıştır."},{"k":"li","x":"Biyografileri genelde kısadır; bir ile beş satır arasında değişir."},{"k":"li","x":"Eserde önce biyografisi verilecek olan şahsın adının ilk harfi ve babasının adının ilk harfi dikkate alınarak sıralama yapılmıştır. Ancak müellif, bir harf içerisinde öncelikle sahâbe ismini ve aynı şekilde çokça tekrar eden ismi takdim eder."},{"k":"li","x":"Verdiği biyografilerde râvinin ismini, babasının ismini, nisbetini, künyesini, meşhur hocalarını kaydeder, bazen de biyografi sahibinin rivayet ettiği hadislerinden zikreder."},{"k":"li","x":"Yine râvinin memleketini, seyahatlerini, konakladığı veya yerleştiği yerlerini anlattığı gibi Ehl-i sünnete aykırı ise akidesinden bahseder."},{"k":"li","x":"Bazen de ölüm tarihine işaret eder."}]},{"h":"Hususî Hadis Kitaplarının Ricâli","b":[{"k":"li","x":"Hususî biyografik eserler, çalışma hangi kitap veya kitaplar üzerine yapılmışsa sadece o kitaplardaki râvilerin biyografilerini kapsar. Adı bu kitaplarda geçmeyen râvilerin biyografileri bulunmaz."},{"k":"li","x":"Bu kitapların yazılış amacı konu edindikleri kitaplardaki râvilerin güvenirliğini ispat etmek ve bu yolla eserdeki rivayetlerin sağlamlığını kanıtlamaktır. Bunun aksinin olması, yani eleştirmek ve itibardan düşürmek amacıyla böyle çalışmaların yapılmış olması da mümkündür."},{"k":"li","x":"Bu tür kitaplar, hususî eserler ve râvileri üzerine çalışma yapacakların işlerini kolaylaştırırlar."},{"k":"li","x":"Öte yandan hususî ve sınırlı araştırma yapan müelliflerin araştırdıkları râviler hakkında daha detaylı bilgilere ulaşmaları ve genel muhtevalı ricâl kitaplarında bulunamayacak incelikleri sunabilmeleri de mümkündür."},{"k":"h","x":"Bazı örnekler"},{"k":"n","n":1,"x":"Ebû Nasr Ahmed b. Muhammed el-Kelâbâzî (398), el-Hidâye ve’l-İrşâd fî Ma’rifeti Ehli’s-Sikati ve’s-Sedâd: Sahîh-i Buhârî’ye hastır."},{"k":"n","n":2,"x":"Ebû Bekr Ahmed b. Ali el-İsfahânî (438), Ricâlü Sahîhi Müslim."},{"k":"n","n":3,"x":"Ebü’l-Fazl Muhammed b. Tâhir el-Makdisî (İbnü’l-Kayserânî) (507/1113), el-Cem’u beyne’s-Sahîhayn: Kelâbâzî ve İsfahânî’nin kitaplarını birleştirmiştir. Müellif çalışmasında tamamlayıcı ve tehzib edici bazı tasarruflarda bulunmuş ve eserde takip ettiği usulünü yazdığı mukaddimede belirtmiştir. Alfabetik olarak tertip edilmiştir."},{"k":"n","n":4,"x":"Muhammed Yahya el-Huzâî et-Temîmî, et-Ta’rîf bi-Ricâli’l-Muvatta’."},{"k":"n","n":5,"x":"Kütüb-i Sitte ve benzeri mecmuaların ricâli üzerine yapılan çalışmalar."},{"k":"tbl","r":[["Eser","Müellif","Hangi kitabın ricâli?"],["**el-Hidâye ve’l-İrşâd**","Kelâbâzî (398)","Sahîh-i Buhârî"],["**Ricâlü Sahîhi Müslim**","Ebû Bekr el-İsfahânî (438)","Sahîh-i Müslim"],["**el-Cem’u beyne’s-Sahîhayn**","İbnü’l-Kayserânî (507)","Sahîhayn (Kelâbâzî + İsfahânî)"],["**et-Ta’rîf bi-Ricâli’l-Muvatta’**","Muhammed Yahya el-Huzâî","Muvatta’"]]}]},{"h":"el-Kemâl ve Tehzîbü’l-Kemâl","b":[{"k":"p","x":"Abdülğanî el-Makdisî’nin (ö.600/1203) el-Kemâl fî esmâi’r-ricâl’i. Bu eser Kütüb-i Sitte ricâli konusunda yazılan ve bize kadar ulaşabilen ilk ve en meşhur eserlerdendir. Bu konuda kendisinden sonra yapılan bütün çalışmalara asıl teşkil etmiştir. Bu eser üzerine birçok tehzib, ihtisar vs. çalışmaları yapılmıştır:"},{"k":"n","n":1,"x":"Mizzî (ö.742/1341), Tehzîbü’l-Kemâl."},{"k":"n","n":2,"x":"Zehebî (748/1347), Tezhîbü’t-Tehzîb."},{"k":"n","n":3,"x":"Zehebî, el-Kâşif."},{"k":"n","n":4,"x":"İbn Hacer (773-852/1371-1448), Tehzîbü’t-Tehzîb adlı eseriyle ihtisar etmiştir."},{"k":"n","n":5,"x":"İbn Hacer ise Takrîbü’t-Tehzîb isimli eseriyle özetlemiştir."},{"k":"n","n":6,"x":"Zehebî’nin Tezhîb’i üzerinde Safiyyüddîn el-Hazrecî’nin (ö.923/1518) Hulâsatü Tezhîbi’t-Tehzîb isimli özeti vardır."},{"k":"steps","x":["«الكمال في أسماء الرجال» → Abdülğanî el-Makdisî","«تهذيب الكمال» → Mizzî","«تذهيب التهذيب» → «الكاشف» (Zehebî) · «خلاصة تذهيب» (Hazrecî)","«تهذيب التهذيب» → «تقريب التهذيب» (İbn Hacer)"]},{"k":"h","x":"Kütüb-i Sitte ricâli ve tevâbiinin tercemelerini ihtiva eden eserler"},{"k":"h5","x":"el-Kemâl fî Esmâi’r-Ricâl"},{"k":"p","x":"Kütüb-i Sitte ricâliyle alakalı elimize ulaşan en eski eserlerden biri; el-Kemâl fî Esmâi’r-Ricâl kitabıdır. Kitabın müellifi Hâfız Abdülğanî b. Abdülvâhid el-Makdisî’dir (v.600)."},{"k":"p","x":"Bu eser, kendisinden sonra yazılan eserler için bir altyapı teşkil eder. Ancak bu eserde müellif gereksiz uzatmalar yapmıştır. Bununla beraber bu eserdeki bazı biyografiler ilaveye, bazı mevzular izaha, birçok örnek ve görüşlerin ise düzenlenmeye ihtiyacı vardır. Hâfız İbn Hacer şöyle der: “Bu eser hadis râvilerini bilme hususunda eserlerin en değerlilerinden olup araştırmacıların en çok müracaat ettiği eserlerdendir.”"},{"k":"h5","x":"Tehzîbü’l-Kemâl"},{"k":"p","x":"Yukarıda zikrettiğimiz eserin tertib ve izaha ihtiyacı olduğunu belirtmiştik. Bu çalışmayı yapan ise Hâfız Ebü’l-Haccâc Yusuf b. ez-Zekî el-Mizzî olmuştur. Bu eseri düzenleyip ve eksik yönlerini tamamlayarak “Tehzîbü’l-Kemâl” ismini vermiştir. Hâfız İbn Hacer’in de belirttiği gibi bu çalışmasında çok başarılı olmuştur. Sübkî şöyle der: “Benzerinin yazılmadığı ve yazılamayacağı hususunda âlimler birleşmiştir.”"},{"k":"h5","x":"İkmâlü Tehzîbi’l-Kemâl"},{"k":"p","x":"Hâfız Alâüddin Moğoltay (v.762) Tehzîbü’l-Kemâl üzerine bir zeyl yazmış ve bu eserine İkmâlü Tehzîbi’l-Kemâl adını vermiştir. Bu eser de birçok faydalar ihtiva eden değerli bir eserdir. Hâfız İbn Hacer bu eserden çokça istifade ettiğini belirtmiştir."}]},{"h":"Mizzî’nin Tehzîbü’l-Kemâl’deki Yolu","b":[{"k":"p","x":"Hâfız el-Mizzî Tehzîbü’l-Kemâl eserinde şöyle bir yol izlemiştir:"},{"k":"n","n":1,"x":"Öncelikle Kütüb-i Sitte ricâli ve Kütüb-i Sitte yazarlarının diğer eserlerindeki ricâlin biyografilerini işlemiştir. Müelliflerin tarih kitaplarındaki ricâline değinmemiştir. Zira bu eserlerdeki hadisler ihticac maksadı taşımamaktadır."},{"k":"n","n":2,"x":"Her biyografide, râviden hadisi rivayet eden eserlere işaret eden rumuzlar kullanmıştır."},{"k":"n","n":3,"x":"Eserinde zikrettiği râvilerin talebe ve şeyhlerine bilgisi nisbetinde değinmiştir."},{"k":"n","n":4,"x":"Biyografisini anlattığı râvilerin şeyh ve talebelerinin isimlerini alfabetik sıralamaya bağlı kalarak zikretmiştir."},{"k":"n","n":5,"x":"Zikrettiği râvinin vefat yılını zikretmiştir. Aynı zamanda vefat yılı hakkında âlimler arasındaki ihtilafları da zikretmiştir."},{"k":"n","n":6,"x":"Halleri hakkında bir malumat sahibi olmadığı birçok râviyi zikretmiş ve “şundan rivayette bulundu” şeklinde değinmiştir. Bu râvîlerin sika mı sakat mı olduğu hakkında bilgi sahibi olmaması garipsenecek bir şey değildir. Zira binlerce râvinin halini bilmek basit bir şey değildir. Bununla beraber ahvalini bilmediği râvi sayısı eserinde küçük bir yer tutar."},{"k":"n","n":7,"x":"Kitabı, kendi rivayeti olan âlî senetli bazı hadislerle uzatmış ve bu rivayetler kitabın yaklaşık üçte biri kadar bir hacmine tekabül etmektedir."},{"k":"n","n":8,"x":"Biyografisini yazdığı râvileri alfabetik sıralamayla zikretmiştir."},{"k":"n","n":9,"x":"Cerh ve ta’dil hususunda olan görüşleri sahiplerine nisbet etmiştir. Bu görüşlerden bir kısmını ise senetsiz zikretmiştir."},{"k":"n","n":10,"x":"Kapalı ve mübhem olan bazı isimlerin ya da bunlara benzeyenlerin tertibine dikkati çekmiştir. Künyelerine, kabile ve şehirlerine değinmiştir."},{"k":"n","n":11,"x":"Eserinde üç fasıl zikretmiştir. Bu fasıllardan birincisi: eimme-i sittenin şartları ile alakalıdır. İkincisi: sikalardan rivayete özen gösterilmesi ile alakalıdır. Üçüncüsü ise; Peygamber Efendimiz’in (s.a.v.) sîreti ile alakalıdır."},{"k":"n","n":12,"x":"Kitabın aslı olan el-Kemâl’de bulunan bazı tercüme-i halleri hazfetmiştir. Zira el-Kemâl’in sahibi her ne kadar rivayetleri Kütüb-i Sitte’de var diye zikretmişse de kendisi onlara ait herhangi bir rivayet bulamadığından hazfetmeyi uygun bulmuştur."},{"k":"h","x":"Mizzî’nin bu eserinde kullanmış olduğu rumuzlar ve anlamları"},{"k":"tbl","r":[["Rumuz","Anlamı"],["«ع»","Sitte"],["4","Dört Sünen"],["«خ»","Buhârî"],["«م»","Müslim"],["«د»","Ebû Dâvûd"],["«ت»","Tirmizî"],["«س»","Nesâî"],["«ق»","İbn Mâce"],["«خت»","Buhârî - Ta’lîk"],["«بخ»","Buhârî - el-Edebü’l-Müfred"],["«ي»","Fî Cüz’i Ref’i’l-Yedeyn"],["«عخ»","Halku Ef’âli’l-İbâd"],["«ز»","Cüz’ü’l-Kırâeti Halfe’l-İmâm"],["«مق»","Müslim - Sahîh’inin Mukaddimesi"],["«مد»","Ebû Dâvûd - Merâsil"],["«قد»","Fi’l-Kader"],["«خد»","Fi’n-Nâsih ve’l-Mensûh"],["«ف»","Fî Kitâbi’t-Teferrüd"],["«صد»","Fî Fezâili’l-Ensâr"],["«ل»","Fi’l-Mesâil"],["«كد»","Müsned-i Mâlik"],["«تم»","Tirmizî - Şemâil"],["«سي»","Nesâî - Amelü’l-Yevm ve’l-Leyl"],["«كن»","Müsned-i Mâlik"],["«ص»","Fî Hasâisi Alî"],["«عس»","Müsned-i İmam Alî"],["«فق»","İbn Mâce - Tefsîr"]]}]},{"h":"Zehebî’nin Tezhîbü’t-Tehzîb’i ve el-Kâşif’i","b":[{"k":"h","x":"Tezhîbü’t-Tehzîb"},{"k":"p","x":"İmam Zehebî (v.748), şeyhi İmam Mizzî’nin eseri üzerine iki kitap telif etmiştir. Bu eserler, biri geniş hacimli “Tezhîbü’t-Tehzîb” ve daha küçük hacimli “el-Kâşif fî Ma’rifeti Men Lehû Rivâyetün fi’l-Kütübi’s-Sitte” isimli eserlerdir."},{"k":"p","x":"Hâfız İbn Hacer bu eserle alakalı şöyle demektedir: “İbareyi genelde uzatmakla beraber, Tehzîb’te olana ek bir şey söylememiştir. Bazen zan ve tahmin üzere uzatmalar, bazen de bazı râvilerin menkıbelerini zikretmiştir. Ancak ihmal etmemesi gereken cerh ve ta’dil hususunda ihmalde bulunmuştur. Oysa rivayetin zayıf yahut sahih olması buna bağlıdır.” Bununla beraber şeyhi el-Mizzî’nin zikretmediği bazı tercemelere çalışmasında yer vermiştir."},{"k":"h","x":"el-Kâşif"},{"k":"p","x":"el-Kâşif, Zehebî’nin Tehzîbü’l-Kemâl üzere yapmış olduğu bir muhtasardır. Musannif bu eserinde: râvînin ismi, bazen babası ve dedesinin ismi, künyesi, nisbeti, en meşhur şeyhleri, en meşhur öğrencilerinden iki ya da üç tanesi, râvinin cerh ve ta’dil cihetinden hali, vefat yılı vb. bilgilere yer vermiştir. Kütüb-i Sitte yazarlarından hangisi ondan rivayet etmiş remizlerle belirtmiştir. İsimleri alfabetik sıralamaya göre zikretmiş, ancak elif harfine Ahmed, mim harfine ise Muhammed isimleri ile başlamıştır."},{"k":"p","x":"Kullandığı rumuzlar: «خ» Buhârî, «م» Müslim, «د» Ebû Dâvûd, «ت» Tirmizî, «س» Nesâî, «ق» İbn Mâce, 4 Dört Sünen."}]},{"h":"İbn Hacer’in Tehzîbü’t-Tehzîb’i","b":[{"k":"p","x":"Daha sonra Hâfız İbn Hacer el-Askalânî (v.852) gelip Tehzîbü’l-Kemâl’i düzenleyip üzerine bir ihtisar çalışması yapmıştır. Bu eserine de “Tehzîbü’t-Tehzîb” ismini vermiştir. Eserini telif ederken aşağıdaki yolu izlemiştir:"},{"k":"n","n":1,"x":"Cerh ve ta’dil ile ilgili faydalı bilgileri vermekle yetinmiştir."},{"k":"n","n":2,"x":"Kitabın üçte bire yakın kısmını teşkil eden, [[Mizzî]]’nin âlî isnadıyla rivayet ettiği hadisleri hazfetmiştir."},{"k":"n","n":3,"x":"Biyografisi zikredilen râvinin birçok şeyhini hazfedip, aralarından en meşhurlarının zikriyle yetinmiştir."},{"k":"n","n":4,"x":"Genelde kısa biyografilerden bir şey hazfetmeden olduğu gibi almıştır."},{"k":"n","n":5,"x":"Biyografisi zikredilen râvinin şeyh ve talebelerini alfabetik bir sıralamaya tabi tutmamıştır. Bunun aksine sıralamada yaş, ilim vb. dikkate almıştır."},{"k":"n","n":6,"x":"Cerh ve ta’dile delalet etmeyen birçok şeyi hazfetmiştir."},{"k":"n","n":7,"x":"Kitabın dışında cerh ve ta’dil hakkında farklı ulemanın görüşlerinden ilavelerde bulunmuştur."},{"k":"n","n":8,"x":"Gerekli ilaveler yapmaktan geri durmamıştır."},{"k":"n","n":9,"x":"Biyografisini zikrettiği şahsın vefatıyla alakalı tartışmaları hazfetmiş, ancak bir maslahat gördüğünü bırakmıştır."},{"k":"n","n":10,"x":"Tehzîbü’l-Kemâl’in ricâlinden kimseyi hazfetmemiştir."},{"k":"n","n":11,"x":"Bazı biyografiler ilave edip kendi ilavesi olanların isimlerini ve babalarının isimlerini kırmızı yazıyla belirtmiştir."},{"k":"n","n":12,"x":"«قلت» şeklinde başlayan cümleler İbn Hacer’in kendi kelamı ve ilaveleridir."},{"k":"n","n":13,"x":"«ص»، «مق»، «سي» rumuzları dışında Mizzî’nin rumuzlarına bağlı kalmıştır."},{"k":"n","n":14,"x":"Mizzî’nin zikrettiği üç faslı zikretmemiştir."},{"k":"n","n":15,"x":"Zehebî’nin Tezhîbü’t-Tehzîb’inde ve Moğoltay’ın İkmâlü Tehzîbi’l-Kemâl’inde gördüğü faydalı bilgileri ilave etmiştir."},{"k":"tbl","r":[["","Tehzîbü’l-Kemâl (Mizzî)","Tehzîbü’t-Tehzîb (İbn Hacer)"],["**Şeyh ve talebeler**","Alfabetik","Yaş, ilim vb.ne göre; yalnız en meşhurları"],["**Âlî isnadlı hadisler**","Var (kitabın ~üçte biri)","Hazfedildi"],["**Üç fasıl**","Var","Yok"],["**Rumuzlar**","Mizzî’nin rumuzları","«ص»، «مق»، «سي» hariç aynı"],["**İlaveler**","—","«قلت» ile başlar; ilave biyografilerin isimleri kırmızı"]]}]},{"h":"Takrîbü’t-Tehzîb","b":[{"k":"p","x":"Çok muhtasar bir eser olup, Hâfız İbn Hacer bu eserinde Tehzîbü’t-Tehzîb isimli eserini ihtisar etmiştir. Bu kitap Tehzîbü’t-Tehzîb eserinin altıda biri kadar bir hacme sahiptir. Bu eserini, bir arkadaşının kendisinden Tehzîbü’t-Tehzîb eserinde yazılı biyografilerin sadece isimlerini zikretmesini istemesi üzerine kaleme almıştır."},{"k":"h","x":"Bu eserinde şu yolu izlemiştir"},{"k":"n","n":1,"x":"Tehzîbü’t-Tehzîb eserindeki biyografilere ilaveten, Kütüb-i Sittenin râvileriyle yetinmemiş, başka eserlerdeki râvilerin biyografilerine de değinmiştir."},{"k":"n","n":2,"x":"Tehzîbü’t-Tehzîb eserindeki rumuzlara bağlı kalmış, ancak Sünen-i Erbaa’nın rumuzu olan 4’ü «عم» ile değiştirmiştir. Bununla beraber Tehzîbü’t-Tehzîb’te olmayan «تمييز» rumuzuna da yer vermiştir. Bu rumuzu kitabın konusu olan Kütüb-i Sitte râvilerinin dışında zikrettiği râvileri belirtmek için kullanmıştır."},{"k":"n","n":3,"x":"Mukaddimede, râvilerin mertebelerini zikretmiş, bu tabakaları 12 tabakayla sınırlandırmıştır. Her mertebede kullanılan cerh ve ta’dil lafızlarını zikretmiş; bu yüzden bu kitapta araştırma yapan kimse, bu mertebelere ve mukabil geldikleri cerh ve ta’dil lafızlarına dikkat etmeli ki hata ve karışıklığa düşmesin. Zira bazılarında bu kitaba has bazı terimler kullanmıştır."},{"k":"n","n":4,"x":"Yukarıda da zikrettiğimiz gibi râvi tabakalarını 12 ile sınırlandırmıştır. Bu yüzden bu kitaptan istifade etmek isteyen araştırmacının bu tabakaları bilmesi gerekir. Ta ki İbn Hacer’in bu kitaba has ıstılahlarını bilsin."},{"k":"n","n":5,"x":"Tehzîb’ine ilave olarak bu eserine bir fasıl eklemiştir. Bu fasılda: kadın râvilerden isimleri mübhem/bilinmeyenlere yer vermiş ve bu râvileri kendilerinden rivayet eden erkek ve kadın râvilere göre tertib etmiştir."},{"k":"p","x":"Eser güzel olup bu ilmin mübtedileri için yeterli bir eserdir."}]},{"h":"Hulâsatü Tezhîbi Tehzîbi’l-Kemâl","b":[{"k":"ar","a":"خُلَاصَةُ تَذْهِيبِ تَهْذِيبِ الْكَمَالِ","x":""},{"k":"p","x":"Hâfız Safiyyüddin Ahmed b. Abdullah el-Hazrecî el-Ensârî, Zehebî’nin “Tezhîbü’t-Tehzîb” isimli kitabını büyük bir ciltte “Hulâsatü Tezhîbi Tehzîbi’l-Kemâl” ismiyle özetledi. Musannif bu kitabın mukaddimesinde şöyle diyor: “Bu kitapta çoğunlukla kaydedilmesi gereken şeyleri kaydettim. Sağlam nakillerden, güvenilir kitaplardan birçok vefat tarihleri ve faydalı ilaveler ekledim.”"},{"k":"h","x":"Musannif kitabında şu yöntemi takip etmiş"},{"k":"n","n":1,"x":"Zehebî’nin Tezhîb’inde hal tercümelerini aldığı Kütüb-i Sitte’nin ve meşhur musanneflerin ricâlinden tahrici yapılan ricâlin hal tercümelerini yapıyor. Bu musannefler Mizzî’nin bizzat Tehzîb’inde zikrettiği, Kütüb-i Sitteyle beraber 25 musanneftir."},{"k":"n","n":2,"x":"Kitabın mukaddimesinde bu musanneflerin rumuzlarını zikredip 27 rumuz olarak belirledi ki, Mizzî’nin, sonra Zehebî’nin Tezhîb’de zikrettiği rumuzlardır. Bunlara ilaveten sadece “temyîz” kelimesini ekledi."},{"k":"n","n":3,"x":"Kitabı 2 kısma ayırdı. Birinci kitabı; erkeklerin hal tercümelerine mahsus kıldı. İkinci kitabı da kadınlara mahsus kıldı. Erkeklerin hal tercümelerine tahsis ettiği kitabı iki kısım ve hâtimeye ayırdı. Birinci kısmı isimlere göre tertip etti. İkinci kısmı künyelere göre tertip edip onu da ikiye ayırdı. Hâtimeyi 8 bölüme ayırdı."},{"k":"n","n":4,"x":"İsimleri harflere göre tertip etti. Ancak alfabetik sırayı takip etmeyip mesela hemze harfine Ahmed, mim harfine Muhammed ismiyle başladı."},{"k":"n","n":5,"x":"Zehebî’nin kitabındaki hal tercümelerine bazı ilaveler yaptı. Bu ilaveleri “temyîz” kelimesiyle ifade etti."},{"k":"n","n":6,"x":"Hal tercümelerini İbn Hacer’in et-Takrîb’inde yaptığı gibi muayyen bir tarzda şekillendirmeyip bazen cerh veya tevsiki zikrediyor, bazen de zikretmiyor. Bazen vefat tarihini zikrediyor bazen de zikretmiyor. Hal tercümesini yaptığı kişinin bazı hoca ve talebelerini devamlı zikredip 1 ile 3 arası hoca ve talebe ismi sayıyor. Cerh ve ta’dil imamlarının, hal tercümesi yapılan hakkındaki görüşlerinin tamamını özetlemeyip sadece “falanca sika dedi, filanca zayıf dedi” diye zikrediyor."},{"k":"h","x":"Kitap hakkındaki son sözler"},{"k":"p","x":"Şüphesiz Hazrecî, Zehebî’nin Tezhîbü’t-Tehzîb’ini özetlerken çok emek sarf etti. Ancak bu hususta dikkat çekilmesi gereken 2 mühim şey var."},{"k":"dikkat","x":"Birincisi, hal tercümesini yaptıklarının çoğunda cerh ve ta’dili zikretmemesi ki, bu açık bir kusurdur ve kitabın ilmî değerini düşürüyor. Çünkü bu kitaba müracaat edenin gayelerinin başlıcalarındandır, hal tercümesine baktığı râvinin cerh ve ta’dil ile ilgili durumunu bilmek. İkincisi ise birçok hal tercümesinde vefat tarihlerini zikretmemesi."}]},{"h":"Diğer Ricâl Eserleri","b":[{"k":"h","x":"et-Tezkira bi-Ricâli’l-Aşera"},{"k":"ar","a":"التَّذْكِرَةُ بِرِجَالِ الْعَشَرَةِ","x":""},{"k":"p","x":"Ebû Abdullah Muhammed b. Ali el-Hüseynî ed-Dımaşkî (v.765)."},{"k":"p","x":"Bu kitap Mizzî’nin Tehzîbü’l-Kemâl’inde konu edindiği Kütüb-i Sitte’ye 4 mezheb imamının müsnedlerini ilave ederek 10 hadis kitabındaki ricâlin hal tercümelerini kapsıyor. Ancak o da hocası Mizzî gibi Kütüb-i Sitte’nin müelliflerinin bazı eserlerindeki ricâli zikretmiyor. 4 mezheb imamını şöyle rumuzlandırıyor: İmam Mâlik («ك»), İmam Şâfiî («فع»), Ebû Hanîfe («فه»), İmam Ahmed («ا»); Abdullah b. Ahmed’in babasının dışındakilerden rivayetini («عب») diye vasıflandırıyor. Kütüb-i Sitte’nin rumuzlarını aynı bırakıyor. Bu kitap çok faydalı olmakla birlikte basılmamıştır."},{"k":"h","x":"Ta’cîlü’l-Menfaa bi-Zevâidi Ricâli’l-Eimmeti’l-Erbaa"},{"k":"ar","a":"تَعْجِيلُ الْمَنْفَعَةِ بِزَوَائِدِ رِجَالِ الْأَئِمَّةِ الْأَرْبَعَةِ","x":""},{"k":"p","x":"Hâfız İbn Hacer el-Askalânî. İbn Hacer bu kitapta Mizzî’nin Tehzîb’inde almadığı 4 mezheb imamının meşhur hadis kitaplarındaki ricâli ele alıyor."},{"k":"tbl","r":[["","et-Tezkira bi-Ricâli’l-Aşera","Ta’cîlü’l-Menfaa"],["**Müellif**","el-Hüseynî ed-Dımaşkî (765)","İbn Hacer"],["**Kapsam**","Kütüb-i Sitte + 4 mezheb imamının müsnedleri = 10 kitap","Tehzîb’de olmayan, 4 imamın kitaplarındaki ricâl"],["**Rumuzlar**","«ك» Mâlik, «فع» Şâfiî, «فه» Ebû Hanîfe, «ا» Ahmed, «عب» Abdullah b. Ahmed","—"]]},{"k":"h","x":"Sadece sikâtı anlatan kitaplar"},{"k":"n","n":1,"x":"Kitâbü’s-Sikât: Ebü’l-Hasen Ahmed b. Abdullah b. Sâlih el-İclî (v.261)."},{"k":"n","n":2,"x":"Kitâbü’s-Sikât: Muhammed b. Ahmed b. Hibbân el-Bustî (v.354). Müellif kitabı râvilerin tabakalarına göre tertip etmiş, her tabakanın isimlerini de alfabetik olarak yazmış."},{"k":"n","n":3,"x":"Târîhu Esmâi’s-Sikât mimmen nukile anhümü’l-ilm: Ömer b. Ahmed b. Şâhîn (385). Müellif kitabında râvilerin isimlerini alfabetik olarak zikrediyor."},{"k":"h","x":"Sadece zayıf râvileri anlatan kitaplar"},{"k":"n","n":1,"x":"ed-Duafâü’l-Kebîr: Buhârî."},{"k":"n","n":2,"x":"ed-Duafâü’s-Sağîr: Buhârî."},{"k":"n","n":3,"x":"Kitâbü’d-Duafâ: Nesâî."},{"k":"n","n":4,"x":"Ma’rifetü’l-Mecrûhîn mine’l-Muhaddisîn: Ebû Hâtim Ahmed b. Hibbân el-Bustî (v.354)."},{"k":"n","n":5,"x":"el-Kâmil fî Duafâi’r-Ricâl: Ebû Ahmed Abdullah b. Adî el-Cürcânî (v.365)."},{"k":"n","n":6,"x":"Mîzânü’l-İ’tidâl: Zehebî. Zayıf râviler hakkında yazılmış en derli toplu kitaptır. 11.053 râvi hakkında bilgi veriyor. Kitabın yazımında İbn Adî’nin el-Kâmil’de takip ettiği metod izlenmiş."},{"k":"n","n":7,"x":"Lisânü’l-Mîzân: İbn Hacer el-Askalânî. Bu kitapta müellif Mîzânü’l-İ’tidâl’deki hal tercümelerini alıp, Tehzîbü’l-Kemâl’de olmayanlara ilave olarak eklemeler yapmıştır. Kitap alfabetik olarak hazırlanmış, isimlerden sonra künyeler zikrediliyor."},{"k":"h","x":"Belirli şehirlerdeki ricâli anlatan kitaplar"},{"k":"n","n":1,"x":"Târîhu Vâsıt: Ebü’l-Hasen el-Vâsıtî (v.288)."},{"k":"n","n":2,"x":"Muhtasaru Tabakâti Ulemâi İfrîkıyye ve Tûnus: Ebü’l-Arab Ahmed el-Kayrevânî (v.333)."},{"k":"n","n":3,"x":"Târîhu Rakka: Muhammed b. Saîd el-Kuşeyrî (v.334)."},{"k":"n","n":4,"x":"Dâreyyâ: Abdülcebbâr el-Cevlânî ed-Dârânî (v.370)."},{"k":"n","n":5,"x":"Zikru Ahbâri İsbahân: Ebû Nuaym el-İsbahânî (v.370)."},{"k":"n","n":6,"x":"Târîhu Bağdâd: Hatîb el-Bağdâdî (v.463)."},{"k":"tbl","r":[["Tür","Eser","Müellif"],["**Sikât**","Kitâbü’s-Sikât","İclî (261)"],["**Sikât**","Kitâbü’s-Sikât (tabakalara göre)","İbn Hibbân (354)"],["**Sikât**","Târîhu Esmâi’s-Sikât","İbn Şâhîn (385)"],["**Duafâ**","ed-Duafâü’l-Kebîr · ed-Duafâü’s-Sağîr","Buhârî"],["**Duafâ**","Kitâbü’d-Duafâ","Nesâî"],["**Duafâ**","Ma’rifetü’l-Mecrûhîn","İbn Hibbân (354)"],["**Duafâ**","el-Kâmil fî Duafâi’r-Ricâl","İbn Adî (365)"],["**Duafâ**","Mîzânü’l-İ’tidâl (11.053 râvi)","Zehebî"],["**Duafâ**","Lisânü’l-Mîzân","İbn Hacer"],["**Şehir**","Târîhu Bağdâd","Hatîb el-Bağdâdî (463)"]]}]}],"ht":[{"s":0,"x":"Ricâl kitaplarının hedefi: sünnete hizmet, Hz. Peygamber’e izafe edilen yalan ve iftiraları temizlemek, iftiracıları teşhir etmek; râviler özellikle cerh-ta’dil yönünden araştırıldı."},{"s":1,"x":"Sahâbe kitapları mürseli mevsulden ayırmak için önemlidir. el-İstîâb (İbn Abdilberr, 4 cilt, 3500), Üsdü’l-ğâbe (İbnü’l-Esîr, 7 cilt, 7554), el-İsâbe (İbn Hacer, 12267 biyografi)."},{"s":1,"x":"Üsdü’l-ğâbe rumuzları: «د» İbn Mende, «ع» Ebû Nuaym, «ب» İbn Abdilberr, «س» Ebû Musa; “ahrecehu’s-selâse” = ilk üç müellif."},{"s":1,"x":"el-İsâbe’de her harf 4 kısım: sahâbîliği sabit olanlar · vefatta temyiz çağının altındaki çocuklar · muhadramlar (tâbiîn; hadisleri mürsel) · yanlışlıkla sahâbe sayılanlar (bu kısımda ilk eser)."},{"s":2,"x":"Tabakât: râviler sahâbeden müellifin zamanına kadar tabakalar halinde, kronolojik. Özel tabakâtlar: Zehebî (huffâz), Dânî (kurrâ), Sübkî (Şâfiiyye)."},{"s":2,"x":"İbn Sa’d’ın et-Tabakâtü’l-kübrâ’sı (doğru adı Kitâbü’t-Tabakâti’l-kebîr): 8 cilt; 1. cilt Hz. Peygamber, 8. cilt hanım sahâbîler. İbn Sa’d’ın cerh-ta’dildeki sözü makbuldür."},{"s":2,"x":"Zehebî’nin Tezkiratü’l-huffâz’ı: 1176 hâfız, 21 tabaka; zeyiller yazıldı."},{"s":3,"x":"et-Târîhu’l-kebîr: Buhârî 18 yaşında Medine’de kabr-i şerif başında yazdı; 12315 biyografi; alfabetik ama önce “Muhammed” adlılar; her harfte önce sahâbîler."},{"s":3,"x":"Buhârî cerhte latif ibare kullanır: “fîhi nazar”, “sekatû anhu”; en ağırı “münkerü’l-hadîs”. Sükûtu ta’dildir."},{"s":3,"x":"İbn Ebî Hâtim’in el-Cerh ve’t-ta’dîl’i: et-Târîhu’l-kebîr’i ölçüt alır; 8 cilt; biyografiler 1-5 satır; ismin ve baba isminin ilk harfine göre."},{"s":4,"x":"Hususî ricâl kitapları yalnızca konu edindikleri kitabın râvilerini kapsar; amaç râvilerin ve rivayetlerin güvenirliğini ispattır."},{"s":4,"x":"Buhârî ricâli: Kelâbâzî’nin el-Hidâye ve’l-İrşâd’ı; Müslim ricâli: İsfahânî; ikisini birleştiren İbnü’l-Kayserânî; Muvatta’ ricâli: Huzâî."},{"s":5,"x":"el-Kemâl fî esmâi’r-ricâl (Abdülğanî el-Makdisî, 600): Kütüb-i Sitte ricâlinde bize ulaşan ilk eser; sonraki çalışmaların aslı."},{"s":5,"x":"Tehzîbü’l-Kemâl: Mizzî; Sübkî: “benzeri yazılmadı ve yazılamaz.” Zeyli: Moğoltay’ın İkmâlü Tehzîbi’l-Kemâl’i."},{"s":6,"x":"Tehzîbü’l-Kemâl: Kütüb-i Sitte ve yazarlarının diğer eserlerinin ricâli (tarih kitapları hariç); şeyh ve talebeler alfabetik; vefat ihtilafları; âlî senetli hadisler kitabın üçte biri; üç fasıl (eimme-i sittenin şartları, sikalardan rivayet, sîret)."},{"s":6,"x":"Mizzî rumuzları: «ع» sitte, 4 dört sünen, «خت» ta’lîk, «بخ» el-Edebü’l-Müfred, «مق» Müslim’in Mukaddimesi, «مد» Merâsil, «تم» Şemâil, «سي» Amelü’l-Yevm ve’l-Leyl, «فق» İbn Mâce Tefsîr."},{"s":7,"x":"Zehebî’nin Mizzî üzerine iki eseri: geniş Tezhîbü’t-Tehzîb ve küçük el-Kâşif. İbn Hacer’e göre Tezhîb ek bir şey söylemez, cerh-ta’dilde ihmalde bulunur."},{"s":7,"x":"el-Kâşif: alfabetik ama elif harfinde önce Ahmed, mim harfinde önce Muhammed; rumuzları «خ م د ت س ق» ve 4."},{"s":8,"x":"Tehzîbü’t-Tehzîb (İbn Hacer): cerh-ta’dile odaklanır; âlî isnadlı hadisleri ve üç faslı atar; şeyh ve talebeleri yaş ve ilme göre sıralar; kimseyi hazfetmez; ilaveleri «قلت» ile, ilave biyografi isimleri kırmızı."},{"s":9,"x":"Takrîbü’t-Tehzîb: İbn Hacer, Tehzîbü’t-Tehzîb’in altıda biri; Sünen-i Erbaa rumuzu 4 yerine «عم»; Kütüb-i Sitte dışı râviler için «تمييز»; mukaddimede 12 tabaka; mübtediler için yeterli."},{"s":10,"x":"Hulâsa: Hazrecî, Zehebî’nin Tezhîb’inin özeti; 25 musannef, 27 rumuz + “temyîz”; hemzede önce Ahmed, mimde önce Muhammed. Kusurları: çoğunda cerh-ta’dil ve birçoğunda vefat tarihi yok."},{"s":11,"x":"Sikât kitapları: İclî (261), İbn Hibbân (354, tabakalara göre), İbn Şâhîn (385, alfabetik)."},{"s":11,"x":"Duafâ kitapları: Buhârî (Kebîr, Sağîr), Nesâî, İbn Hibbân (el-Mecrûhîn), İbn Adî (el-Kâmil), Zehebî (Mîzânü’l-İ’tidâl, en derli toplu, 11.053 râvi, el-Kâmil’in metodu), İbn Hacer (Lisânü’l-Mîzân)."},{"s":11,"x":"Şehir ricâli: Târîhu Vâsıt, İfrîkıyye ve Tûnus, Rakka, Dâreyyâ, İsbahân (Ebû Nuaym), Târîhu Bağdâd (Hatîb)."}],"oz":{"t":"Ricâl Kitapları · Özet","intro":"İkinci bâb: hadisin hükmünü belirleme ve senet çalışmaları. Bu bölümdeki kaynak eserler ricâl kitaplarıdır.","s":[{"h":"İkinci Bâb: Hadisin Hükmünü Belirleme ve Senet Çalışmaları","b":[{"k":"p","x":"Bu bölümü uygulamalı olarak göreceğiz. Bu bölümdeki kaynak eserler “**ricâl kitapları**”dır:"},{"k":"ar","a":"الْمُؤَلَّفَاتُ فِي الرِّجَالِ","x":""},{"k":"ar","a":"أ- فِي الصَّحَابَةِ، ب- كُتُبُ الطَّبَقَاتِ، ت- الْكُتُبُ الْمَخْصُوصَةُ، ث- الْكُتُبُ فِي الثِّقَاتِ، ج- الْكُتُبُ فِي الضُّعَفَاءِ","x":""}]},{"h":"Sahâbe ve Tabakât Kitapları","b":[{"k":"h","x":"أ- الكتب التي صنفت في الصحابة"},{"k":"tbl","r":[["Eser","Müellif"],["«الاستيعاب في معرفة الأصحاب»","«ابن عبد البر»"],["«أسد الغابة في معرفة الصحابة»","«ابن الأثير»"],["«الإصابة في تمييز الصحابة»","«ابن حجر»"]]},{"k":"h","x":"ب- الكتب التي صنفت في الطبقات"},{"k":"tbl","r":[["Eser","Müellif"],["«الطبقات الكبرى»","«ابن سعد»"],["«التاريخ الكبير»","«البخاري»"],["«الجرح والتعديل»","«ابن أبي حاتم»"],["«سير أعلام النبلاء»","«ذهبي»"],["«حلية الأولياء»","«أبو نعيم»"]]}]},{"h":"Mahsus Kitaplar","b":[{"k":"h","x":"ت- الكتب المخصوصة"},{"k":"ar","a":"الْكَمَالُ فِي أَسْمَاءِ الرِّجَالِ: الْمَقْدِسِيُّ","x":""},{"k":"ar","a":"تَهْذِيبُ الْكَمَالِ: يُوسُفُ الْمِزِّيُّ (هَذَا الْكِتَابُ مُخْتَصَرُ كِتَابِ الْمَقْدِسِيِّ)","x":""},{"k":"p","x":"Yusuf Mizzî’nin “**Tehzîbü’l-Kemâl**” kitabını **iki kişi ihtisar** etmiştir:"},{"k":"n","n":1,"x":"**Zehebî**, “Tezhîbü’t-Tehzîb” isimli eseriyle ihtisar etmiş, sonra bu kitabını da “**el-Kâşif**” adındaki eseriyle ihtisar etmiştir."},{"k":"n","n":2,"x":"**İbn Hacer**, “Tehzîbü’t-Tehzîb” isimli eseriyle ihtisar etmiş, sonra da bu eserini “**Takrîbü’t-Tehzîb**” adındaki eseriyle ihtisar etmiştir."},{"k":"steps","x":["«الكمال في أسماء الرجال» (Makdisî)","«تهذيب الكمال» (Mizzî)","Zehebî: «تذهيب التهذيب» → «الكاشف» · İbn Hacer: «تهذيب التهذيب» → «تقريب التهذيب»"]}]},{"h":"Sikât ve Duafâ Kitapları","b":[{"k":"h","x":"ث- الكتب التي صنفت في الثقات"},{"k":"tbl","r":[["Eser","Müellif"],["«كتاب الثقات»","«العجلي»"],["«كتاب الثقات»","«ابن حبان»"]]},{"k":"h","x":"ج- الكتب التي صنفت في الضعفاء"},{"k":"tbl","r":[["Eser","Müellif"],["«الضعفاء الكبير»","«البخاري»"],["«الضعفاء الصغير»","«البخاري»"],["«الضعفاء والمتروكون»","«النسائي»"],["«الكامل في الضعفاء»","«ابن عدي»"],["«كتاب المجروحين»","«أبو حاتم»"],["«ميزان الاعتدال»","«ذهبي»"],["«لسان الميزان»","«ابن حجر»"]]}]}]}},{"t":"İsnad İncelemesi ve Hadise Hüküm","intro":"İsnad incelemesinin mertebeleri: senedi araştırılmayan hadisler, hüküm verilmemiş hadislerde araştırma ihtiyacı, senedleri araştırma yöntemi, örnek bir isnad araştırması ve hadise hüküm
